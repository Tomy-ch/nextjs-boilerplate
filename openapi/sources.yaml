# 取り込む契約の座標。`make fetch-api` がこの宣言に従って取得する。
#
# name / repo / path / ref は人が宣言する。sha / fetchedAt は取得時にスクリプトが
# 書き戻すため手で編集しない。取得物は `openapi/<name>.gen.yaml` に落ちる。
sources:
  # sample:begin
  # go-boilerplate 本体の API 契約。admin と一般が同居しており、tags でも security でも
  # scope でも機械的に分割できないため 1 ユニットとして扱う。
  - name: api
    repo: Tomy-ch/go-boilerplate
    path: openapi/openapi.gen.yaml
    # コミット SHA で固定する。tag v2.1.0 には /v1/products が存在せず、商品 API は未タグの
    # release/v2.2.0 にしかない。上流の進展の取り込みはこの ref の書き換えとして明示的に行う。
    ref: 80bdf883e0d82c6f95ba32e9ad2f31944f836354
    sha: 9abecab274c548289b83d381402d6ff03387c636
    fetchedAt: 2026-08-17T15:36:37.734Z
  # mock OIDC Provider の契約。go-boilerplate 本体とは別サービスであり、認証の契約はこちらが正
  # (docs/screens.md §0)。本体の契約には認証エンドポイントが存在しない。
  - name: auth
    repo: Tomy-ch/go-boilerplate
    path: mock-auth-server/openapi/openapi.gen.yaml
    ref: 669ae0f65e156377047127bbabc7fb7f621ca89e
    sha: ceadce304cfcf6ce8a94f39f9be6968736d49882
    fetchedAt: 2026-08-13T19:37:10.094Z
  # sample:end
