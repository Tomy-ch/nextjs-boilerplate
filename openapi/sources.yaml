# 取り込む契約の座標。`make fetch-api` がこの宣言に従って取得する。
#
# name / repo / path / ref は人が宣言する。sha / fetchedAt は取得時にスクリプトが
# 書き戻すため手で編集しない。取得物は `openapi/<name>.gen.yaml` に落ちる。
sources:
  # sample:begin
  # go-boilerplate 本体の API 契約。admin と一般が同居しており、tags でも security でも
  # scope でも機械的に分割できないため 1 ユニットとして扱う。
  - name: api
    repo: Tomy-ch/go-boilerplate
    path: openapi/openapi.gen.yaml
    # コミット SHA で固定する。商品 API は未タグの release/v2.2.0 にしかなく、tag では指せない。
    # 上流の進展の取り込みはこの ref の書き換えとして明示的に行う。
    ref: fa6264452ae2cb430d998d652b68fb246f8a8ad1
    sha: f6c9463a6a26a31ca4ddc9c7b644d3187ff6a086
    fetchedAt: 2026-08-23T15:37:47.976Z
  # sample:end
