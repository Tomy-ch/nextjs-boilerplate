# ----- パッケージ構成 -----
# docs-viewer はアプリ本体と依存を共有しない。描画するのが repo 所有のドキュメントであり、
# 利用者が投稿する内容を扱うアプリ本体とは無害化の許容範囲が違うため、広い allowlist を
# アプリから import できない位置に置く。分離を規約ではなくパッケージ境界で担保する。
packages:
  - "."
  - "docs-viewer"

# ----- 時間差防御 -----
# pnpm は semver 種別ごとの冷却期間を設定できないため、minor の7日を一律下限にする。
minimumReleaseAge: 10080
# 緊急のセキュリティ修正は、影響を受ける特定バージョンだけを一時的に例外化する。(パッケージ名だけの例外は禁止)
minimumReleaseAgeExclude:
  - conventional-commits-parser@7.1.1 # 2026-08-02 20:34 JST 以降に削除する。@commitlint の開発時依存であり、既知脆弱性なしを確認済み。
# 冷却期間を満たす版がなければ解決を失敗させる。
minimumReleaseAgeStrict: true
# 公開日時を返さないレジストリの依存は解決を失敗させる。
minimumReleaseAgeIgnoreMissingTime: false

# ----- 推移的依存の版の固定 -----
# 直接依存でないパッケージの版を動かす唯一の手段。`pnpm update <pkg>` は直接依存にしか届かない。
#
# 宣言は「対象@脆弱な範囲: 置き換える範囲」の形で書き、脆弱な範囲を外れた版には当たらないようにする。
# こうしておくと上流が自力で上げた時点で宣言が無効化され、撤去し忘れても古い版に固定し続けない。
# 各行には理由と撤去条件をコメントで添える。
#
# **上流が宣言した範囲の内側でだけ使う。** 範囲の外へ動かすと、上流が検証していない組み合わせを
# こちらで作ることになる ([ADR 0110](docs/adr/0110-security-operations.md))。
overrides:
  # ajv (commitlint / orval / shadcn / @hookform/resolvers が引く) の推移的依存。
  # GHSA-7p8r-x3mc-p8w7 (high): authority 部のバックスラッシュで host の解釈が他のパーサとずれる。
  # ajv の宣言は ^3.0.1 で 3.1.5 はその内側。ajv が 3.1.5 以上を要求したら撤去する。
  "fast-uri@<3.1.5": ">=3.1.5 <4"

# 依存状態が lockfile と一致しないままスクリプトを実行しない。
verifyDepsBeforeRun: error

# mise.toml[SSOT] と同じ Node.js 版を依存の engine 判定にも使う。
nodeVersion: 24.14.1
# Node.js の対応範囲外を宣言する依存の導入を拒否する。
engineStrict: true

# ----- 実行制御 -----
# 未レビューの依存ライフサイクルスクリプトを install エラーにする。
strictDepBuilds: true
# 依存ライフサイクルスクリプトの実行可否をパッケージ単位で明示する。
allowBuilds:
  lefthook: false
  esbuild: false
  msw: false
  protobufjs: false
  sharp: false
  unrs-resolver: false

# ----- 公開元の信頼性 -----
# 間接依存による Git・URL などの非標準ソースを拒否する。
blockExoticSubdeps: true
# 過去より弱い provenance に下がった版の導入を拒否する。
trustPolicy: no-downgrade
# 公開から180日を過ぎた版は provenance 情報不足だけでは拒否しない。
trustPolicyIgnoreAfter: 259200
