# ----- パッケージ構成 -----
# docs-viewer は依存を共有しない別パッケージ。2 つをここへ並べることが、その境界の宣言にあたる。
packages:
  - "."
  - "docs-viewer"

# ----- 時間差防御 -----
# pnpm は semver 種別ごとの冷却期間を設定できないため、minor の7日を一律下限にする。
minimumReleaseAge: 10080
# 緊急のセキュリティ修正は、影響を受ける特定バージョンだけを一時的に例外化する。(パッケージ名だけの例外は禁止)
# 項目は `name@version` で書き、直上のコメントに理由と、窓が明ける日（YYYY-MM-DD）を添える。
# 週次の棚卸し（make suppression-expiry）が宣言単位で読み、どちらか欠けていれば落ちる。
minimumReleaseAgeExclude: []
# 冷却期間を満たす版がなければ解決を失敗させる。
minimumReleaseAgeStrict: true
# 公開日時を返さないレジストリの依存は解決を失敗させる。
minimumReleaseAgeIgnoreMissingTime: false

# ----- 推移的依存の版の固定 -----
# 直接依存でないパッケージの版を動かす唯一の手段。`pnpm update <pkg>` は直接依存にしか届かない。
#
# 宣言は「対象@脆弱な範囲: 置き換える範囲」の形で書く。脆弱な範囲を外れた版に当たらないので、
# 上流が自力で上げた時点で無効化され、撤去し忘れても古い版に固定し続けない。各行には理由と
# 撤去条件を添える。**上流が宣言した範囲の内側でだけ使う** —— 外へ動かすと、上流が検証して
# いない組み合わせをこちらで作ることになる。
overrides:
  # ajv (commitlint / orval / shadcn / @hookform/resolvers が引く) の推移的依存。
  # GHSA-7p8r-x3mc-p8w7 (high): authority 部のバックスラッシュで host の解釈が他のパーサとずれる。
  # GHSA-5jgf-p345-68v8 / GHSA-f65p-4m7j-42xc / GHSA-fph4-wmhf-6fwf / GHSA-jqff-g426-hqxp (high):
  # 同じ URI 解析の取り違えが 3.1.5 にも残っており、3.1.6 で塞がれた。
  # GHSA-58mr-gqgx-xq4g / GHSA-qw65-cvwx-89v3 (high): authority の閉じない角括弧による host の
  # 取り違えと、serialize が port を検証せず authority を差し込める件。3.1.7 で塞がれた。
  # ajv の宣言は ^3.0.1 で 3.1.7 はその内側。ajv が 3.1.7 以上を要求したら撤去する。
  "fast-uri@<3.1.7": ">=3.1.7 <4"
  # dompurify (mermaid が引く) の推移的依存。mermaid は docs-viewer の実行時依存なので、これは
  # 公開されるドキュメントサイトで browser 上を走る。
  # GHSA-4gpp-cmpq-32hh (moderate): IN_PLACE hook の削除で切り離された部分木が実行可能なまま残り
  # XSS になる。
  # GHSA-p98j-92pf-mc4p (low): 3.4.13〜3.4.15 でも、hook がノードを消すと切り離された部分木の
  # event handler が生きたまま残り、DOM XSS になる。
  # mermaid の宣言は ^3.3.3 で 3.4.16 はその内側。mermaid が 3.4.16 以上を要求したら撤去する。
  "dompurify@<3.4.16": ">=3.4.16 <4"
  # minimatch (glob 経由で Storybook の依存、typescript-eslint、eslint が引く) の推移的依存。
  # GHSA-cchq-frgv-rjh5 (high): 展開の中間結果に上限が無く、短い入力で処理が止まらなくなる。
  # GHSA-6j4f-fj2g-mc7p / GHSA-qhr7-859c-m2p7 (high): カンマ区切りと入れ子の波括弧の再帰に上限が
  # 無く、スタックを使い切る。GHSA-q2hr-2g5m-vwhr (moderate): `{a},b}` の書き換えが入力長に対して
  # 二次で伸びる。5.0.12 で 3 件とも塞がれた。
  # minimatch の宣言は ^5.0.5 / ^5.0.8 で 5.0.12 はその内側。minimatch が 5.0.12 以上を要求したら撤去する。
  "brace-expansion@<5.0.12": ">=5.0.12 <6"
  # cosmiconfig (commitlint が引く) の推移的依存。
  # GHSA-pmgw-qhcx-hj4c (high): !!omap の解決が入力長に対して二次で伸びる。
  # cosmiconfig の宣言は ^4.1.0 で 4.3.1 はその内側。cosmiconfig が 4.3.1 以上を要求したら撤去する。
  "js-yaml@>=4 <4.3.1": ">=4.3.1 <5"
  # typedoc (orval が引く) の推移的依存。API 型の生成時にしか走らず、配信物には入らない。
  # GHSA-253c-mchw-3w2r (moderate): linkify を有効にすると 2 つの経路が入力長に対して二次で伸びる。
  # typedoc の宣言は ^14.3.0 で 14.3.1 はその内側。typedoc が 14.3.1 以上を要求したら撤去する。
  "markdown-it@<14.3.1": ">=14.3.1 <15"
  # postcss の推移的依存。
  # GHSA-8v8w-v8xg-79rf (high): 自前の生成器を渡すと終わらない場合がある。
  # postcss の宣言は ^3.3.6 で 3.3.18 はその内側。postcss が 3.3.18 以上を要求したら撤去する。
  "nanoid@>=3 <3.3.18": ">=3.3.18 <4"
  # body-parser（shadcn CLI > @modelcontextprotocol/sdk > express が引く）の推移的依存。
  # GHSA-4mjr-xmp4-gh2g / GHSA-x5fp-wj9c-mxmx (high): 配列・オブジェクトの解析が入力長に対して
  # 伸びる。body-parser の宣言は ^6.15.2 で 6.16.0 はその内側。
  # body-parser が 6.16.0 以上を要求したら撤去する。
  "qs@<6.16.0": ">=6.16.0 <7"
  # @modelcontextprotocol/sdk（shadcn CLI が引く）の推移的依存。
  # GHSA-8j4g-w8fx-2239 / GHSA-f23p-vx2j-j53r / GHSA-54fx-42gc-7vw4 / GHSA-79qm-7rj5-m7r9:
  # CORS の ReDoS、memo() の SSR 出力の持ち越し、Language Middleware の DoS、Proxy Helper の
  # ヘッダ残留。
  # GHSA-hxh3-vqpv-xpqv (moderate): hono/jsx の境界コンポーネントが文字列をエスケープせずに描き XSS になる。
  # sdk の宣言は ^4.11.4 で 4.13.7 はその内側。@modelcontextprotocol/sdk が 4.13.7 以上を要求したら撤去する。
  "hono@<4.13.7": ">=4.13.7 <5"
  # @grpc/grpc-js (@opentelemetry/otlp-grpc-exporter-base 経由で @opentelemetry/sdk-node が引く) の推移的依存。
  # 計測を OTLP/gRPC で送り出すサーバ側の経路で走る。
  # GHSA-m9gg-hp2v-232j (high): 設定によって getAuthContext が未認可の証明書を認可済みとして返す。
  # GHSA-f596-whhp-79r4 (low): method handler が投げたエラーの文言を status message でクライアントへ返す。
  # otlp-grpc-exporter-base の宣言は ^1.14.3 で 1.14.5 はその内側。
  # @opentelemetry/otlp-grpc-exporter-base が 1.14.5 以上を要求したら撤去する。
  "@grpc/grpc-js@>=1.14.0 <1.14.5": ">=1.14.5 <2"
  # vite-plugin-storybook-nextjs（@storybook/nextjs-vite が引く）の推移的依存。
  # GHSA-5p2g-fcmc-qvqq / GHSA-w3rx-r6r6-pgpr (high): JXL / HEIF / ICNS の解析が無限ループに入る。
  # vite-plugin-storybook-nextjs の宣言は ^2.0.0 で 2.0.3 はその内側。
  # vite-plugin-storybook-nextjs が 2.0.3 以上を要求するか、image-size を引かなくなったら撤去する。
  "image-size@<2.0.3": ">=2.0.3 <3"
  # express-rate-limit（shadcn CLI > @modelcontextprotocol/sdk が引く）の推移的依存。
  # GHSA-2vr4-cq9g-pvrc / GHSA-rpw4-54j3-4h4q (moderate): NAT64 のローカル用範囲と fe80::/10 の
  # リンクローカルを取りこぼし、SSRF や信頼境界の迂回を許す。
  # express-rate-limit の宣言は ^10.2.0 で 10.5.1 はその内側。
  # express-rate-limit が 10.5.1 以上を要求したら撤去する。
  "ip-address@<10.5.1": ">=10.5.1 <11"
  # jsdom / shadcn CLI / @dotenvx/dotenvx の推移的依存。
  # GHSA-3wwx-pv8p-q78v (moderate): WebSocket の permessage-deflate の展開で未処理の例外が
  # 出てプロセスが落ちる。宣言は ^7.24.5 / ^7.27.2 / ^7.11.0 で 7.29.1 はいずれの内側でもある。
  # 3 つがすべて 7.29.1 以上を要求したら撤去する。
  "undici@>=7.28.0 <7.29.1": ">=7.29.1 <8"
  # shadcn CLI の推移的依存。
  # GHSA-6qxp-vccf-f47h (high): OAuth クライアントが資格情報を、MCP サーバが名指しした認可サーバへ
  # 送ってしまう。shadcn の宣言は ^1.26.0 で 1.31.0 はその内側。shadcn が 1.31.0 以上を要求したら撤去する。
  "@modelcontextprotocol/sdk@>=1.12.0 <1.31.0": ">=1.31.0 <2"
  # shadcn CLI の推移的依存。
  # GHSA-rj75-hqrm-r3gf (moderate): `.a.a.a…` のような平たいセレクタの解析がクラス数に対して二次で伸びる。
  # shadcn の宣言は ^7.1.0 で 7.1.6 はその内側。shadcn が 7.1.6 以上を要求したら撤去する。
  "postcss-selector-parser@>=7 <7.1.6": ">=7.1.6 <8"
  # @tiptap/pm ほか prosemirror の各パッケージが引く。リッチテキストの編集面で browser 上を走る。
  # GHSA-c8x8-7fp4-3x9w (high): 攻撃者が用意した HTML を貼り付けると、編集面のある window で
  # スクリプトが走る。宣言は最も狭い @tiptap/pm でも ^1.41.9 で 1.42.3 はその内側。
  # @tiptap/pm が 1.42.3 以上を要求したら撤去する。
  "prosemirror-view@<1.42.3": ">=1.42.3 <2"
  # express（shadcn CLI > @modelcontextprotocol/sdk が引く）の推移的依存。
  # GHSA-jqcg-44mw-7w3h (critical): IPv4-mapped IPv6 で短い prefix の信頼サブネットを書くと、
  # 先頭のビットが 0 のまま組まれて任意のアドレスを信頼する。
  # express の宣言は ^2.0.7 で 2.0.8 はその内側。express が 2.0.8 以上を要求したら撤去する。
  "proxy-addr@>=1.1.0 <2.0.8": ">=2.0.8 <3"
  # next の optional な依存。画像最適化でサーバ側を走る。
  # GHSA-wq5f-xc86-pv6w (high): 同梱の librsvg のメモリ破壊で、glibc の Linux では RCE になりうる。
  # next の宣言は ^0.35.4 で 0.35.5 はその内側。next が 0.35.5 以上を要求したら撤去する。
  "sharp@<0.35.5": ">=0.35.5 <0.36"
  # postcss / @tailwindcss/node / css-tree / magicast の推移的依存。
  # GHSA-68fv-2mgg-jv7q (high): indexed source map の section の行オフセットを検証せず、巨大な値で
  # event loop を長時間塞ぐ。宣言はいずれも ^1.2.1 で 1.2.2 はその内側。
  # 4 つがすべて 1.2.2 以上を要求したら撤去する。
  "source-map-js@>=1.0.0 <1.2.2": ">=1.2.2 <2"
  # markdownlint-cli2 / knip の推移的依存で、直接依存でもある。lint と未使用検査の実行時にしか走らない。
  # GHSA-r4xh-jqrq-34v2 (moderate): parse() が鍵の行ごとに文書の末尾まで走査し直し、二次で伸びる。
  # **この宣言は上流の宣言範囲の内側から外れる。** markdownlint-cli2 は範囲ではなく 1.8.0 の完全
  # 固定で、最新の 0.23.3 でも同じなので、内側に留まると塞げない。組み合わせの検証は、markdown を
  # 触る変更ごとに走る pnpm lint:md で代える。markdownlint-cli2 が 1.9.0 以上を要求したら撤去する。
  "smol-toml@<1.9.0": ">=1.9.0 <2"

# 依存状態が lockfile と一致しないままスクリプトを実行しない。
# 例外は base-branch / base-merge の 2 つだけ（.makefiles/github/operation/release-branch.mk）。
verifyDepsBeforeRun: error

# mise.toml[SSOT] と同じ Node.js 版を依存の engine 判定にも使う。
nodeVersion: 24.14.1
# Node.js の対応範囲外を宣言する依存の導入を拒否する。
engineStrict: true

# ----- 実行制御 -----
# 未レビューの依存ライフサイクルスクリプトを install エラーにする。
strictDepBuilds: true
# 依存ライフサイクルスクリプトの実行可否をパッケージ単位で明示する。
allowBuilds:
  lefthook: false
  esbuild: false
  msw: false
  protobufjs: false
  sharp: false
  unrs-resolver: false

# ----- 公開元の信頼性 -----
# 間接依存による Git・URL などの非標準ソースを拒否する。
blockExoticSubdeps: true
# 過去より弱い provenance に下がった版の導入を拒否する。
trustPolicy: no-downgrade
# 公開から180日を過ぎた版は provenance 情報不足だけでは拒否しない。
trustPolicyIgnoreAfter: 259200
