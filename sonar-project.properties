# SonarQube Cloud の解析設定。このリポジトリの SonarCloud organization に紐づくため、
# `.github/workflows/sonarcloud.yaml` と併せて剥がしの対象になる
# （scripts/setup/remove-boilerplate-only/manifest.ts の SELF_DESTRUCT_PATHS）。
# fork 先で使うなら、自分の organization の projectKey を書いて SONAR_TOKEN を登録する。

sonar.projectKey=Tomy-ch_nextjs-boilerplate
sonar.organization=tomy-ch
sonar.projectName=nextjs-boilerplate

sonar.sources=.
sonar.sourceEncoding=UTF-8

# 生成物と取得物を外す。編集できないものの所見は行動につながらず、直す先は契約か生成器になる。
sonar.exclusions=\
  **/node_modules/**,\
  **/dist/**,\
  **/coverage/**,\
  **/.next/**,\
  **/storybook-static/**,\
  src/adapters/gen/**,\
  mocks/api/**,\
  tokens/generated/**,\
  graphify-out/**,\
  docs/**,\
  pnpm-lock.yaml

sonar.tests=.
sonar.test.inclusions=**/*.test.ts,**/*.test.tsx

# カバレッジのゲートは test ワークフローが 100% の閾値で持つ（ADR 0090）。SonarCloud へ LCOV を
# 渡さない以上、ここで coverage を品質ゲートに入れると「報告が無い」を「不足」として読む。
# 静的解析と重複検出の対象からは外さない。
sonar.coverage.exclusions=**/*

# 抑止（[0110](docs/adr/0110-security-operations.md) §3.4）。各エントリに理由と撤回条件を書く。
#
# S4036「PATH に固定・書き換え不能なディレクトリだけが入っていることを確かめよ」。
# このリポジトリはコマンドを**素の名前で**呼び、解決は mise を活性化した PATH が行う
# （[0003](docs/adr/0003-version-manager.md)）。絶対パスを埋めると、ADR 0003 が禁じている
# 「呼び出しごとの包み込み」そのものになり、手元と CI で綴りが分かれる。指摘の趣旨は
# 満たしている —— PATH を決めるのは runner と mise で、実行するスクリプトではない。
#
# 撤回条件: コマンドの解決を PATH から外す決定（ADR 0003 の改訂）が入ったとき。
sonar.issue.ignore.multicriteria=e1,e2,e3,e4,e5,e6,e7,e8,e9,e10,e11
sonar.issue.ignore.multicriteria.e1.ruleKey=typescript:S4036
sonar.issue.ignore.multicriteria.e1.resourceKey=scripts/**/*.ts

# S5976「複数のテストを parameterized 1 本へまとめよ」。ADR [0090](docs/adr/0090-testing-strategy.md)
# はケースを 1 つずつ名前で立てることを求めており、その名前が失敗の場所を語る。記法の違いを
# 確かめるケース群は入力が似ているだけで、**変わる理由は別々**である。名前テンプレート付きの
# `it.each` は同 ADR が許すので、同じ理由で変わるケースを束ねる用途では引き続き使う。
#
# 撤回条件: ADR 0090 がケースごとの命名を求めなくなったとき。
sonar.issue.ignore.multicriteria.e2.ruleKey=typescript:S5976
sonar.issue.ignore.multicriteria.e2.resourceKey=**/*.test.ts

# S1192「同じ文字列リテラルの繰り返しを定数へ」。テストの入力と期待値を定数へ畳むと、そのケースが
# 何を与えて何を確かめているのかが、その行から消える。
#
# 撤回条件: 同じリテラルが**同じ理由で**変わる（契約の綴りなど）と言える場所が出たとき。そこは
# 抑止の対象ではなく、素直に定数化する。
sonar.issue.ignore.multicriteria.e3.ruleKey=typescript:S1192
sonar.issue.ignore.multicriteria.e3.resourceKey=**/*.test.ts

# S2871「`.sort()` に比較関数を渡せ」。**この規則が指示する直し方が、ここでは誤りになる。**
# 挙げられている箇所はすべて文字列の配列で、並べた結果は lockfile の突合・digest・コミットされる
# 生成物へ入る。規則が求める `localeCompare` は引数を省くと実行環境の locale から解決するため、
# 同じ入力が機械によって違う順序になる（`sv-SE` は `ä` を最後に置き、`en-US` は先頭に置く）。
# 素の `.sort()` は UTF-16 コード単位順で、環境に依らない。
#
# 代償を書いておく: この規則が本来捕まえたい `[10, 9, 1].sort()`（数値を文字列として並べる誤り）も、
# 対象のディレクトリでは鳴らなくなる。`src/**` では鳴らしたままにしてある。
#
# 撤回条件: 規則が文字列配列に対して `localeCompare` を求めなくなったとき。
sonar.issue.ignore.multicriteria.e4.ruleKey=typescript:S2871
sonar.issue.ignore.multicriteria.e4.resourceKey=scripts/**/*.ts
sonar.issue.ignore.multicriteria.e5.ruleKey=typescript:S2871
sonar.issue.ignore.multicriteria.e5.resourceKey=baseline/**/*.ts
sonar.issue.ignore.multicriteria.e6.ruleKey=typescript:S2871
sonar.issue.ignore.multicriteria.e6.resourceKey=e2e/**/*.ts
sonar.issue.ignore.multicriteria.e7.ruleKey=typescript:S2871
sonar.issue.ignore.multicriteria.e7.resourceKey=vrt/**/*.ts
sonar.issue.ignore.multicriteria.e8.ruleKey=typescript:S2871
sonar.issue.ignore.multicriteria.e8.resourceKey=tokens/**/*.ts

# S1523「動的なコードの注入・実行が安全か確かめよ」。`runInNewContext` に渡しているのは
# **自分の build が出した成果物**（`.next` の RSC manifest）で、外から来た文字列ではない。
# 読む `_client-reference-manifest.js` は module ではなく `globalThis.__RSC_MANIFEST` へ代入するだけの
# script なので、値を得るには評価するしかない。捨てる context に閉じ込めているのはその代入の行き先で、
# 指摘が心配する「何を実行するか」の側は build 成果物という出所で決まっている。
#
# 撤回条件: 読み込む対象が build 成果物以外へ広がったとき。そこは抑止ではなく、パースし直す先になる。
sonar.issue.ignore.multicriteria.e9.ruleKey=typescript:S1523
sonar.issue.ignore.multicriteria.e9.resourceKey=scripts/bundle-budget/index.ts

# S7631「fork のコードを実行していないか確かめよ」。`workflow_run` は base repository の文脈で
# 書き込み権を持つトークンを握るため、指摘の懸念そのものは正しい。**求められている対策は既に入って
# いる** —— `Refuse fork pull requests` が、どの checkout よりも前に head の repository を突き合わせて
# 落とす。規則は checkout の行だけを見るので、その手前の拒否を読まない。
#
# 撤回条件: fork の拒否を外す決定が入ったとき。そのときは抑止ではなく、設計そのものを問い直す。
sonar.issue.ignore.multicriteria.e10.ruleKey=githubactions:S7631
sonar.issue.ignore.multicriteria.e10.resourceKey=.github/workflows/baseline-retake.yaml

# S5332「http は安全でない。https を使え」。`http://internal.invalid` は URL の解決先を確かめるためだけの
# origin で、接続しない。`.invalid` は名前解決されないことが保証された予約 TLD（RFC 6761）なので、
# https へ替えても意味が変わらないまま「接続しうる形」に見えるだけになる。
#
# 撤回条件: この定数が実際に接続される先になったとき。
sonar.issue.ignore.multicriteria.e11.ruleKey=typescript:S5332
sonar.issue.ignore.multicriteria.e11.resourceKey=src/model/return-url.ts

# 重複の密度。同じ形のケースが並ぶのはテストの性質で、束ねると 1 つを直したい人が呼び出し側を
# 読むことになる。**実装側の重複は対象に残す** —— そちらは同じ理由で変わることが多い。
#
# 撤回条件: テストの重複が、ケースの独立性ではなく単なる書き写しだと言える形で増えたとき。
sonar.cpd.exclusions=**/*.test.ts,**/*.test.tsx
