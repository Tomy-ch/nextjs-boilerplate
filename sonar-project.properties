# SonarQube Cloud の解析設定。このリポジトリの SonarCloud organization に紐づくため、
# `.github/workflows/sonarcloud.yaml` と併せて剥がしの対象になる
# （scripts/setup/remove-boilerplate-only/manifest.ts の SELF_DESTRUCT_PATHS）。
# fork 先で使うなら、自分の organization の projectKey を書いて SONAR_TOKEN を登録する。

sonar.projectKey=Tomy-ch_nextjs-boilerplate
sonar.organization=tomy-ch
sonar.projectName=nextjs-boilerplate

sonar.sources=.
sonar.sourceEncoding=UTF-8

# 生成物と取得物を外す。編集できないものの所見は行動につながらず、直す先は契約か生成器になる。
sonar.exclusions=\
  **/node_modules/**,\
  **/dist/**,\
  **/coverage/**,\
  **/.next/**,\
  **/storybook-static/**,\
  src/adapters/gen/**,\
  mocks/api/**,\
  tokens/generated/**,\
  graphify-out/**,\
  docs/**

sonar.tests=.
sonar.test.inclusions=**/*.test.ts,**/*.test.tsx

# カバレッジのゲートは test ワークフローが 100% の閾値で持つ（ADR 0090）。SonarCloud へ LCOV を
# 渡さない以上、ここで coverage を品質ゲートに入れると「報告が無い」を「不足」として読む。
# 静的解析と重複検出の対象からは外さない。
sonar.coverage.exclusions=**/*

# 抑止するルール。**条件を書けない抑止は先送りなので、なぜ従わないかを必ず添える。**
# 従うかどうかの判定は「その 2 箇所は同じ理由で変わるか」で、行が一致することではない。

# S5976（複数のテストを parameterized 1 本へ）。ADR 0090 はケースを 1 つずつ名前で立てることを
# 求めており、名前が失敗の場所を語る。記法の違いを確かめるケース群は入力が似ているだけで、
# 変わる理由は別々である。名前テンプレート付きの `it.each` は同 ADR が許すので、**同じ理由で
# 変わるケース**を束ねる用途では引き続き使う。
sonar.issue.ignore.multicriteria=e1,e2
sonar.issue.ignore.multicriteria.e1.ruleKey=typescript:S5976
sonar.issue.ignore.multicriteria.e1.resourceKey=**/*.test.ts

# S1192（同じ文字列リテラルの繰り返し）。テストの入力・期待値を定数へ畳むと、ケースが何を
# 与えて何を確かめているのかがその行から消える。
sonar.issue.ignore.multicriteria.e2.ruleKey=typescript:S1192
sonar.issue.ignore.multicriteria.e2.resourceKey=**/*.test.ts

# 重複の密度。同じ形のケースが並ぶのはテストの性質で、束ねると 1 つを直したい人が呼び出し側を
# 読むことになる。実装側の重複は対象に残す。
sonar.cpd.exclusions=**/*.test.ts,**/*.test.tsx
