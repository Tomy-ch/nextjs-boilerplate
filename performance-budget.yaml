# client JavaScript の予算（[ADR 0101](docs/adr/0101-performance-budget.md)）。
#
# ## 何を測るか
#
# route を開いたときに browser が最初に読む client JavaScript を、gzip した合計。`next build` の
# 出力にこの列は無いため、成果物（`.next`）の側から引く。route 固有の chunk（その route が参照する
# client component）と、共有 chunk（framework の runtime）の和集合で、対応ブラウザが静的 route の
# HTML から読む script と一致する。CSS は含めない。
#
# polyfill は含めない。Next.js が `<script nomodule>` で出すため、ADR 0102 が対応対象とする
# ブラウザは取得しないからである。含めると、誰も読まない約 40 KB が全 route へ一律に乗る。
#
# ## 書き方
#
# routes.<route>.gzipKb  その route の上限（KB, gzip）。**宣言した route だけ**が上限で落ちる。
#                        宣言の無い route は表に出るだけで判定されない
# routes.<route>.reason  その値の根拠。空にできない（読み込み時に落ちる）
# growth.gzipKb          base ブランチからの増分の上限（KB, gzip）。**全 route に効く**
# growth.reason          同上
#
# 上限と増分は役割が違う。上限は総量の天井で、増分は「予算の余裕を小刻みに食い潰して、最後に
# 線を越えた PR だけが赤くなる」を防ぐ。宣言の無い route を守るのも増分の側である。
#
# ## fork 先へ
#
# **routes の値はこのリポジトリの同梱サンプルの実測であり、そのままでは意味を持たない。** 自分の
# アプリを build して測り直し、置き換えること（ADR 0101 は具体値を fork 先の判断としている）。
# growth の値は用途に依らないため、そのまま使える。
#
# 同梱サンプルの route を宣言していないのは、サンプルが `make purge-sample` で消えるためである。
# 消える route の名前をここに残すと、破棄後のツリーに残留参照が生じる。

routes:
  "/_not-found":
    gzipKb: 180
    reason: 実測 164.0 KB に約 10% の余裕。共有 chunk の入れ替えで数 KB は動くため、その幅では鳴らさない
  "/_global-error":
    gzipKb: 161
    reason: 実測 146.0 KB に約 10% の余裕。client component をほぼ持たない下限に近い route である

growth:
  gzipKb: 30
  reason: >-
    依存の patch 更新や chunk の切り直しで数 KB は動くため、本来は 10 KB で足りる。30 KB へ広げて
    あるのは、route を器（app shell）の内と外で移すと、その route が器の client 島をまとめて背負う
    ためである。同梱サンプルではこれが 25 KB 前後で、器を持つ route と持たない route の差そのものに
    あたる。**サンプルを破棄したら 10 KB へ戻すこと** —— fork 先が器を 1 つに保つ限り、この段差は
    起きない

# ---------------------------------------------------------------------------------------
# Core Web Vitals の予算（同じ [ADR 0101](docs/adr/0101-performance-budget.md)）。
#
# ## 何を測るか
#
# `e2e/lib/screens.ts` が宣言する画面を 1 枚ずつ Lighthouse で開き、Core Web Vitals を測る。
# 開く画面の一覧をここで持ち直さないのは、持ち直すと画面を足した人が 2 箇所へ書くことになり、
# 片方だけを足した状態が「予算に収まっている」として緑で通るためである。
#
# 見るのは 3 つだけで、performance スコアは見ない。スコアは 5 指標の加重平均であり、下がった
# ときに**どれが下がったか**を答えられない。INP は実ユーザの操作を要して lab では測れないため、
# Lighthouse が lab の代替として置く TBT を見る（field 値の収集は ADR 0082）。
#
# 撮る条件は Lighthouse の既定（モバイル相当の画面 + CPU 4 倍の減速 + 低速回線の模擬）に任せる。
# Core Web Vitals の閾値はモバイルの field 値に対して定められたものなので、条件を緩めると閾値
# だけがそのまま残り、通ることの意味が変わる。
#
# **同梱サンプルの画像には配信元（`MEDIA_ORIGIN`）が無い。** バックエンド側の object storage は
# CI に居ないため、`next/image` の最適化が取得に失敗する。ここで測れるのはアプリ自身が配るもの
# だけで、配信元が在るときの画像の重さは測れない（E2E が引くのと同じ線 —— `e2e/README.md`）。
#
# ## 書き方
#
# runs.count            1 画面あたりの試行回数。中央値を採る
# pullRequest.alertAt   PR で「測ったほうがよい」と知らせる変更行数。**gate の閾値ではない**
# metrics.<指標>.limit  **全画面へ一律に効く**上限
# metrics.<指標>.reason その値の根拠。空にできない（読み込み時に落ちる）
# screens.<画面名>      その画面だけ既定を緩める。指標は一部だけ書ける
#
# ## fork 先へ
#
# **metrics の値は用途に依らない。** Core Web Vitals が "good" と定める境界そのもので、
# 同梱サンプルの実測ではない。緩めるのは、その画面が重いことを設計として引き受けたときだけで、
# そのときは screens へ理由付きで書く。
#
# **screens へ同梱サンプルの画面名を書くときは、`sample:begin` / `sample:end` のマーカー（この
# ファイルでは YAML コメントとして書く）で囲むこと。**
# 囲まないと、`make purge-sample` のあとに実体を失った緩和が残り、読み込みの時点で落ちる。

lighthouse:
  runs:
    count: 3
    reason: >-
      CI の runner は隣の仕事の影響で 1 回だけ極端に遅い試行を出す。中央値が意味を持つ最小の
      奇数が 3 で、偶数を避けるのは 2 つの平均がどの試行にも存在しない値になるためである。
      増やすほど安定するが、画面数だけ線形に伸びる
  metrics:
    lcpMs:
      limit: 2500
      reason: >-
        Core Web Vitals が LCP を "good" と定める境界（2.5 秒）そのもの。用途で動く値ではない
    clsScore:
      limit: 0.1
      reason: >-
        Core Web Vitals が CLS を "good" と定める境界（0.1）そのもの。用途で動く値ではない
    tbtMs:
      limit: 200
      reason: >-
        INP の "good" 境界（200 ms）に対する lab の代替として Lighthouse が置く TBT の境界。
        INP そのものは実ユーザの操作を要するため lab では測れない
  pullRequest:
    alertAt: 300
    reason: >-
      **これは gate の閾値ではなく、人へ知らせる線である。**全数の計測は保護ブランチと日次に
      置いてあり（ADR 0101 §2）、PR で待たずに測るのは構造で決まるとき（画面の宣言が動いた /
      器が動いた）だけである。それ以外で「差分を読んでも critical path への影響を推し量れない」
      規模を、token とロジックの変更行数で見る。**300 に理論的な根拠は無い** —— 超えたら赤に
      なるのではなく、`gh workflow run lighthouse.yaml --ref <branch>` を勧めるだけなので、
      外しても失うのは注意の一声だけである。うるさければ上げ、見落とすなら下げる
  screens: {}
