# 純化パスの台帳。どのファイルが走査を通ったかだけを覚えている。
#
# スキーマ:
#   [pending] "<リポジトリ相対パス>" = "<何が真になればこの行を消せるか>"
#   [swept]   "<リポジトリ相対パス>" = "<YYYY-MM-DD>"
#
# [pending] の値は**理由ではなく条件**を書く。「まだ決まっていない」ではなく「この判断が付いたら」
# 「この文書ができたら」のように、**誰かが確かめられる形**で書く。日付や「そのうち」は条件ではない。
# 条件を書けないなら、それは保留ではなく未着手なので、行を足さずに [swept] へも入れない。
#
# 消せる条件が書かれていない保留は、誰も retire できない。**それは規則として置いたつもりのない規則**
# と見分けが付かず、そうなる経路は悪意ではない —— 締切の中で 1 行足され、二度と見直されないだけである。
# 条件をエントリの一部にしておくことが、この表を墓場ではなく待ち行列に保つ。
#
# 鍵は必ず引用符で囲んで書く。purity-swept.sh は TOML をパースせず、表の見出しを追いながら
# 行頭一致で引くため、この綴りが引きの前提そのものになっている。
#
# [swept] を最後に置いてあるのは、追記が常に末尾へ行われるからである。[pending] を後ろに
# 置くと、走査を終えた記帳が保留の表へ落ちる。
#
# 記帳するのは、そのファイルの全体を見終えてからにする。していない走査を主張するエントリは、
# エントリが無いことより悪い —— そのファイルはもう二度と見られない。

