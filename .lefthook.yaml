# Git hook 設定 (ADR 0151)。CI を権威とし、hook は「壊れた状態を CI に到達させない第一段」。
# 導入: pnpm install 後に `pnpm exec lefthook install` で .git/hooks に配置する。

pre-commit:
  parallel: true
  commands:
    lint:
      # 完全版 (biome.ci.jsonc + --error-on-warnings)。エディタ保存時の簡易版に対し、
      # commit 時は warn もブロックする完全版で検査する。
      run: mise exec -- pnpm lint:ci
    md-lint:
      # Markdown の体裁 (markdownlint-cli2) と mermaid 図の構文を検証する。
      # biome は Markdown を見ないため、この二段で md の壊れを CI 前に止める。
      glob: "*.md"
      run: mise exec -- pnpm md-lint
    actionlint:
      # ワークフロー定義の構文と run: ステップのシェルを検査する (ADR 0153)。
      # 対象が無いコミットでは発火しない。
      glob: ".github/workflows/*"
      run: make actionlint

commit-msg:
  commands:
    commitlint:
      # コミット規約 (ADR 0150) の prefix 11 種を検証する。規約外の prefix はここで落ちる。
      # {1} はクォートされずに展開されるため、パスに空白を含む clone でも壊れないよう囲む。
      run: make commitlint COMMIT_MSG_FILE="{1}"

pre-push:
  parallel: true
  commands:
    typecheck:
      run: mise exec -- pnpm typecheck
    secret-scan:
      # push 予定のコミット範囲に秘密が含まれていれば fail-closed で止める。
      run: make secret-scan
    trivy-fs:
      # 依存の脆弱性を報告する。ここでは落とさず、ゲート化は CI 側が持つ。
      run: make trivy-fs
