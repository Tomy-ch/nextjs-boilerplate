# Git hook 設定 (ADR 0151)。CI を権威とし、hook は「壊れた状態を CI に到達させない第一段」。
# 導入: pnpm install 後に `pnpm exec lefthook install` で .git/hooks に配置する。
#
# コマンドは素で書く。`mise exec` での包み込みは全面禁止 (ADR 0003)。
# ツールは mise を activate した PATH から解決する前提。activate を経ない
# シェル (GUI クライアント / エージェント / CI) から起動して
# `❌ <tool> が PATH にありません` で落ちる場合は、包まずに shims を
# PATH へ載せて直す (`mise activate --shims`)。

pre-commit:
  parallel: true
  commands:
    lint:
      # 完全版 (biome.ci.jsonc + --error-on-warnings)。エディタ保存時の簡易版に対し、
      # commit 時は warn もブロックする完全版で検査する。
      run: pnpm lint:ci
    md-lint:
      # Markdown の体裁 (markdownlint-cli2)、mermaid 図の構文、`.claude/**` の意味
      # (skill-lint = frontmatter / 対訳ペアの構造 / 参照の実在性) を検証する。
      # biome は Markdown を見ないため、この三段で md の壊れを CI 前に止める。
      # Makefile 側も glob に入れるのは、skill-lint が make ターゲット一覧を検査入力に取るため
      # (ターゲットを消すだけのコミットでスキル本文の参照が腐る)。
      glob:
        - "*.md"
        - "Makefile"
        - ".makefiles/**/*.mk"
      run: pnpm md-lint
    actionlint:
      # ワークフロー定義の構文と run: ステップのシェルを検査する (ADR 0153)。
      # 検査が及ぶのは workflows だけだが、composite action の変更も呼び出し側の
      # 入力整合を壊すため発火対象に含める (及ぶ範囲と限界は make 側が正)。
      # 対象が無いコミットでは発火しない。
      glob:
        - ".github/workflows/*.{yml,yaml}"
        - ".github/actions/**/*.{yml,yaml}"
      run: make actionlint
    actions-shellcheck:
      # composite action の run: シェルを検査する (ADR 0153)。actionlint が届かない範囲を
      # 埋めるため、上の actionlint とは別コマンドとして持つ。
      # 検査ツール自身も glob に入れるのは、抽出が壊れれば「検査対象があるのに 0 件で緑」
      # になりうるため (ツール側の突き合わせで落とすが、発火自体は手元で確かめさせる)。
      glob:
        - ".github/actions/**/*.{yml,yaml}"
        - "scripts/actions-shellcheck/*.ts"
        - "scripts/lib/*.ts"
      run: make actions-shellcheck
    actions-comment-secret-lint:
      # PR コメントを投稿するジョブに secret が渡っていないかを検査する (ADR 0153)。
      # 規約 (検査ログをそのまま公開コメントへ複製するため本文を作るジョブに secret を
      # 渡さない) は actionlint では表現できないため、別コマンドとして持つ。
      # 投稿ジョブの同定に action 定義の参照を辿るので、workflow だけでなく
      # .github/actions/** と共有モジュールの変更でも発火させる。
      glob:
        - ".github/workflows/*.{yml,yaml}"
        - ".github/actions/**/*.{yml,yaml}"
        - "scripts/actions-comment-secret-lint/*.ts"
        - "scripts/lib/*.ts"
      run: make actions-comment-secret-lint
    actions-pin-check:
      # uses: がロックファイル通りに SHA 固定されているかを検査する (ADR 0153)。
      # 検査はネットワークに出ないため hook の速度目標に収まる。
      # glob を .github/** と広く取るのは、workflow 定義・composite action 定義・
      # ロックファイルの 3 か所いずれの変更でも発火させる必要があるため。
      glob: ".github/**"
      run: make actions-pin-check

commit-msg:
  commands:
    commitlint:
      # コミット規約 (ADR 0150) の prefix 11 種を検証する。規約外の prefix はここで落ちる。
      # {1} はクォートされずに展開されるため、パスに空白を含む clone でも壊れないよう囲む。
      run: make commitlint COMMIT_MSG_FILE="{1}"

pre-push:
  parallel: true
  commands:
    typecheck:
      run: pnpm typecheck
    secret-scan:
      # push 予定のコミット範囲に秘密が含まれていれば fail-closed で止める。
      # 依存脆弱性スキャン (make trivy-fs) をここに置かないのは ADR 0110 3.1 の判断による。
      run: make secret-scan
