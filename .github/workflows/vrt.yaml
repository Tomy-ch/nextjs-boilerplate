name: VisualRegressionTest

# Compares every Storybook story against its committed baseline image
# (ADR 0091: visual regression runs on Playwright's screenshot comparison).
#
# The run happens inside the digest-pinned Playwright container declared in
# `docker-compose.dev-tools.yml`, invoked through the same `make vrt` a developer
# runs locally. That is the whole point of the container: font rasterisation
# differs per OS and per CPU architecture, so the baseline is only reproducible
# when the image — not the host — defines the environment.
#
# CI never writes baselines on its own. Producing new ones is a deliberate human act
# — either `make vrt-update` locally, or the `baseline-retake` label handled by
# `baseline-retake.yaml`. Neither is the approval: the images live in the store, so this
# repository only ever shows a moved submodule pointer, and the pixels are judged in
# the store's compare view and accepted with the `baseline-approve` label that
# `baseline-approval.yaml` requires.
#
# The comparison and the pull-request comment are separate jobs. The baseline store
# may be private, which means the comparison job needs a GitHub App secret; a job
# holding a secret must not also produce a comment body, because secret masking does
# not survive a `tee` to a file (ADR 0153).
#
# Deliberately unfiltered by `paths`; the reason every CI Checks workflow runs on
# every PR is in README.md. The job always starts and then asks `diff-scope` whether the
# diff can reach a picture, so the context is reported even when the expensive steps stand
# down. That gate and the input hash `make vrt` computes are two different layers of the
# same question — which layer decides what is in `vrt/README.md`.

on:
  pull_request:
  workflow_dispatch:

# Select the CI environment file (env/.env.ci). Without this the loader falls back to
# `local`, which ships a placeholder session secret that the config layer refuses outside
# development. Storybook loads `next.config.ts` to build the preview, so the refusal lands
# there — and `storybook build` reports success anyway, leaving a tree with no preview.
env:
  APP_ENV: ci

permissions:
  contents: read

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  vrt:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    permissions:
      contents: read

    outputs:
      title: ${{ steps.vrt.outputs.title || steps.standdown.outputs.title }}

    steps:
      - name: Harden the runner
        uses: step-security/harden-runner@bf7454d06d71f1098171f2acdf0cd4708d7b5920 # v2.20.0
        with:
          egress-policy: audit

      - name: Checkout
        uses: actions/checkout@9c091bb21b7c1c1d1991bb908d89e4e9dddfe3e0 # v7.0.0
        with:
          persist-credentials: false

      # What cannot change a single pixel of a single story. The list is far shorter than
      # `bundle-budget`'s: that job measures `.js` alone, whereas everything a story renders
      # from — `*.css`, `tokens/*`, `.storybook/*`, `*.stories.tsx` — decides a picture here.
      # `.github/**` and `scripts/**` are not listed either, because a change to this
      # workflow or to how the comparison runs has to be compared.
      - name: Decide whether the diff can reach a picture
        id: scope
        uses: ./.github/actions/diff-scope
        with:
          base-ref: ${{ github.base_ref }}
          ignore: |
            docs/*
            *.md
            .claude/*
            .agents/*
            .cursor/*
            .gemini/*

      - name: Fetch the baseline images
        if: steps.scope.outputs.relevant == 'true'
        uses: ./.github/actions/setup-baselines
        with:
          app-id: ${{ secrets.BASELINE_APP_ID }}
          private-key: ${{ secrets.BASELINE_APP_PRIVATE_KEY }}

      - name: Setup mise and the pinned tools
        if: steps.scope.outputs.relevant == 'true'
        uses: ./.github/actions/setup-mise
        with:
          tools: core:node aqua:pnpm/pnpm
          github-token: ${{ secrets.GITHUB_TOKEN }}

      - name: Resolve the pnpm store path
        id: pnpm-store
        if: steps.scope.outputs.relevant == 'true'
        shell: bash
        run: |
          path="$(pnpm store path)"
          echo "path=${path}" >> "$GITHUB_OUTPUT"

      - name: Cache the pnpm store
        if: steps.scope.outputs.relevant == 'true'
        uses: actions/cache@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
        with:
          path: ${{ steps.pnpm-store.outputs.path }}
          key: ${{ runner.os }}-pnpm-store-${{ hashFiles('pnpm-lock.yaml') }}
          restore-keys: ${{ runner.os }}-pnpm-store-

      - name: Install dependencies
        if: steps.scope.outputs.relevant == 'true'
        run: pnpm install --frozen-lockfile

      # The record of which input state already compared clean. `make vrt` hashes the
      # rendering inputs itself and skips the comparison when they match, so the cache only
      # has to carry the record forward — the newest one this branch (or its base) produced.
      # A miss restores nothing and the comparison runs, which is the safe direction.
      - name: Restore the last verified input state
        if: steps.scope.outputs.relevant == 'true'
        uses: actions/cache/restore@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
        with:
          path: tmp/vrt/verified-inputs.sha256
          key: vrt-verified-${{ github.run_id }}
          restore-keys: vrt-verified-

      - name: Build Storybook and compare every story
        id: vrt
        if: steps.scope.outputs.relevant == 'true'
        continue-on-error: true
        shell: bash
        run: |
          set +e

          # Stream through `tee` rather than redirecting to a file and tailing at the end.
          # A run that is cancelled or hits the job timeout never reaches the tail, so the
          # exact case worth diagnosing — the slow one — is the case that leaves no log at
          # all. Streaming also gets every line stamped with the runner's clock, which is
          # what tells apart a slow Storybook build, a slow image pull and a slow comparison.
          make vrt 2>&1 | tee /tmp/vrt-full.log
          code=${PIPESTATUS[0]}

          if [ "${code}" -eq 0 ]; then
            echo "status=success" >> "$GITHUB_OUTPUT"
            # Green because every story was compared, or green because the inputs had already
            # compared clean — the reader needs to be able to tell those apart.
            if grep -qx 'vrt-gate: skip' /tmp/vrt-full.log; then
              echo "title=## ✅ VRT: PASS (inputs unchanged, comparison skipped)" >> "$GITHUB_OUTPUT"
            else
              echo "title=## ✅ VRT: PASS (no visual change)" >> "$GITHUB_OUTPUT"
            fi
          else
            echo "status=failure" >> "$GITHUB_OUTPUT"
            echo "title=## ❌ VRT: FAIL" >> "$GITHUB_OUTPUT"
          fi

          exit 0

      # Only a clean comparison is worth carrying forward. The key is unique per run so the
      # save always lands; `restore-keys` above then picks up the newest one.
      - name: Save the verified input state
        if: steps.vrt.outputs.status == 'success'
        uses: actions/cache/save@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
        with:
          path: tmp/vrt/verified-inputs.sha256
          key: vrt-verified-${{ github.run_id }}

      # The raw log holds one line per story, which is unreadable in a comment. The
      # JSON report is turned into a table of exactly which stories moved and by how
      # much — the same set the `baseline-retake` label is allowed to retake.
      - name: Summarise which stories changed
        if: always() && steps.vrt.outputs.status == 'failure'
        env:
          HEAD_REF: ${{ github.head_ref }}
          RUN_ID: ${{ github.run_id }}
        shell: bash
        run: |
          # The comment is written to two files, and the split is what decides what renders.
          # `vrt.log` is folded inside a code block because a log line is whatever the tools
          # printed — source text a pull request controls, which must not become markup. The
          # notes are workflow-authored prose plus the generated table, and they render, because
          # a table and a copy-me command say nothing when shown as literal characters.
          mkdir -p /tmp/vrt-comment
          tail -n 60 /tmp/vrt-full.log > /tmp/vrt-comment/vrt.log

          ids="$(pnpm exec tsx scripts/vrt ids tmp/vrt/report.json || true)"

          # The block below is written to be pasted into a shell, so a value carrying `$(...)`
          # or a backtick would be evaluated by the reader's shell before `make` ever starts.
          # A branch name may legally contain both, so drop the block rather than emit one
          # that is unsafe to paste. Quoting alone would not do: a value containing a single
          # quote closes the quoting again. The same check is what lets these values sit in
          # rendered markdown at all — the accepted set carries no markup and no mention.
          if printf '%s%s' "${HEAD_REF}" "${ids}" | LC_ALL=C grep -q "[^A-Za-z0-9/._,-]"; then
            ids=''
            echo "review block suppressed: head_ref or story ids carry shell metacharacters" >&2
          fi

          {
            pnpm exec tsx scripts/vrt table tmp/vrt/report.json || true

            if [ -n "${ids}" ]; then
              cat <<REVIEW

          ### 手元で見る

          落ちた story を使い捨ての作業ツリーで開きます。手元の作業ツリーは動かしません。

          \`\`\`bash
          make vrt-review BRANCH='${HEAD_REF}' RUN='${RUN_ID}' VRT_ONLY='${ids}'
          \`\`\`

          作業ツリーは Ctrl-C では消えません。溜まったら \`make review-clean\` で片付けてください。
          REVIEW
            fi

            cat <<'NOTE'

          `vrt-diff` artifact に期待 / 実際 / 差分の 3 枚と HTML レポートが入っています。
          意図した変更なら `baseline-retake` ラベルを付けてください。上の story だけを撮り直して push します。

          - **ラベルは引き金ではありません。** VRT / E2E の完了時に読まれる条件なので、完了したあとに付けたなら再実行が要ります（`gh run rerun <run-id>`）
          - **ラベルは撮り直しが置き場へ push した時点で外れます。** もう一度撮るには付け直してください
          - **撮り直しは承認ではありません。** 画素を見て `baseline-approve` を付けるのが承認です（`vrt/README.md` の「撮り直しと承認は別の操作」）

          **落ちた story それぞれについて、なぜ変わったかを言えるまで撮り直さないでください。** 全数が一度に落ちる形は原因が 1 つとは限らず、混ざっている不具合ごと撮り直すとそれが次の正になります（`docs/design/vrt.md` の「限界」）。
          NOTE
          } > /tmp/vrt-comment/vrt-notes.md

      # Both files always exist together: the commenting job passes both paths, and a missing
      # one fails the action rather than silently dropping half the comment.
      - name: Note that nothing changed
        if: always() && steps.vrt.outputs.status == 'success'
        shell: bash
        run: |
          mkdir -p /tmp/vrt-comment
          echo '全 story が基準画像と一致しました。' > /tmp/vrt-comment/vrt.log
          : > /tmp/vrt-comment/vrt-notes.md

      # A job that stood down still owes the pull request a verdict. Without this, the ❌
      # comment an earlier push produced stays beside a green check once the diff stops
      # reaching a picture — README.md's "update the comment on success too" invariant,
      # applied to standing down.
      - name: Note that the diff cannot reach a picture
        id: standdown
        if: steps.scope.outputs.relevant != 'true'
        shell: bash
        run: |
          echo 'title=## ⏭️ VRT: SKIP (diff cannot reach a picture)' >> "$GITHUB_OUTPUT"
          mkdir -p /tmp/vrt-comment
          echo 'この PR の差分は絵に届かないため、比較していません。' > /tmp/vrt-comment/vrt.log
          : > /tmp/vrt-comment/vrt-notes.md

      # Expected / actual / diff triplets per failing story. Without them the only
      # evidence of a visual change is the assertion text, which cannot be judged.
      - name: Upload the visual diff
        if: always() && steps.vrt.outputs.status == 'failure'
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4.6.2
        with:
          name: vrt-diff
          path: tmp/vrt
          retention-days: 7
          if-no-files-found: warn

      # Read back by `baseline-retake.yaml` to bound what the label may retake. Kept
      # separate from the diff bundle so the retake path downloads only the report.
      - name: Upload the machine-readable report
        if: always() && steps.vrt.outputs.status == 'failure'
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4.6.2
        with:
          name: vrt-report
          path: tmp/vrt/report.json
          retention-days: 7
          if-no-files-found: error

      # Handed to the commenting job through an artifact rather than a job output,
      # because the body is a file whose size is not bounded by the output limit.
      - name: Hand the comment body to the commenting job
        if: always() && github.event_name == 'pull_request' && (steps.vrt.outputs.status != '' || steps.standdown.outcome == 'success')
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4.6.2
        with:
          name: vrt-comment
          path: /tmp/vrt-comment/
          retention-days: 1
          if-no-files-found: error

      # `status` is empty when the comparison stood down, which is not a failure. The scope
      # guard has to be repeated here rather than left to `status`, because "no verdict" and
      # "a bad verdict" read the same to the expression below.
      - name: Fail if a story changed
        if: always() && steps.scope.outputs.relevant == 'true' && steps.vrt.outputs.status != 'success'
        run: exit 1

  # Holds no secret beyond `GITHUB_TOKEN`, so the body it publishes cannot carry one.
  vrt-comment:
    if: always() && github.event_name == 'pull_request'
    needs: vrt
    runs-on: ubuntu-latest
    permissions:
      contents: read
      pull-requests: write

    steps:
      - name: Harden the runner
        uses: step-security/harden-runner@bf7454d06d71f1098171f2acdf0cd4708d7b5920 # v2.20.0
        with:
          egress-policy: audit

      - name: Checkout
        uses: actions/checkout@9c091bb21b7c1c1d1991bb908d89e4e9dddfe3e0 # v7.0.0
        with:
          persist-credentials: false

      - name: Download the comment body
        id: body
        continue-on-error: true
        uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c # v8.0.1
        with:
          name: vrt-comment
          path: /tmp/vrt-comment

      - name: Comment the VRT result on PR
        if: steps.body.outcome == 'success'
        continue-on-error: true
        uses: ./.github/actions/upsert-pr-comment
        with:
          github-token: ${{ secrets.GITHUB_TOKEN }}
          marker: '<!-- vrt-result -->'
          title: ${{ needs.vrt.outputs.title }}
          body-file: /tmp/vrt-comment/vrt.log
          notes-file: /tmp/vrt-comment/vrt-notes.md
          details-summary: 'VRT の実行ログ'
