name: Package Version

# The version in `package.json` is derived from the release branch name, not written by
# hand: `make branch-*` stamps it onto the branch it cuts. This job re-derives it from
# the base branch of the pull request and fails when the two disagree — a hand edit, or
# a release branch created outside `make branch-*`.
#
# The tree it reads is `refs/pull/N/merge`, so what it checks is the version that will
# actually land on the release branch.
#
# No `paths:` filter, deliberately — README.md says why every workflow runs on every PR.

on:
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  package-version:
    runs-on: ubuntu-latest
    permissions:
      contents: read
      pull-requests: write

    steps:
      - name: Harden the runner
        uses: bullfrogsec/bullfrog@7dee337d4575320b6d8cbe9a56d48d2fb765963a # v0.11.1
        with:
          egress-policy: block
          dns-policy: allowed-domains-only
          enable-sudo: false
          allowed-ips: |
            127.0.0.100
          allowed-domains: |
            github.com
            api.github.com
            codeload.github.com
            release-assets.githubusercontent.com
            *.actions.githubusercontent.com
            *.blob.core.windows.net
            *.githubapp.com
            mise-versions.jdx.dev
            nodejs.org
            registry.npmjs.org

      - name: Checkout
        uses: actions/checkout@9c091bb21b7c1c1d1991bb908d89e4e9dddfe3e0 # v7.0.0
        with:
          persist-credentials: false

      - name: Setup mise and the pinned tools
        uses: ./.github/actions/setup-mise
        with:
          tools: core:node aqua:pnpm/pnpm
          github-token: ${{ secrets.GITHUB_TOKEN }}

      - name: Install dependencies
        uses: ./.github/actions/setup-deps

      # The branch name reaches the tool as an environment variable, never as `REF=...` on a
      # make recipe line — a branch name may carry `"` and `;`.
      #
      # `github.base_ref` rather than `GITHUB_REF_NAME`: on a pull request the latter is
      # `<number>/merge`, which names no version, so the check would skip on every PR and
      # report a green it never performed.
      #
      # A base that is not a release branch (develop, production) is not a failure —
      # the script reports the skip and exits 0.
      - name: Check the version against the base branch
        id: check
        shell: bash
        env:
          PACKAGE_VERSION_REF: ${{ github.base_ref }}
        run: |
          set +e

          make version-stamp-check 2>&1 | tee /tmp/package-version.log
          code=${PIPESTATUS[0]}

          if [ "${code}" -eq 0 ]; then
            echo "status=success" >> "$GITHUB_OUTPUT"
            echo "title=## ✅ Package version: PASS" >> "$GITHUB_OUTPUT"
          else
            echo "status=failure" >> "$GITHUB_OUTPUT"
            echo "title=## ❌ Package version: FAIL" >> "$GITHUB_OUTPUT"
          fi

          exit 0

      - name: Comment package version result on PR
        if: github.event_name == 'pull_request'
        continue-on-error: true
        uses: ./.github/actions/upsert-pr-comment
        with:
          github-token: ${{ secrets.GITHUB_TOKEN }}
          marker: '<!-- package-version-result -->'
          status: ${{ steps.check.outputs.status }}
          title: ${{ steps.check.outputs.title }}
          body-file: /tmp/package-version.log
          details-summary: 'version check log'

      # An empty status means the capture step never ran (an earlier step failed),
      # which is also a failure — the comparison is against 'success', not 'failure'.
      - name: Fail if the version disagreed with the branch
        if: always() && steps.check.outputs.status != 'success'
        run: exit 1
