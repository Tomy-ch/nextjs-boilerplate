name: shadcn Drift

# src/components/shadcn-manifest.yaml records, for every design system component, whether it was
# copied in from the shadcn/ui registry and which upstream commit it came from. Two things can rot:
# the ledger itself (a component added or moved without updating its entry) and the upstream code
# (a component that has changed since we copied it).
#
# The ledger check is hermetic and caused by the change under review, so it gates pull requests.
# The upstream check needs the network and is not caused by the change under review, so it runs on
# a schedule instead: failing a PR for it would block work for a reason the author cannot fix.
# For the same reason `upstream` must never become a required status check.
#
# No `paths:` filter, deliberately — README.md says why every workflow runs on every PR.

on:
  pull_request:
  schedule:
    # Monday 03:00 UTC. Weekly is enough: acting on drift is a manual review either way.
    - cron: "0 3 * * 1"
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  shadcn-manifest:
    # The ledger check runs for every trigger. It needs no network.
    runs-on: ubuntu-latest

    steps:
      - name: Harden the runner
        uses: bullfrogsec/bullfrog@7dee337d4575320b6d8cbe9a56d48d2fb765963a # v0.11.1
        with:
          egress-policy: block
          dns-policy: allowed-domains-only
          enable-sudo: false
          allowed-ips: |
            127.0.0.100
            172.17.0.1
          allowed-domains: |
            github.com
            api.github.com
            codeload.github.com
            release-assets.githubusercontent.com
            *.actions.githubusercontent.com
            *.blob.core.windows.net
            *.githubapp.com
            mise-versions.jdx.dev
            nodejs.org
            registry.npmjs.org
            cafe.github.com

      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - name: Setup mise and the pinned tools
        uses: ./.github/actions/setup-mise
        with:
          tools: core:node aqua:pnpm/pnpm
          github-token: ${{ secrets.GITHUB_TOKEN }}

      - name: Install dependencies
        uses: ./.github/actions/setup-deps

      - name: Verify the component ledger
        run: pnpm check:ui --offline

  upstream:
    # The upstream check is skipped on pull requests. See the note at the top of this file.
    if: github.event_name != 'pull_request'
    runs-on: ubuntu-latest

    steps:
      - name: Harden the runner
        uses: bullfrogsec/bullfrog@7dee337d4575320b6d8cbe9a56d48d2fb765963a # v0.11.1
        with:
          egress-policy: block
          dns-policy: allowed-domains-only
          enable-sudo: false
          allowed-ips: |
            127.0.0.100
            172.17.0.1
          allowed-domains: |
            github.com
            api.github.com
            codeload.github.com
            release-assets.githubusercontent.com
            *.actions.githubusercontent.com
            *.blob.core.windows.net
            *.githubapp.com
            mise-versions.jdx.dev
            nodejs.org
            registry.npmjs.org
            cafe.github.com

      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - name: Setup mise and the pinned tools
        uses: ./.github/actions/setup-mise
        with:
          tools: core:node aqua:pnpm/pnpm
          github-token: ${{ secrets.GITHUB_TOKEN }}

      - name: Install dependencies
        uses: ./.github/actions/setup-deps
      - name: Check the recorded upstream commits
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: pnpm check:ui
