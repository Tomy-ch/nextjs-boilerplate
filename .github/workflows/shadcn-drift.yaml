name: shadcn Drift

# src/components/shadcn-manifest.yaml records, for every design system component, whether it was
# copied in from the shadcn/ui registry and which upstream commit it came from. Two things can rot:
# the ledger itself (a component added or moved without updating its entry) and the upstream code
# (a component that has changed since we copied it).
#
# The ledger check is hermetic and caused by the change under review, so it gates pull requests.
# The upstream check needs the network and is not caused by the change under review, so it runs on
# a schedule instead: failing a PR for it would block work for a reason the author cannot fix.
# For the same reason `upstream` must never become a required status check.
#
# Deliberately unfiltered by `paths`; the reason every CI Checks workflow runs on every PR is in
# README.md. A filtered workflow reports no context on the pull requests it skips, and a required
# context that is never reported blocks the merge forever.

on:
  pull_request:
  schedule:
    # Monday 03:00 UTC. Weekly is enough: acting on drift is a manual review either way.
    - cron: "0 3 * * 1"
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  shadcn-manifest:
    # The ledger check runs for every trigger. It needs no network.
    runs-on: ubuntu-latest

    steps:
      - name: Harden the runner
        uses: step-security/harden-runner@05e31511f85b41b11d1cf0ef85d0992719546e2c # v2.21.0
        with:
          egress-policy: block
          allowed-endpoints: >
            github.com:443
            api.github.com:443
            codeload.github.com:443
            release-assets.githubusercontent.com:443
            *.actions.githubusercontent.com:443
            *.blob.core.windows.net:443
            *.githubapp.com:443
            prod.app-api.stepsecurity.io:443
            mise-versions.jdx.dev:443
            nodejs.org:443
            registry.npmjs.org:443
            cafe.github.com:443

      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - name: Setup mise and the pinned tools
        uses: ./.github/actions/setup-mise
        with:
          tools: core:node aqua:pnpm/pnpm
          github-token: ${{ secrets.GITHUB_TOKEN }}

      - name: Install dependencies
        uses: ./.github/actions/setup-deps

      - name: Verify the component ledger
        run: pnpm check:ui --offline

  upstream:
    # The upstream check is skipped on pull requests. See the note at the top of this file.
    if: github.event_name != 'pull_request'
    runs-on: ubuntu-latest

    steps:
      - name: Harden the runner
        uses: step-security/harden-runner@05e31511f85b41b11d1cf0ef85d0992719546e2c # v2.21.0
        with:
          egress-policy: block
          allowed-endpoints: >
            github.com:443
            api.github.com:443
            codeload.github.com:443
            release-assets.githubusercontent.com:443
            *.actions.githubusercontent.com:443
            *.blob.core.windows.net:443
            *.githubapp.com:443
            prod.app-api.stepsecurity.io:443
            mise-versions.jdx.dev:443
            nodejs.org:443
            registry.npmjs.org:443
            cafe.github.com:443

      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - name: Setup mise and the pinned tools
        uses: ./.github/actions/setup-mise
        with:
          tools: core:node aqua:pnpm/pnpm
          github-token: ${{ secrets.GITHUB_TOKEN }}

      - name: Install dependencies
        uses: ./.github/actions/setup-deps
      - name: Check the recorded upstream commits
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: pnpm check:ui
