name: Secret Scan

# gitleaks over the commits a pull request adds, and over the whole history once a
# week. Detection is fail-closed: a secret is the one finding whose
# author can always resolve it on the spot, so there is nothing to weigh.
#
# The hook runs the same `make secret-scan`. What differs is the range, and it has
# to: the hook's default is "reachable from HEAD and on no remote", which on a pull
# request branch is empty — the branch is already pushed. Left at the default this
# job would scan nothing and report green, which is the one failure mode a gate
# must not have. The range is handed in through the environment.
#
# No `paths:` filter, deliberately — README.md says why every workflow runs on every PR.

on:
  pull_request:
  schedule:
    # Weekly. The whole-history pass belongs here rather than in the hook because its
    # runtime grows with the commit count.
    - cron: '45 1 * * 1'
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  secret-scan:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    permissions:
      contents: read
      pull-requests: write

    steps:
      - name: Harden the runner
        uses: bullfrogsec/bullfrog@7dee337d4575320b6d8cbe9a56d48d2fb765963a # v0.11.1
        with:
          egress-policy: block
          dns-policy: allowed-domains-only
          enable-sudo: false
          allowed-ips: |
            127.0.0.100
            172.17.0.1
          allowed-domains: |
            github.com
            api.github.com
            codeload.github.com
            release-assets.githubusercontent.com
            *.actions.githubusercontent.com
            *.blob.core.windows.net
            *.githubapp.com
            mise-versions.jdx.dev
            nodejs.org
            registry.npmjs.org

      # Full history for both paths: the scheduled run walks all of it, and the pull
      # request run needs the base commit present to name a range against it.
      - name: Checkout
        uses: actions/checkout@9c091bb21b7c1c1d1991bb908d89e4e9dddfe3e0 # v7.0.0
        with:
          fetch-depth: 0
          persist-credentials: false

      - name: Setup mise and the pinned tools
        uses: ./.github/actions/setup-mise
        with:
          tools: aqua:gitleaks/gitleaks
          github-token: ${{ secrets.GITHUB_TOKEN }}

      # The status is captured rather than allowed to abort the step: the PR comment
      # has to be produced whether the check passed or failed.
      - name: Run gitleaks
        id: gitleaks
        shell: bash
        env:
          EVENT_NAME: ${{ github.event_name }}
          # A 40-hex commit id, read as a value rather than pasted into the recipe.
          BASE_SHA: ${{ github.event.pull_request.base.sha }}
        run: |
          set +e

          if [ "${EVENT_NAME}" = "pull_request" ]; then
            SECRET_SCAN_LOG_OPTS="${BASE_SHA}..HEAD" make secret-scan 2>&1 | tee /tmp/gitleaks.log
          else
            make secret-scan-history 2>&1 | tee /tmp/gitleaks.log
          fi
          code=${PIPESTATUS[0]}

          if [ "${code}" -eq 0 ]; then
            echo "status=success" >> "$GITHUB_OUTPUT"
            echo "title=## ✅ Secret scan: PASS" >> "$GITHUB_OUTPUT"
          else
            echo "status=failure" >> "$GITHUB_OUTPUT"
            echo "title=## ❌ Secret scan: FAIL" >> "$GITHUB_OUTPUT"
          fi

          exit 0

      - name: Comment secret scan result on PR
        if: github.event_name == 'pull_request'
        continue-on-error: true
        uses: ./.github/actions/upsert-pr-comment
        with:
          github-token: ${{ secrets.GITHUB_TOKEN }}
          marker: '<!-- secret-scan-result -->'
          status: ${{ steps.gitleaks.outputs.status }}
          title: ${{ steps.gitleaks.outputs.title }}
          body-file: /tmp/gitleaks.log
          details-summary: 'gitleaks log'

      # An empty status means the capture step never ran (an earlier step failed),
      # which is also a failure — the comparison is against 'success', not 'failure'.
      - name: Fail if a secret was detected
        if: always() && steps.gitleaks.outputs.status != 'success'
        run: exit 1

  # See README.md § Notifications (why only scheduled runs notify, and why cancelled counts).
  notify-failure:
    needs: secret-scan
    if: ${{ always() && github.event_name == 'schedule' && contains(fromJSON('["failure", "cancelled"]'), needs.secret-scan.result) }}
    uses: ./.github/workflows/notify.yaml
    with:
      failed-job: secret-scan
    secrets:
      slack-webhook-url: ${{ secrets.SLACK_WEBHOOK_URL }}
