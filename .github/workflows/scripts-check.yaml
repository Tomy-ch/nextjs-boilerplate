name: Scripts Check

# Unit tests and the repository-wide 1:1 test-correspondence gate for the helper scripts
# under `scripts/**`.
#
# These are kept out of the Test workflow on purpose. What lives under `scripts/` is the
# checking machinery itself — the workflow linters, the pin checker, and the 1:1 gate — and
# all of it fails in the same direction when broken: it stops finding things and reports a
# clean run. Nothing downstream notices, because a gate that inspects nothing looks exactly
# like a repository with no violations. Splitting the job means a red mark here reads as
# "the machinery broke", never as "the app regressed".
#
# No `paths:` filter, deliberately — README.md says why every workflow runs on every PR. The
# 1:1 gate walks far beyond `scripts/` (`SCAN_ROOTS` in scripts/one-to-one.gate.test.ts, plus the
# repository root), so a change anywhere can produce a violation here.

on:
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  scripts-check:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    permissions:
      contents: read

    steps:
      - name: Harden the runner
        uses: bullfrogsec/bullfrog@7dee337d4575320b6d8cbe9a56d48d2fb765963a # v0.11.1
        with:
          egress-policy: block
          dns-policy: allowed-domains-only
          enable-sudo: false
          allowed-ips: |
            127.0.0.100
            172.17.0.1
          allowed-domains: |
            github.com
            api.github.com
            codeload.github.com
            release-assets.githubusercontent.com
            *.actions.githubusercontent.com
            *.blob.core.windows.net
            *.githubapp.com
            mise-versions.jdx.dev
            nodejs.org
            registry.npmjs.org

      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - name: Setup mise and the pinned tools
        uses: ./.github/actions/setup-mise
        with:
          tools: core:node aqua:pnpm/pnpm
          github-token: ${{ secrets.GITHUB_TOKEN }}

      - name: Install dependencies
        uses: ./.github/actions/setup-deps
      - name: Run the scripts suite with coverage
        run: make scripts-test

      # The unit tests pin the mechanism against fixtures; this step is what reads the
      # markers in the sources. Without it an unbalanced `portal:replace-*` pair throws
      # only at setup.
      - name: Preview the repository-reference replacement
        run: >
          pnpm exec tsx scripts/setup/replace-repository-reference
          --repository example-org/example-app --dry-run
