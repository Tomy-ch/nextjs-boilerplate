name: Scripts Check

# Unit tests and the repository-wide 1:1 test-correspondence gate for the helper scripts
# under `scripts/**`.
#
# These are kept out of the Test workflow on purpose. What lives under `scripts/` is the
# checking machinery itself — the workflow linters, the pin checker, and the 1:1 gate — and
# all of it fails in the same direction when broken: it stops finding things and reports a
# clean run. Nothing downstream notices, because a gate that inspects nothing looks exactly
# like a repository with no violations. Splitting the job means a red mark here reads as
# "the machinery broke", never as "the app regressed".
#
# Deliberately unfiltered by `paths`. The 1:1 gate walks `src/`, `docs-viewer/`, `tokens/`
# and `mocks/` as well, so a change anywhere can produce a violation here; the reason every
# CI Checks workflow runs on every PR is in README.md.

on:
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  scripts-check:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    permissions:
      contents: read

    steps:
      - name: Harden the runner
        uses: step-security/harden-runner@bf7454d06d71f1098171f2acdf0cd4708d7b5920 # v2.20.0
        with:
          egress-policy: audit

      - name: Checkout
        uses: actions/checkout@9c091bb21b7c1c1d1991bb908d89e4e9dddfe3e0 # v7.0.0
        with:
          persist-credentials: false

      # mise.toml is the single source of truth for the tool versions (ADR
      # 0003), so only the names appear here. They carry their backend prefix
      # because every mise.toml entry is backend-qualified — a bare `node` would
      # not match the `core:node` key.
      - name: Setup mise and the pinned tools
        uses: ./.github/actions/setup-mise
        with:
          tools: core:node aqua:pnpm/pnpm
          github-token: ${{ secrets.GITHUB_TOKEN }}

      - name: Resolve the pnpm store path
        id: pnpm-store
        shell: bash
        run: |
          path="$(pnpm store path)"
          echo "path=${path}" >> "$GITHUB_OUTPUT"

      - name: Cache the pnpm store
        uses: actions/cache@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
        with:
          path: ${{ steps.pnpm-store.outputs.path }}
          key: ${{ runner.os }}-pnpm-store-${{ hashFiles('pnpm-lock.yaml') }}
          restore-keys: ${{ runner.os }}-pnpm-store-

      # The whole workspace is installed, not just the root: the 1:1 gate decides "is this
      # export callable" from the type checker, and a package whose dependencies are absent
      # resolves to `any`, which has no call signatures. The gate would then require nothing
      # and report a clean run. It fails loudly on an unresolved import instead, so the
      # trees have to be here.
      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      # The full variant: coverage with no cache, and the thresholds in
      # `vitest.scripts.config.ts` are part of the gate. A new decision branch that nobody
      # exercises is exactly how these scripts start reporting a clean run, so an uncovered
      # branch fails here rather than being reported as a percentage nobody reads.
      - name: Run the scripts suite with coverage
        run: make scripts-test
