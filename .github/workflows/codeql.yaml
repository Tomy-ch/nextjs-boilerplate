name: CodeQL Scan

# SAST over the application's own source (ADR 0110 §3). It sees what the dependency
# scanners do not: a flaw this repository wrote, rather than one it pulled in.
#
# No matrix. This repository is one language, and a matrix would make the reported
# context name depend on the leg — a required check cannot be registered against a
# name that branches at run time (ADR 0153 §5).
#
# High-severity findings block the merge through code scanning's own required
# setting, not through this job's exit code (ADR 0110 §3). The job fails only when
# the analysis itself could not run.
#
# Deliberately unfiltered by `paths`; the reason every workflow runs on every PR is
# in README.md.

on:
  pull_request:
  push:
    branches:
      - production
      - staging
      - develop
      - 'release/**'
  schedule:
    - cron: '15 1 * * 1'
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  codeql:
    runs-on: ubuntu-latest
    # security-extended is a larger suite than the default one.
    timeout-minutes: 30
    permissions:
      contents: read
      security-events: write
      actions: read

    steps:
      - name: Harden the runner
        uses: step-security/harden-runner@05e31511f85b41b11d1cf0ef85d0992719546e2c # v2.21.0
        with:
          egress-policy: audit

      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      # `build-mode: none` extracts straight from source. Saying so is required —
      # without it CodeQL looks for a build that this analysis does not need, and a
      # `next build` here would only add the framework's own output to the corpus.
      - name: Initialize CodeQL
        uses: github/codeql-action/init@ff2f1c621b7f889edc0d3c761ac2e6a3f8cdb0dd # v4.37.7
        with:
          languages: javascript-typescript
          build-mode: none
          config-file: .github/codeql/codeql-config.yml

      - name: Perform CodeQL Analysis
        uses: github/codeql-action/analyze@ff2f1c621b7f889edc0d3c761ac2e6a3f8cdb0dd # v4.37.7
        with:
          category: '/language:javascript-typescript'
