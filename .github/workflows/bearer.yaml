name: Bearer Scan

# Bearer follows a value to the point where it leaves the process — a log line, an
# outbound request, a third-party client — and reports it against a classification of
# what the value is. Nothing else here asks that: opengrep and CodeQL judge a pattern
# or a taint path on its own terms, and neither knows that the string reaching a
# logger happens to be an email address (ADR 0110 §3).
#
# WIRED THE WAY CodeQL IS: a FINDING never fails the job. Findings go to code scanning,
# and what turns a pull request red is GitHub's own check over the alerts the diff
# introduces.
#
# A BROKEN MECHANISM DOES fail it. Reporting is this job's entire output — there is no
# gate and no PR comment — so a scan that crashed, a SARIF that was never written, or
# an upload that did not land all produce the same green check as a clean run. That is
# the one failure mode a reporting-only job must not have: "not scanned" is
# indistinguishable from "nothing found". The distinction this job draws is the same
# one `dependency-scan` draws.
#
# It never fails because THE BASELINE IS NOT ZERO, and it cannot honestly be made
# zero. Measured on this tree: six findings, none of them real. Four were
# `hardcoded_secret` on a test fixture and on the mock-OIDC development helper — both
# excluded by path in `.makefiles/security/bearer.mk`, because a placeholder that
# exists to be a placeholder is not a secret. The remaining two are
# `observable_timing` on `href === current` and on `accessToken === ""`, neither of
# which compares a secret. Silencing that rule would be a rule-wide disable, which
# ADR 0110 §3.4 forbids, so the two stay visible instead.
#
# Deliberately unfiltered by `paths`; the reason every workflow runs on every PR is
# in README.md.

on:
  pull_request:
  schedule:
    - cron: '15 3 * * 1'
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  bearer:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    permissions:
      contents: read
      security-events: write

    steps:
      - name: Harden the runner
        uses: step-security/harden-runner@bf7454d06d71f1098171f2acdf0cd4708d7b5920 # v2.20.0
        with:
          egress-policy: audit

      - name: Checkout
        uses: actions/checkout@9c091bb21b7c1c1d1991bb908d89e4e9dddfe3e0 # v7.0.0
        with:
          persist-credentials: false

      - name: Setup mise and the pinned tools
        uses: ./.github/actions/setup-mise
        with:
          tools: aqua:Bearer/bearer
          github-token: ${{ secrets.GITHUB_TOKEN }}

      # `make bearer-scan` passes --exit-code 0, so findings leave the status at zero.
      # Anything non-zero here is the tool failing, not the code.
      - name: Run the Bearer scan
        env:
          BEARER_ARGS: --format sarif --output bearer.sarif
        run: make bearer-scan

      # An empty or missing report means the scan produced nothing to report with.
      - name: Require the SARIF to exist
        run: test -s bearer.sarif

      # Not `continue-on-error`. Code scanning is where this job's output goes; if the
      # upload does not land, the job produced nothing.
      - name: Upload the SARIF to code scanning
        uses: github/codeql-action/upload-sarif@5595ccaf912efad79be6eef63a5619ff05969be3 # v4.37.6
        with:
          sarif_file: bearer.sarif
          category: bearer
