name: Dead Code

# Reports files, exports and dependencies that nothing reaches.
#
# This closes a gap the other gates cannot see. The 1:1 correspondence gate in Scripts Check
# asks whether an export has a matching `describe`, and the coverage thresholds ask whether
# its branches run — an export nobody calls satisfies both, because its own test is the
# caller. Only reachability from a real entry point separates "supported API" from
# "code that survived a refactor".
#
# The published surface is declared as entry points in `knip.ts`. A boilerplate exports the
# components a repository created from this template consumes, so "unused inside this
# repository" is the expected steady state there and is not a finding; everything else is
# internal and is.
#
# The job always starts and then asks `diff-scope` whether the diff can reach what knip reads,
# so the required context is reported even when the expensive steps stand down. No `paths:`
# filter, deliberately — README.md says why.

on:
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  dead-code:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    permissions:
      contents: read

    steps:
      - name: Harden the runner
        uses: bullfrogsec/bullfrog@7dee337d4575320b6d8cbe9a56d48d2fb765963a # v0.11.1
        with:
          egress-policy: block
          dns-policy: allowed-domains-only
          enable-sudo: false
          allowed-ips: |
            127.0.0.100
            172.17.0.1
          allowed-domains: |
            github.com
            api.github.com
            codeload.github.com
            release-assets.githubusercontent.com
            *.actions.githubusercontent.com
            *.blob.core.windows.net
            *.githubapp.com
            mise-versions.jdx.dev
            nodejs.org
            registry.npmjs.org

      - name: Checkout
        uses: actions/checkout@9c091bb21b7c1c1d1991bb908d89e4e9dddfe3e0 # v7.0.0
        with:
          persist-credentials: false

      # What knip never reads. `scripts/**` and `.github/**` are not listed: scripts are
      # internal code here, and the workflows' `run:` lines are where knip finds binaries used.
      - name: Decide whether the diff can reach what knip reads
        id: scope
        uses: ./.github/actions/diff-scope
        with:
          base-ref: ${{ github.base_ref }}
          ignore: |
            docs/*
            *.md
            .claude/*
            .agents/*
            .cursor/*
            .gemini/*

      - name: Setup mise and the pinned tools
        if: steps.scope.outputs.relevant == 'true'
        uses: ./.github/actions/setup-mise
        with:
          tools: core:node aqua:pnpm/pnpm
          github-token: ${{ secrets.GITHUB_TOKEN }}

      - name: Install dependencies
        if: steps.scope.outputs.relevant == 'true'
        uses: ./.github/actions/setup-deps

      - name: Report unused files, exports and dependencies
        if: steps.scope.outputs.relevant == 'true'
        run: pnpm knip
