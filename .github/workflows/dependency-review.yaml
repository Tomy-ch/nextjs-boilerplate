name: Dependency Review

# Blocks a pull request before merge when it introduces a dependency with a known
# vulnerability — the one question the other dependency scanners do not ask. Trivy,
# `pnpm audit` and OSV all read the tree as it stands, so a vulnerability inherited from the
# base is indistinguishable from one this change added, and the inherited ones are exactly
# what a report-only gate has to tolerate. This reads the diff of the dependency graph
# instead, which makes failing on it fair: whoever adds a known-vulnerable package can take
# it back out.
#
# GITHUB'S DEPENDENCY GRAPH MUST BE ENABLED — a one-time repository setting. The API behind
# it is free on a public repository while a private one needs a GitHub Advanced Security
# (Code Security) licence; `docs/get-started/setup-repository.md` §3 says where to turn the
# graph on and how to remove this workflow when the licence is not wanted. Without the graph
# the action fails rather than standing down: a gate that quietly skips when the thing it
# reads is switched off is indistinguishable from one that found nothing, and this is the
# only layer that sees what a pull request ADDED.
#
# Runs on every PR without a `paths:` filter. A lockfile is not the only way the graph
# moves — an override, a workspace field, an action pin all do — and the action simply
# reports no change when the graph did not move.

on:
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  dependency-review:
    # The action reads the comparison between a PR's base and head, which a manual run
    # has no way to supply.
    if: github.event_name == 'pull_request'
    runs-on: ubuntu-latest
    timeout-minutes: 10
    permissions:
      contents: read
      pull-requests: write

    steps:
      - name: Harden the runner
        uses: bullfrogsec/bullfrog@7dee337d4575320b6d8cbe9a56d48d2fb765963a # v0.11.1
        with:
          egress-policy: block
          dns-policy: allowed-domains-only
          enable-sudo: false
          allowed-ips: |
            127.0.0.100
            172.17.0.1
          allowed-domains: |
            github.com
            api.github.com
            codeload.github.com
            release-assets.githubusercontent.com
            *.actions.githubusercontent.com
            *.blob.core.windows.net
            *.githubapp.com
            mise-versions.jdx.dev
            nodejs.org
            registry.npmjs.org
            api.deps.dev
            api.securityscorecards.dev

      - name: Checkout
        uses: actions/checkout@9c091bb21b7c1c1d1991bb908d89e4e9dddfe3e0 # v7.0.0
        with:
          persist-credentials: false

      # `high` matches the dependency audit gate's threshold, so the two
      # do not disagree about the same package for different reasons.
      #
      # `comment-summary-in-pr` posts through the action rather than the shared upsert
      # action: the body is the action's own structured summary, not a check log.
      - name: Review the dependency diff
        uses: actions/dependency-review-action@a1d282b36b6f3519aa1f3fc636f609c47dddb294 # v5.0.0
        with:
          fail-on-severity: high
          comment-summary-in-pr: on-failure
