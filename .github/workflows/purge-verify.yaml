name: Purge Verify

# Runs the sample purge on a throwaway checkout and proves the repository still
# builds and passes every gate without the sample.
#
# This job exists because the fork-side verifier self-destructs after its single
# successful run (`scripts/setup/verify-sample-removal`). Nothing else would notice
# if the purge stopped working: a marker added outside a stripped region, a new
# import that reaches into the sample, or a manifest entry that went stale would
# all stay green until someone actually forked and ran it.
#
# The checkout is disposable, so the job deliberately deletes tracked files and
# never pushes anything back.
#
# A fork that has already purged no longer has the tooling this job drives, because
# the purge manifest removes it. The job then fails on a missing script, which is
# the intended signal: the guard step below turns that into an explicit instruction
# instead of a puzzling "file not found". Deleting this workflow as part of the purge
# was considered and rejected — a fork that later grows its own sample would have
# lost the mechanism with no trace that it ever existed.
#
# Deliberately unfiltered by `paths`; the reason every CI Checks workflow runs on
# every PR is in README.md.

on:
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

# Select the CI environment file (env/.env.ci). Without this the loader falls back to
# `local`, which ships a placeholder session secret that the config layer refuses outside
# development — the build then fails on a value that is only meant for a workstation.
env:
  APP_ENV: ci

jobs:
  purge-verify:
    runs-on: ubuntu-latest
    permissions:
      contents: read

    steps:
      - name: Harden the runner
        uses: step-security/harden-runner@bf7454d06d71f1098171f2acdf0cd4708d7b5920 # v2.20.0
        with:
          egress-policy: block
          allowed-endpoints: >
            github.com:443
            api.github.com:443
            codeload.github.com:443
            release-assets.githubusercontent.com:443
            *.actions.githubusercontent.com:443
            *.blob.core.windows.net:443
            *.githubapp.com:443
            prod.app-api.stepsecurity.io:443
            mise-versions.jdx.dev:443
            nodejs.org:443
            registry.npmjs.org:443
            fonts.googleapis.com:443
            fonts.gstatic.com:443

      - name: Checkout
        uses: actions/checkout@9c091bb21b7c1c1d1991bb908d89e4e9dddfe3e0 # v7.0.0
        with:
          persist-credentials: false

      - name: Setup mise and the pinned tools
        uses: ./.github/actions/setup-mise
        with:
          tools: core:node aqua:pnpm/pnpm
          github-token: ${{ secrets.GITHUB_TOKEN }}

      - name: Resolve the pnpm store path
        id: pnpm-store
        shell: bash
        run: |
          # Assigned first so a failure inside the substitution fails the step; an
          # `echo "$(...)"` would report success and hand the cache an empty path.
          path="$(pnpm store path)"
          echo "path=${path}" >> "$GITHUB_OUTPUT"

      - name: Cache the pnpm store
        uses: actions/cache@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
        with:
          path: ${{ steps.pnpm-store.outputs.path }}
          key: ${{ runner.os }}-pnpm-store-${{ hashFiles('pnpm-lock.yaml') }}
          restore-keys: ${{ runner.os }}-pnpm-store-

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      # Fails loudly with an actionable message when the sample is already gone, so a
      # fork does not have to work out why a script is missing.
      - name: Require the purge tooling to be present
        shell: bash
        run: |
          if [ ! -d scripts/setup/remove-sample ]; then
            echo "::error::The sample has already been purged, so this job has nothing to verify."
            echo "::error::Delete .github/workflows/purge-verify.yaml — it only guards the boilerplate itself."
            exit 1
          fi

      # Preview first. A manifest entry pointing outside the repository, or a marker
      # block left unclosed, fails here before anything is deleted.
      - name: Preview the purge
        run: pnpm exec tsx scripts/setup/remove-sample --dry-run

      - name: Purge the sample
        run: pnpm exec tsx scripts/setup/remove-sample

      # The gates run against the purged tree. A reference left behind by the
      # manifest surfaces here and nowhere earlier.
      - name: Format the purged tree
        run: pnpm fix

      - name: Lint the purged tree
        run: pnpm lint:ci

      - name: Typecheck the purged tree
        run: pnpm typecheck

      - name: Lint markdown of the purged tree
        run: pnpm md-lint

      - name: Build the purged tree
        run: pnpm build

      - name: Test the purged tree
        run: pnpm test

      - name: Test the scripts of the purged tree
        run: pnpm test:scripts

      # Runs last: it self-destructs on success, so anything after it would be
      # verifying a tree whose verifier is already gone.
      - name: Verify the purge left nothing behind
        run: pnpm exec tsx scripts/setup/verify-sample-removal
