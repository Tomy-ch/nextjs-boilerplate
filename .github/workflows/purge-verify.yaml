name: Purge Verify

# Runs the sample purge on a throwaway checkout and proves the repository still
# builds and passes every gate without the sample.
#
# This job exists because the verifier a repository created from this template runs
# self-destructs after its single successful run (`scripts/setup/verify-sample-removal`).
# Nothing else would notice if the purge stopped working: a marker added outside a
# stripped region, a new import that reaches into the sample, or a manifest entry that
# went stale would all stay green until someone actually created a repository from the
# template and ran it.
#
# The checkout is disposable, so the job deliberately deletes tracked files and
# never pushes anything back.
#
# A repository created from this template that has already purged no longer has the
# tooling this job drives, because the purge manifest removes it. The job then fails on
# a missing script, which is the intended signal: the guard step below turns that into
# an explicit instruction instead of a puzzling "file not found". The purge does not
# delete this workflow itself: a generated repository that later grows its own sample
# would lose the mechanism with no trace that it ever existed.
#
# ## What this job does NOT run
#
# The end-to-end suite. It needs a browser container plus a production build and costs
# about four and a half minutes, which is why `e2e.yaml` defers it rather than running it
# on every pull request; bolting it onto a job that DOES run on every pull request would
# undo that decision. The gap it leaves is narrow and covered statically instead: a spec
# points at a screen by writing its path as a string, so a screen removed by the purge
# leaves the spec pointing at nothing and no type check sees it. `scripts/e2e-routes.gate.test.ts`
# resolves every path literal in `e2e/**/*.spec.ts` against the routes that actually exist
# under `src/app`, and it runs as part of `pnpm test:scripts` below — on the purged tree.
#
# No `paths:` filter, deliberately — README.md says why every workflow runs on every PR.

on:
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

# Select the CI environment file (env/.env.ci).
env:
  APP_ENV: ci

jobs:
  purge-verify:
    runs-on: ubuntu-latest
    permissions:
      contents: read

    steps:
      - name: Harden the runner
        uses: bullfrogsec/bullfrog@7dee337d4575320b6d8cbe9a56d48d2fb765963a # v0.11.1
        with:
          egress-policy: block
          dns-policy: allowed-domains-only
          enable-sudo: false
          allowed-ips: |
            127.0.0.100
          allowed-domains: |
            github.com
            api.github.com
            codeload.github.com
            release-assets.githubusercontent.com
            *.actions.githubusercontent.com
            *.blob.core.windows.net
            *.githubapp.com
            mise-versions.jdx.dev
            nodejs.org
            registry.npmjs.org
            fonts.googleapis.com
            fonts.gstatic.com

      - name: Checkout
        uses: actions/checkout@9c091bb21b7c1c1d1991bb908d89e4e9dddfe3e0 # v7.0.0
        with:
          persist-credentials: false

      - name: Setup mise and the pinned tools
        uses: ./.github/actions/setup-mise
        with:
          tools: core:node aqua:pnpm/pnpm
          github-token: ${{ secrets.GITHUB_TOKEN }}

      - name: Install dependencies
        uses: ./.github/actions/setup-deps
      - name: Require the purge tooling to be present
        shell: bash
        run: |
          if [ ! -d scripts/setup/remove-sample ]; then
            echo "::error::The sample has already been purged, so this job has nothing to verify."
            echo "::error::Delete .github/workflows/purge-verify.yaml — it only verifies the purge, and the purge has already run."
            exit 1
          fi

      # Preview first. A manifest entry pointing outside the repository, or a marker
      # block left unclosed, fails here before anything is deleted.
      - name: Preview the purge
        run: pnpm exec tsx scripts/setup/remove-sample --dry-run

      # Also puts back the files the purge cannot express as a deletion — the entry screen
      # (`/`), which the sample occupies but which the not-found link, the proxy fallback
      # and the sitemap all point at (`SAMPLE_RESTORATIONS`).
      - name: Purge the sample
        run: pnpm exec tsx scripts/setup/remove-sample

      # The gates run against the purged tree. A reference left behind by the
      # manifest surfaces here and nowhere earlier.
      - name: Format the purged tree
        run: pnpm fix

      - name: Lint the purged tree
        run: pnpm lint:ci

      - name: Typecheck the purged tree
        run: pnpm typecheck

      - name: Lint markdown of the purged tree
        run: pnpm lint:md

      - name: Build the purged tree
        run: pnpm build

      - name: Test the purged tree
        run: pnpm test

      - name: Test the scripts of the purged tree
        run: pnpm test:scripts

      # Runs last: it self-destructs on success, so anything after it would be
      # verifying a tree whose verifier is already gone.
      - name: Verify the purge left nothing behind
        run: pnpm exec tsx scripts/setup/verify-sample-removal
