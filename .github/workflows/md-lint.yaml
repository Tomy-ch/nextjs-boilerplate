name: Markdown Lint

# markdownlint-cli2, the mermaid syntax check, and skill-lint (the semantic check over
# `.claude/**`) — the same command the pre-commit hook runs.
# biome does not read Markdown, so nothing else in CI would catch a broken document, an
# unrenderable diagram, or a skill instructing an agent to run a target that no longer exists.
#
# No `paths:` filter, deliberately — README.md says why every workflow runs on every PR.

on:
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  md-lint:
    runs-on: ubuntu-latest
    permissions:
      contents: read
      pull-requests: write

    steps:
      - name: Harden the runner
        uses: bullfrogsec/bullfrog@7dee337d4575320b6d8cbe9a56d48d2fb765963a # v0.11.1
        with:
          egress-policy: block
          dns-policy: allowed-domains-only
          enable-sudo: false
          allowed-ips: |
            127.0.0.100
            172.17.0.1
          allowed-domains: |
            github.com
            api.github.com
            codeload.github.com
            release-assets.githubusercontent.com
            *.actions.githubusercontent.com
            *.blob.core.windows.net
            *.githubapp.com
            mise-versions.jdx.dev
            nodejs.org
            registry.npmjs.org

      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - name: Setup mise and the pinned tools
        uses: ./.github/actions/setup-mise
        with:
          tools: core:node aqua:pnpm/pnpm
          github-token: ${{ secrets.GITHUB_TOKEN }}

      - name: Install dependencies
        uses: ./.github/actions/setup-deps

      - name: Run markdownlint and the mermaid check
        id: md-lint
        shell: bash
        run: |
          set +e

          pnpm lint:md 2>&1 | tee /tmp/md-lint.log
          code=${PIPESTATUS[0]}

          if [ "${code}" -eq 0 ]; then
            echo "status=success" >> "$GITHUB_OUTPUT"
            echo "title=## ✅ Markdown lint: PASS" >> "$GITHUB_OUTPUT"
          else
            echo "status=failure" >> "$GITHUB_OUTPUT"
            echo "title=## ❌ Markdown lint: FAIL" >> "$GITHUB_OUTPUT"
          fi

          exit 0

      - name: Comment markdown lint result on PR
        if: github.event_name == 'pull_request'
        continue-on-error: true
        uses: ./.github/actions/upsert-pr-comment
        with:
          github-token: ${{ secrets.GITHUB_TOKEN }}
          marker: '<!-- md-lint-result -->'
          status: ${{ steps.md-lint.outputs.status }}
          title: ${{ steps.md-lint.outputs.title }}
          body-file: /tmp/md-lint.log
          details-summary: 'markdownlint / mermaid log'

      - name: Fail if markdown lint failed
        if: always() && steps.md-lint.outputs.status != 'success'
        run: exit 1
