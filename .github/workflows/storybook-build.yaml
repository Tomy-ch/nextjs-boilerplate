name: Storybook Build

# `build-storybook`. Separate from `deploy-docs` on purpose: that workflow owns the
# delivery to Pages and only runs on `production`, so a broken story or addon import
# would surface at release time rather than on the pull request that broke it.
#
# What this catches is what `test` cannot. Vitest imports story modules directly and
# never resolves the addon graph or the builder config, so a story that fails to
# bundle still passes the unit suite.
#
# `vrt` also builds Storybook, but only as a step on the way to the screenshots. A
# bundling failure there reads as "the comparison could not run", which sends the
# reader to the wrong place. This job answers the narrower question on its own.
#
# The job always starts and then asks `diff-scope` whether the diff can reach the Storybook
# bundle, so the required context is reported even when the expensive steps stand down. No
# `paths:` filter, deliberately — README.md says why.

on:
  pull_request:
  workflow_dispatch:

# Select the CI environment file (env/.env.ci).
env:
  APP_ENV: ci

permissions:
  contents: read

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  storybook-build:
    runs-on: ubuntu-latest
    permissions:
      contents: read
      pull-requests: write

    steps:
      - name: Harden the runner
        uses: bullfrogsec/bullfrog@7dee337d4575320b6d8cbe9a56d48d2fb765963a # v0.11.1
        with:
          egress-policy: block
          dns-policy: allowed-domains-only
          enable-sudo: false
          allowed-ips: |
            127.0.0.100
            172.17.0.1
          allowed-domains: |
            github.com
            api.github.com
            codeload.github.com
            release-assets.githubusercontent.com
            *.actions.githubusercontent.com
            *.blob.core.windows.net
            *.githubapp.com
            mise-versions.jdx.dev
            nodejs.org
            registry.npmjs.org
            fonts.googleapis.com
            fonts.gstatic.com

      - name: Checkout
        uses: actions/checkout@9c091bb21b7c1c1d1991bb908d89e4e9dddfe3e0 # v7.0.0
        with:
          persist-credentials: false

      # What the Storybook bundle never imports: tests, the journeys and the helper scripts.
      # `vrt/**`, `tokens/**` and `mocks/**` are not listed — the catalog and the stories
      # render from them.
      - name: Decide whether the diff can reach the Storybook bundle
        id: scope
        uses: ./.github/actions/diff-scope
        with:
          base-ref: ${{ github.base_ref }}
          ignore: |
            docs/*
            *.md
            .claude/*
            .agents/*
            .cursor/*
            .gemini/*
            e2e/*
            *.test.ts
            *.test.tsx
            scripts/*

      - name: Setup mise and the pinned tools
        if: steps.scope.outputs.relevant == 'true'
        uses: ./.github/actions/setup-mise
        with:
          tools: core:node aqua:pnpm/pnpm
          github-token: ${{ secrets.GITHUB_TOKEN }}

      - name: Install dependencies
        if: steps.scope.outputs.relevant == 'true'
        uses: ./.github/actions/setup-deps

      - name: Run build-storybook
        id: storybook-build
        if: steps.scope.outputs.relevant == 'true'
        shell: bash
        run: |
          set +e

          pnpm build-storybook 2>&1 | tee /tmp/storybook-build.log
          code=${PIPESTATUS[0]}

          if [ "${code}" -eq 0 ]; then
            echo "status=success" >> "$GITHUB_OUTPUT"
            echo "title=## ✅ Storybook build: PASS" >> "$GITHUB_OUTPUT"
          else
            echo "status=failure" >> "$GITHUB_OUTPUT"
            echo "title=## ❌ Storybook build: FAIL" >> "$GITHUB_OUTPUT"
          fi

          exit 0

      # A job that stood down still owes the pull request a verdict (README § PR Comments, the
      # `diff-scope` bullet). The body file is the one the comment step reads.
      - name: Note that the diff cannot reach the Storybook bundle
        id: standdown
        if: steps.scope.outputs.relevant != 'true'
        shell: bash
        run: |
          echo 'title=## ⏭️ Storybook build: SKIP (diff cannot reach the bundle)' >> "$GITHUB_OUTPUT"
          echo 'この PR の差分は Storybook の bundle に届かないため、build-storybook を実行していません。' > /tmp/storybook-build.log

      - name: Comment Storybook build result on PR
        if: github.event_name == 'pull_request' && (steps.storybook-build.outputs.status != '' || steps.standdown.outcome == 'success')
        continue-on-error: true
        uses: ./.github/actions/upsert-pr-comment
        with:
          github-token: ${{ secrets.GITHUB_TOKEN }}
          marker: '<!-- storybook-build-result -->'
          status: ${{ steps.storybook-build.outputs.status || 'success' }}
          title: ${{ steps.storybook-build.outputs.title || steps.standdown.outputs.title }}
          body-file: /tmp/storybook-build.log
          details-summary: 'build-storybook log'

      - name: Fail if build-storybook failed
        if: always() && steps.scope.outputs.relevant == 'true' && steps.storybook-build.outputs.status != 'success'
        run: exit 1
