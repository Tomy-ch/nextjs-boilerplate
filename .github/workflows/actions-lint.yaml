name: Actions Lint

# Lints the Actions definitions themselves — the same commands the pre-commit hook
# runs (ADR 0153: hooks mirror CI). Three checks, one concern:
#
#   actionlint          — workflow syntax, plus the shell of every `run:` in
#                         `.github/workflows`. shellcheck is installed alongside it
#                         because actionlint shells out to it; on a runner without it
#                         the shell checks are silently skipped rather than reported.
#   actions-shellcheck  — the shell of every `run:` in a composite action. actionlint
#                         scans only `.github/workflows` and rejects an `action.yaml`
#                         handed to it directly (it reads the file as a workflow), so
#                         without this the shells under `.github/actions` reach no gate
#                         at all (ADR 0153 §1, revert condition W10).
#   actions-comment-…   — no secret reaches a job that posts a PR comment. Secret
#     …secret-lint        masking only covers what the runner captures for the log, so
#                         bytes written to a file with `tee` pass through unmasked and
#                         land verbatim in a public comment. actionlint cannot express
#                         that rule, so it is checked here (ADR 0153 §5).
#
# All three are reported through a single PR comment: they answer the same question —
# are the Actions definitions we are about to execute correct — and splitting them
# would add further required checks for one concern.
#
# Deliberately unfiltered by `paths`; the reason every CI Checks workflow runs on
# every PR is in README.md.

on:
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  actions-lint:
    runs-on: ubuntu-latest
    permissions:
      contents: read
      pull-requests: write

    steps:
      - name: Harden the runner
        uses: step-security/harden-runner@bf7454d06d71f1098171f2acdf0cd4708d7b5920 # v2.20.0
        with:
          egress-policy: audit

      - name: Checkout
        uses: actions/checkout@9c091bb21b7c1c1d1991bb908d89e4e9dddfe3e0 # v7.0.0
        with:
          persist-credentials: false

      # mise.toml is the single source of truth for the tool versions (ADR
      # 0003), so only the names appear here. They carry their backend prefix
      # because every mise.toml entry is backend-qualified — a bare `node` would
      # not match the `core:node` key.
      - name: Setup mise and the pinned tools
        uses: ./.github/actions/setup-mise
        with:
          tools: aqua:rhysd/actionlint aqua:koalaman/shellcheck core:node aqua:pnpm/pnpm
          github-token: ${{ secrets.GITHUB_TOKEN }}

      - name: Resolve the pnpm store path
        id: pnpm-store
        shell: bash
        run: |
          path="$(pnpm store path)"
          echo "path=${path}" >> "$GITHUB_OUTPUT"

      - name: Cache the pnpm store
        uses: actions/cache@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
        with:
          path: ${{ steps.pnpm-store.outputs.path }}
          key: ${{ runner.os }}-pnpm-store-${{ hashFiles('pnpm-lock.yaml') }}
          restore-keys: ${{ runner.os }}-pnpm-store-

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      # Every check runs unconditionally so one failure does not hide another's
      # findings, and all logs land in the same PR comment.
      - name: Run Actions lint
        id: actions-lint
        shell: bash
        run: |
          set +e

          make actionlint 2>&1 | tee /tmp/actions-lint.log
          actionlint_code=${PIPESTATUS[0]}

          make actions-shellcheck 2>&1 | tee -a /tmp/actions-lint.log
          shellcheck_code=${PIPESTATUS[0]}

          make actions-comment-secret-lint 2>&1 | tee -a /tmp/actions-lint.log
          secret_lint_code=${PIPESTATUS[0]}

          summary="actionlint + composite-action shellcheck + pr-comment secret lint"
          if [ "${actionlint_code}" -eq 0 ] \
            && [ "${shellcheck_code}" -eq 0 ] \
            && [ "${secret_lint_code}" -eq 0 ]; then
            echo "status=success" >> "$GITHUB_OUTPUT"
            echo "title=## ✅ Actions lint: PASS (${summary})" >> "$GITHUB_OUTPUT"
          else
            echo "status=failure" >> "$GITHUB_OUTPUT"
            echo "title=## ❌ Actions lint: FAIL (${summary})" >> "$GITHUB_OUTPUT"
          fi

          exit 0

      - name: Comment actions lint result on PR
        if: github.event_name == 'pull_request'
        continue-on-error: true
        uses: ./.github/actions/upsert-pr-comment
        with:
          github-token: ${{ secrets.GITHUB_TOKEN }}
          marker: '<!-- actions-lint-result -->'
          title: ${{ steps.actions-lint.outputs.title }}
          body-file: /tmp/actions-lint.log
          details-summary: 'Actions lint log'

      - name: Fail if the Actions lint failed
        if: always() && steps.actions-lint.outputs.status != 'success'
        run: exit 1
