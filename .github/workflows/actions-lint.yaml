name: Actions Lint

# Lints the Actions definitions themselves — the same commands the pre-commit hook
# runs (ADR 0153: hooks mirror CI). Seven checks, one concern:
#
#   actionlint          — workflow syntax, plus the shell of every `run:` in
#                         `.github/workflows`. shellcheck is installed alongside it
#                         because actionlint shells out to it; on a runner without it
#                         the shell checks are silently skipped rather than reported.
#   actions-shellcheck  — the shell of every `run:` in a composite action. actionlint
#                         scans only `.github/workflows` and rejects an `action.yaml`
#                         handed to it directly (it reads the file as a workflow), so
#                         without this the shells under `.github/actions` reach no gate
#                         at all (ADR 0153 §1, revert condition W10).
#   actions-comment-…   — no secret reaches a job that posts a PR comment. Secret
#     …secret-lint        masking only covers what the runner captures for the log, so
#                         bytes written to a file with `tee` pass through unmasked and
#                         land verbatim in a public comment. actionlint cannot express
#                         that rule, so it is checked here (ADR 0153 §5).
#   actions-mise-pin-…  — the mise version, its digest and the cache key agree. mise's
#     …lint               own version cannot live in `mise.toml`, so it is declared in
#                         `.github/actions/setup-mise` in three places at once.
#   actions-required-…  — every context the ruleset marks required is reported on every
#     …check-lint         pull request. A required context that is never reported blocks
#                         the merge forever, and the reasons it goes unreported (a job
#                         renamed, two jobs sharing a name, a `paths:` filter) span two
#                         files at once, which actionlint never reads together.
#   actions-zizmor      — static analysis of the definitions themselves. Neither of the two
#                         above can see quoting inside `${{ … }}`; ADR 0153 §1 has why.
#                         zizmor reads the expressions and gates on high findings only.
#   shellcheck          — every tracked standalone `*.sh`. What lives there is shell
#                         only because it has to run before dependencies are installed
#                         (the exception ADR 0155 allows). Nothing else covers it: it is
#                         not TypeScript, so neither the 1:1 gate nor coverage applies,
#                         and it sits outside `.github` so actionlint and
#                         actions-shellcheck both miss it.
#
# All of them are reported through a single PR comment: they answer the same question
# — is the automation we are about to execute correct — and splitting them would add
# further required checks for one concern.
#
# Deliberately unfiltered by `paths`; the reason every CI Checks workflow runs on
# every PR is in README.md.

on:
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  actions-lint:
    runs-on: ubuntu-latest
    permissions:
      contents: read
      pull-requests: write

    steps:
      - name: Harden the runner
        uses: step-security/harden-runner@05e31511f85b41b11d1cf0ef85d0992719546e2c # v2.21.0
        with:
          egress-policy: audit

      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - name: Setup mise and the pinned tools
        uses: ./.github/actions/setup-mise
        with:
          tools: aqua:rhysd/actionlint aqua:koalaman/shellcheck aqua:zizmorcore/zizmor core:node aqua:pnpm/pnpm
          github-token: ${{ secrets.GITHUB_TOKEN }}

      - name: Resolve the pnpm store path
        id: pnpm-store
        shell: bash
        run: |
          path="$(pnpm store path)"
          echo "path=${path}" >> "$GITHUB_OUTPUT"

      - name: Cache the pnpm store
        uses: actions/cache@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
        with:
          path: ${{ steps.pnpm-store.outputs.path }}
          key: ${{ runner.os }}-pnpm-store-${{ hashFiles('pnpm-lock.yaml') }}
          restore-keys: ${{ runner.os }}-pnpm-store-

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      # Every check runs unconditionally so one failure does not hide another's
      # findings, and all logs land in the same PR comment.
      - name: Run Actions lint
        id: actions-lint
        shell: bash
        run: |
          set +e

          make actionlint 2>&1 | tee /tmp/actions-lint.log
          actionlint_code=${PIPESTATUS[0]}

          make actions-shellcheck 2>&1 | tee -a /tmp/actions-lint.log
          shellcheck_code=${PIPESTATUS[0]}

          make actions-comment-secret-lint 2>&1 | tee -a /tmp/actions-lint.log
          secret_lint_code=${PIPESTATUS[0]}

          make actions-mise-pin-lint 2>&1 | tee -a /tmp/actions-lint.log
          mise_pin_code=${PIPESTATUS[0]}

          make actions-required-check-lint 2>&1 | tee -a /tmp/actions-lint.log
          required_check_code=${PIPESTATUS[0]}

          make actions-zizmor 2>&1 | tee -a /tmp/actions-lint.log
          zizmor_code=${PIPESTATUS[0]}

          make shellcheck 2>&1 | tee -a /tmp/actions-lint.log
          script_shellcheck_code=${PIPESTATUS[0]}

          summary="actionlint + shellcheck + pr-comment secret lint + mise pin + required check + zizmor"
          if [ "${actionlint_code}" -eq 0 ] \
            && [ "${shellcheck_code}" -eq 0 ] \
            && [ "${secret_lint_code}" -eq 0 ] \
            && [ "${mise_pin_code}" -eq 0 ] \
            && [ "${required_check_code}" -eq 0 ] \
            && [ "${zizmor_code}" -eq 0 ] \
            && [ "${script_shellcheck_code}" -eq 0 ]; then
            echo "status=success" >> "$GITHUB_OUTPUT"
            echo "title=## ✅ Actions lint: PASS (${summary})" >> "$GITHUB_OUTPUT"
          else
            echo "status=failure" >> "$GITHUB_OUTPUT"
            echo "title=## ❌ Actions lint: FAIL (${summary})" >> "$GITHUB_OUTPUT"
          fi

          exit 0

      - name: Comment actions lint result on PR
        if: github.event_name == 'pull_request'
        continue-on-error: true
        uses: ./.github/actions/upsert-pr-comment
        with:
          github-token: ${{ secrets.GITHUB_TOKEN }}
          marker: '<!-- actions-lint-result -->'
          title: ${{ steps.actions-lint.outputs.title }}
          body-file: /tmp/actions-lint.log
          details-summary: 'Actions lint log'

      - name: Fail if the Actions lint failed
        if: always() && steps.actions-lint.outputs.status != 'success'
        run: exit 1
