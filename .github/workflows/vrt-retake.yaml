name: VRT Retake

# Retakes the baseline images for the stories the last VRT run reported, pushes them
# to the baseline store, and moves this branch's submodule pointer onto the result.
# That push re-runs VRT, which then passes.
#
# This is NOT where the visual change is approved. The label only develops the change
# into something reviewable: the pixels become a real image diff in the store's
# compare view, and the branch ruleset (`require_last_push_approval`) forces a human
# to approve after the bot's push. Naming the label "approve" would put the word
# where the judgement is not.
#
# The scope is read from the `vrt-report` artifact of that run, not recomputed here.
# Bounding the retake to what was already reported means a story that never appeared
# in the pull-request comment cannot enter the baselines through this path.
#
# A revert triggers the same retake without a label. Pruning the store drops the
# commit the reverted state pointed at, so restoring the code alone would leave the
# pointer dangling. A revert returns to a state that was approved once, so retaking
# it automatically does not weaken what approval means.
#
# Fork pull requests cannot be served: `pull_request` grants a read-only token for
# them and the head branch lives in another repository. Those contributors run
# `make vrt-update` locally instead.

on:
  pull_request:
    types: [labeled, opened, synchronize]

permissions:
  contents: read

concurrency:
  group: ${{ github.workflow }}-${{ github.event.pull_request.number }}
  cancel-in-progress: false

jobs:
  retake:
    if: >-
      github.event.label.name == 'vrt-retake' ||
      startsWith(github.event.pull_request.head.ref, 'revert-')
    runs-on: ubuntu-latest
    timeout-minutes: 30
    permissions:
      contents: write
      pull-requests: write
      actions: read

    outputs:
      comment: ${{ steps.outcome.outputs.comment }}

    steps:
      - name: Harden the runner
        uses: step-security/harden-runner@bf7454d06d71f1098171f2acdf0cd4708d7b5920 # v2.20.0
        with:
          egress-policy: audit

      - name: Refuse fork pull requests
        if: github.event.pull_request.head.repo.full_name != github.repository
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          PR: ${{ github.event.pull_request.number }}
        run: |
          # A fork pull request gets a read-only token whatever `permissions:` asks
          # for, so the comment is best effort — the failed job is the real signal.
          gh pr comment "$PR" --repo "$GITHUB_REPOSITORY" --body \
            '❌ fork からの PR には基準画像を push できません。手元で make vrt-update を実行してコミットしてください。' || true
          exit 1

      # The check that must go green runs against `refs/pull/N/merge` — the branch
      # merged into its base. Retaking on a head that is behind base would capture a
      # different tree than the one being judged, so the label would never clear.
      # Refusing is the honest move: the person merges base in and labels again.
      - name: Refuse a branch that is behind its base
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          PR: ${{ github.event.pull_request.number }}
          BASE: ${{ github.event.pull_request.base.ref }}
          HEAD_SHA: ${{ github.event.pull_request.head.sha }}
        run: |
          behind="$(gh api "repos/$GITHUB_REPOSITORY/compare/$BASE...$HEAD_SHA" --jq .behind_by)"
          if [ "$behind" != "0" ]; then
            gh pr comment "$PR" --repo "$GITHUB_REPOSITORY" --body \
              "❌ base より ${behind} コミット遅れています。判定される木と撮る木が食い違うため、${BASE} を取り込んでからラベルを付け直してください。"
            exit 1
          fi

      - name: Checkout the pull request branch
        uses: actions/checkout@9c091bb21b7c1c1d1991bb908d89e4e9dddfe3e0 # v7.0.0
        with:
          ref: ${{ github.event.pull_request.head.ref }}
          # The updated pointer is pushed back to this branch, so the credentials
          # have to survive checkout. Every other workflow here keeps them off.
          persist-credentials: true

      - name: Fetch the baseline images
        id: baselines
        uses: ./.github/actions/setup-vrt-baselines
        with:
          app-id: ${{ secrets.VRT_APP_ID }}
          private-key: ${{ secrets.VRT_APP_PRIVATE_KEY }}
          persist-credentials: 'true'

      - name: Refuse without a token for the baseline store
        if: steps.baselines.outputs.token == ''
        run: |
          echo '❌ VRT_APP_ID / VRT_APP_PRIVATE_KEY が設定されていません。make setup-vrt-app を実行してください。' >&2
          exit 1

      # A label retakes exactly what the last run reported. A revert instead retakes
      # everything, because the pointer it restored has no baseline set left to
      # compare against — there is no report to bound it to. A revert whose pointer
      # still resolves needs nothing, and stopping there keeps the workflow from
      # commenting on every revert.
      - name: Decide what to retake
        id: mode
        env:
          LABEL: ${{ github.event.label.name }}
          MISSING: ${{ steps.baselines.outputs.missing }}
        run: |
          if [ "$LABEL" = 'vrt-retake' ]; then
            mode=reported
          elif [ "$MISSING" = 'true' ]; then
            mode=full
          else
            mode=none
            echo '✅ 復帰先の基準画像がそのまま残っています。撮り直しません。'
          fi
          echo "mode=${mode}" >> "$GITHUB_OUTPUT"

      # Nothing may be retaken without the set VRT reported for this exact commit.
      # The three ways that set can be unavailable are told apart on purpose: a
      # message that names the wrong cause sends the reader to the wrong fix, and
      # "still running" is by far the most likely of the three.
      - name: Download the reported failures
        id: report
        if: steps.mode.outputs.mode == 'reported'
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          HEAD_SHA: ${{ github.event.pull_request.head.sha }}
        run: |
          runs="$(gh run list --workflow vrt.yaml --repo "$GITHUB_REPOSITORY" \
            --json databaseId,headSha,status --limit 100 \
            --jq "[.[] | select(.headSha == \"$HEAD_SHA\")]")"

          if [ "$(jq 'length' <<<"$runs")" -eq 0 ]; then
            echo "reason=この commit で VRT がまだ実行されていません。実行の完了を待ってからラベルを付け直してください。" >> "$GITHUB_OUTPUT"
            exit 1
          fi

          run_id="$(jq -r '[.[] | select(.status == "completed")][0].databaseId // empty' <<<"$runs")"
          if [ -z "$run_id" ]; then
            echo "reason=この commit の VRT がまだ完了していません。完了を待ってからラベルを付け直してください。" >> "$GITHUB_OUTPUT"
            exit 1
          fi

          gh run download "$run_id" --repo "$GITHUB_REPOSITORY" --name vrt-report --dir tmp/vrt || {
            echo "reason=完了した VRT に差分の報告がありません。緑だったか、artifact の保持期限が切れています。" >> "$GITHUB_OUTPUT"
            exit 1
          }

      - name: Setup mise and the pinned tools
        if: steps.mode.outputs.mode != 'none'
        uses: ./.github/actions/setup-mise
        with:
          tools: core:node aqua:pnpm/pnpm
          github-token: ${{ secrets.GITHUB_TOKEN }}

      - name: Install dependencies
        if: steps.mode.outputs.mode != 'none'
        run: pnpm install --frozen-lockfile

      - name: Retake the baselines
        id: retake
        if: steps.mode.outputs.mode != 'none'
        env:
          MODE: ${{ steps.mode.outputs.mode }}
        shell: bash
        run: |
          if [ "$MODE" = 'full' ]; then
            echo 'ids=全 story' >> "$GITHUB_OUTPUT"
            make vrt-update
            exit 0
          fi

          ids="$(pnpm exec tsx scripts/vrt ids tmp/vrt/report.json)"
          if [ -z "$ids" ]; then
            echo '❌ 報告に差分がありません。撮り直す対象がありません。'
            exit 1
          fi
          echo "ids=${ids}" >> "$GITHUB_OUTPUT"

          make vrt-update VRT_ONLY="$ids"

      # The same command a developer runs as `make vrt-push`, so the shape of what lands
      # in the store does not depend on who took the screenshots.
      - name: Push the baselines to the store
        id: push-store
        if: steps.mode.outputs.mode != 'none'
        env:
          BRANCH: ${{ github.event.pull_request.head.ref }}
        shell: bash
        run: |
          set -euo pipefail

          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git -C vrt/screenshots config user.name 'github-actions[bot]'
          git -C vrt/screenshots config user.email '41898282+github-actions[bot]@users.noreply.github.com'

          pnpm exec tsx scripts/vrt-images push "$BRANCH" >> "$GITHUB_OUTPUT"

      - name: Move the submodule pointer
        id: push
        if: steps.mode.outputs.mode != 'none'
        env:
          IDS: ${{ steps.retake.outputs.ids }}
        run: |
          git commit -m "Test: 報告された差分の基準画像を撮り直す" -m "撮り直し: ${{ github.event_name }} / 対象: ${IDS}"
          git push
          echo "sha=$(git rev-parse HEAD)" >> "$GITHUB_OUTPUT"

      # The body is built here but published by a job that holds no App secret, so a
      # token cannot reach a public comment through the file (ADR 0153).
      - name: Build the outcome comment
        id: outcome
        if: always() && steps.mode.outputs.mode != 'none'
        continue-on-error: true
        env:
          IDS: ${{ steps.retake.outputs.ids }}
          COUNT: ${{ steps.push-store.outputs.count }}
          BEFORE: ${{ steps.push-store.outputs.before }}
          AFTER: ${{ steps.push-store.outputs.after }}
          SHA: ${{ steps.push.outputs.sha }}
          REASON: ${{ steps.report.outputs.reason }}
        shell: bash
        run: |
          store_repo="$(git config --file .gitmodules --get submodule.vrt/screenshots.url |
            sed -e 's|^https://github.com/||' -e 's|\.git$||')"

          {
            if [ -n "$SHA" ]; then
              echo "🎞️ 基準画像を ${COUNT} 枚撮り直しました (${SHA})。"
              echo
              echo "画像差分: https://github.com/${store_repo}/compare/${BEFORE}..${AFTER}"
              echo
              echo "対象の story: ${IDS}"
              echo
              echo "**まだ承認ではありません。** 上の画像差分を見て、意図した変更であることを確かめたうえで PR を承認してください。"
            else
              echo "❌ 基準画像を撮り直せませんでした。${REASON:-詳細は実行ログを確認してください。}"
            fi
          } > comment.md

          {
            echo 'comment<<VRT_EOF'
            cat comment.md
            echo 'VRT_EOF'
          } >> "$GITHUB_OUTPUT"

      # The label stands for one acceptance. Leaving it on would make the next
      # labelling a no-op and hide that a later change was never approved.
      - name: Remove the label
        if: always() && github.event.label.name == 'vrt-retake'
        continue-on-error: true
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          PR: ${{ github.event.pull_request.number }}
        run: gh pr edit "$PR" --repo "$GITHUB_REPOSITORY" --remove-label vrt-retake

  report:
    if: always() && needs.retake.result != 'skipped' && needs.retake.outputs.comment != ''
    needs: retake
    runs-on: ubuntu-latest
    permissions:
      contents: read
      pull-requests: write

    steps:
      - name: Harden the runner
        uses: step-security/harden-runner@bf7454d06d71f1098171f2acdf0cd4708d7b5920 # v2.20.0
        with:
          egress-policy: audit

      - name: Comment the outcome on PR
        continue-on-error: true
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          PR: ${{ github.event.pull_request.number }}
          BODY: ${{ needs.retake.outputs.comment }}
        run: gh pr comment "$PR" --repo "$GITHUB_REPOSITORY" --body "$BODY"
