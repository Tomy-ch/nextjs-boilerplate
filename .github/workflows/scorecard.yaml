name: OpenSSF Scorecard

# Measures this repository's own supply-chain posture — branch protection, pinned
# dependencies, token permissions, the presence of a security policy — rather than
# the code or the dependencies. Creating a repository from a template copies the tree,
# never the branch protection or the token permissions; `make setup-repository` applies
# them, and this score shows whether that step was applied.
#
# The default branch is not a fixed name here: it moves with each release
# (`release/vX.Y.Z`), so the push trigger matches the namespace and the job narrows to
# whichever branch is currently the default one.
#
# Not a required check and no PR trigger. The score is a property of the repository,
# not of a change, and the analysis needs the default branch to read.

on:
  push:
    branches:
      - 'release/*'
  schedule:
    - cron: '0 1 * * 1'
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  scorecard:
    if: github.event_name != 'push' || github.ref_name == github.event.repository.default_branch
    runs-on: ubuntu-latest
    timeout-minutes: 15
    permissions:
      contents: read
      security-events: write

    steps:
      - name: Harden the runner
        uses: bullfrogsec/bullfrog@7dee337d4575320b6d8cbe9a56d48d2fb765963a # v0.11.1
        with:
          egress-policy: block
          dns-policy: allowed-domains-only
          enable-sudo: true
          allowed-ips: |
            127.0.0.100
            172.17.0.1
          allowed-domains: |
            github.com
            api.github.com
            codeload.github.com
            release-assets.githubusercontent.com
            *.actions.githubusercontent.com
            *.blob.core.windows.net
            *.githubapp.com
            mise-versions.jdx.dev
            nodejs.org
            registry.npmjs.org
            api.deps.dev
            api.osv.dev
            ghcr.io
            pkg-containers.githubusercontent.com
            oss-fuzz-build-logs.storage.googleapis.com
            www.bestpractices.dev

      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      # `publish_results: false` — publishing sends the score to the OpenSSF public
      # dataset. That is the repository owner's decision about its name, not a technical
      # one.
      #
      # No `repo_token`, so `Branch-Protection` / `Fuzzing` / `CII-Best-Practices` stay
      # capped. All three are held there on purpose, with the conditions that would
      # reopen each one (see Related ADRs in README.md).
      - name: Run the analysis
        uses: ossf/scorecard-action@fa7117db83c52d787ae5a89f350999701505d78e # v2.5.0
        with:
          results_file: scorecard.sarif
          results_format: sarif
          publish_results: false

      # Not `continue-on-error`, for the reason `bearer.yaml` states: code scanning is
      # this job's entire output, so an upload that does not land leaves it reporting
      # green with nothing behind it.
      - name: Require the SARIF to exist
        run: test -s scorecard.sarif

      - name: Upload the SARIF to code scanning
        uses: github/codeql-action/upload-sarif@6f2ac81f5cd81fe351a197ba0b00d91d03cd2aee # v4.39.0
        with:
          sarif_file: scorecard.sarif
          category: scorecard

  # See README.md § Notifications (why only scheduled runs notify, and why cancelled counts).
  notify-failure:
    needs: scorecard
    if: ${{ always() && github.event_name == 'schedule' && contains(fromJSON('["failure", "cancelled"]'), needs.scorecard.result) }}
    uses: ./.github/workflows/notify.yaml
    with:
      failed-job: scorecard
    secrets:
      slack-webhook-url: ${{ secrets.SLACK_WEBHOOK_URL }}
