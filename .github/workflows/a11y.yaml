name: Accessibility

# Runs axe over every Storybook story in a real browser, inside the same
# digest-pinned container the screenshots use (ADR 0054: the automated a11y check
# rides on the stories; ADR 0091 §3: no additional runner is introduced for it).
#
# Real browser is the point. The component suite's `vitest-axe` runs under jsdom,
# which has no layout and no computed colour, so `color-contrast` is switched off
# there — see the `rules: { "color-contrast": { enabled: false } }` scattered through
# `src/**`. Here both themes are actually painted, so contrast violations that only
# appear in dark mode are reachable.
#
# Kept out of `vrt.yaml` deliberately. An a11y failure landing in the VRT report
# would enter the retake set, and retaking a screenshot does not fix an a11y
# violation — it only marks the baseline as accepted.
#
# No baseline images are needed, so the submodule is not fetched.
#
# Deliberately unfiltered by `paths`; the reason every CI Checks workflow runs on
# every PR is in README.md. The job always starts and then asks `diff-scope` whether the
# diff can reach a story, so the context is reported even when the expensive steps stand
# down. That gate and the input hash `make a11y` computes are two different layers of the
# same question — which layer decides what is in `vrt/README.md`.

on:
  pull_request:
  workflow_dispatch:

# Select the CI environment file (env/.env.ci). Without this the loader falls back to
# `local`, which ships a placeholder session secret that the config layer refuses outside
# development. Storybook loads `next.config.ts` to build the preview, so the refusal lands
# there — and `storybook build` reports success anyway, leaving a tree with no preview.
env:
  APP_ENV: ci

permissions:
  contents: read

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  a11y:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    permissions:
      contents: read

    outputs:
      title: ${{ steps.a11y.outputs.title || steps.standdown.outputs.title }}

    steps:
      - name: Harden the runner
        uses: step-security/harden-runner@bf7454d06d71f1098171f2acdf0cd4708d7b5920 # v2.20.0
        with:
          egress-policy: audit

      - name: Checkout
        uses: actions/checkout@9c091bb21b7c1c1d1991bb908d89e4e9dddfe3e0 # v7.0.0
        with:
          persist-credentials: false

      # Identical to VRT's list, and identical for the same reason: axe reads the rendered
      # page, so anything a story renders from decides a violation. Why the two keep their
      # own copy instead of a shared default is in README.md.
      - name: Decide whether the diff can reach a story
        id: scope
        uses: ./.github/actions/diff-scope
        with:
          base-ref: ${{ github.base_ref }}
          ignore: |
            docs/*
            *.md
            .claude/*
            .agents/*
            .cursor/*
            .gemini/*

      - name: Setup mise and the pinned tools
        if: steps.scope.outputs.relevant == 'true'
        uses: ./.github/actions/setup-mise
        with:
          tools: core:node aqua:pnpm/pnpm
          github-token: ${{ secrets.GITHUB_TOKEN }}

      - name: Resolve the pnpm store path
        id: pnpm-store
        if: steps.scope.outputs.relevant == 'true'
        shell: bash
        run: |
          path="$(pnpm store path)"
          echo "path=${path}" >> "$GITHUB_OUTPUT"

      - name: Cache the pnpm store
        if: steps.scope.outputs.relevant == 'true'
        uses: actions/cache@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
        with:
          path: ${{ steps.pnpm-store.outputs.path }}
          key: ${{ runner.os }}-pnpm-store-${{ hashFiles('pnpm-lock.yaml') }}
          restore-keys: ${{ runner.os }}-pnpm-store-

      - name: Install dependencies
        if: steps.scope.outputs.relevant == 'true'
        run: pnpm install --frozen-lockfile

      # The record of which input state axe already cleared. `make a11y` hashes the rendering
      # inputs itself and skips the run when they match, so the cache only has to carry the
      # record forward — the newest one this branch (or its base) produced. A miss restores
      # nothing and the run happens, which is the safe direction.
      #
      # This record is a11y's own. Reusing VRT's would report green for an input state where
      # axe fails but the baselines happened to be retaken.
      - name: Restore the last verified input state
        if: steps.scope.outputs.relevant == 'true'
        uses: actions/cache/restore@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
        with:
          path: tmp/a11y/verified-inputs.sha256
          key: a11y-verified-${{ github.run_id }}
          restore-keys: a11y-verified-

      - name: Build Storybook and run axe over every story
        id: a11y
        if: steps.scope.outputs.relevant == 'true'
        continue-on-error: true
        shell: bash
        run: |
          set +e

          # The run is entirely CPU-bound (axe evaluates in-page, one story at a time per
          # worker), so it asks for every core instead of Playwright's default half. The
          # percentage form is deliberate: a core count is a fact about the runner, not
          # about this project, and a standard runner has four cores on a public repository
          # but two on a private one — which is what a fork gets.
          # Stream through `tee` rather than redirecting to a file and tailing at the end.
          # A run that is cancelled or hits the job timeout never reaches the tail, so the
          # exact case worth diagnosing — the slow one — is the case that leaves no log at
          # all. Streaming also gets every line stamped with the runner's clock, which is
          # what tells apart a slow Storybook build, a slow image pull and a slow run.
          make a11y VRT_ARGS=--workers=100% 2>&1 | tee /tmp/a11y-full.log
          code=${PIPESTATUS[0]}

          if [ "${code}" -eq 0 ]; then
            echo "status=success" >> "$GITHUB_OUTPUT"
            # Green because axe ran, or green because the inputs had already cleared it —
            # the reader needs to be able to tell those apart.
            if grep -qx 'vrt-gate: skip' /tmp/a11y-full.log; then
              echo "title=## ✅ Accessibility: PASS (inputs unchanged, axe skipped)" >> "$GITHUB_OUTPUT"
            else
              echo "title=## ✅ Accessibility: PASS (axe on every story)" >> "$GITHUB_OUTPUT"
            fi
          else
            echo "status=failure" >> "$GITHUB_OUTPUT"
            echo "title=## ❌ Accessibility: FAIL" >> "$GITHUB_OUTPUT"
          fi

          exit 0

      # Only a clean run is worth carrying forward. The key is unique per run so the save
      # always lands; `restore-keys` above then picks up the newest one.
      - name: Save the verified input state
        if: steps.a11y.outputs.status == 'success'
        uses: actions/cache/save@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
        with:
          path: tmp/a11y/verified-inputs.sha256
          key: a11y-verified-${{ github.run_id }}

      # A job that stood down still owes the pull request a verdict. Without this, the ❌
      # comment an earlier push produced stays beside a green check once the diff stops
      # reaching a story — README.md's "update the comment on success too" invariant,
      # applied to standing down. The body file is the one the comment job reads, so it has
      # to be written here too.
      - name: Note that the diff cannot reach a story
        id: standdown
        if: steps.scope.outputs.relevant != 'true'
        shell: bash
        run: |
          echo 'title=## ⏭️ Accessibility: SKIP (diff cannot reach a story)' >> "$GITHUB_OUTPUT"
          echo 'この PR の差分は story に届かないため、axe を実行していません。' > /tmp/a11y-full.log

      - name: Upload the axe report
        if: always() && steps.a11y.outputs.status == 'failure'
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4.6.2
        with:
          name: a11y-report
          path: tmp/vrt
          retention-days: 7
          if-no-files-found: warn

      - name: Hand the comment body to the commenting job
        if: always() && github.event_name == 'pull_request' && (steps.a11y.outputs.status != '' || steps.standdown.outcome == 'success')
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4.6.2
        with:
          name: a11y-comment
          path: /tmp/a11y-full.log
          retention-days: 1
          if-no-files-found: error

      # `status` is empty when the run stood down, which is not a failure. The scope guard
      # has to be repeated here rather than left to `status`, because "no verdict" and "a bad
      # verdict" read the same to the expression below.
      - name: Fail if a story has a violation
        if: always() && steps.scope.outputs.relevant == 'true' && steps.a11y.outputs.status != 'success'
        run: exit 1

  # Holds no secret beyond `GITHUB_TOKEN`, matching how `vrt.yaml` splits reporting
  # from the job that produces the body.
  a11y-comment:
    if: always() && github.event_name == 'pull_request'
    needs: a11y
    runs-on: ubuntu-latest
    permissions:
      contents: read
      pull-requests: write

    steps:
      - name: Harden the runner
        uses: step-security/harden-runner@bf7454d06d71f1098171f2acdf0cd4708d7b5920 # v2.20.0
        with:
          egress-policy: audit

      - name: Checkout
        uses: actions/checkout@9c091bb21b7c1c1d1991bb908d89e4e9dddfe3e0 # v7.0.0
        with:
          persist-credentials: false

      - name: Download the comment body
        id: body
        continue-on-error: true
        uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c # v8.0.1
        with:
          name: a11y-comment
          path: /tmp/a11y-comment

      - name: Comment the accessibility result on PR
        if: steps.body.outcome == 'success'
        continue-on-error: true
        uses: ./.github/actions/upsert-pr-comment
        with:
          github-token: ${{ secrets.GITHUB_TOKEN }}
          marker: '<!-- a11y-result -->'
          title: ${{ needs.a11y.outputs.title }}
          body-file: /tmp/a11y-comment/a11y-full.log
          details-summary: 'axe log'
