name: E2E

# Drives the built application through its main journeys, and compares each screen
# against its baseline image (ADR 0090 / 0091).
#
# What this job covers beyond the story-level checks (vrt.yaml / a11y.yaml):
#
#   * Journeys       — navigation, filters and the auth pre-dispatch across screens.
#   * Browser errors — hydration mismatches, exceptions thrown while rendering, and
#                      failed requests. A hydration mismatch compiles, type-checks and
#                      only ever shows up in a real browser, so nothing else can see it.
#   * Responsive     — the three bands ADR 0051 §2 fixes, read from the design tokens.
#   * Cross browser  — Chromium, Firefox and WebKit. Those are the three rendering
#                      engines modern browsers reduce to (ADR 0102 defers the version
#                      floor to the fork), and they are ALL this job looks at: no
#                      browser brands, no versions. The versions are whatever the
#                      pinned Playwright image ships.
#
# The application runs on the runner and only the browsers run inside the digest-pinned
# Playwright container. `node_modules` is resolved for the OS and CPU that installed it,
# so starting the server inside the container would need a second, linux-specific tree.
# Pinning the browsers and fonts is what the image is for; pinning the application's
# runtime is not.
#
# Baselines are never written here. Producing them is a deliberate human act, the same
# as for the story-level images (vrt/README.md).
#
# Deliberately unfiltered by `paths`; the reason every CI Checks workflow runs on
# every PR is in README.md.

on:
  pull_request:
  workflow_dispatch:

# Select the CI environment file (env/.env.ci), which is the one that puts the API in
# mock mode. Without a mocked API the journeys would need a backend, and the failures
# would stop being about this repository.
env:
  APP_ENV: ci

permissions:
  contents: read

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  e2e:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    permissions:
      contents: read

    outputs:
      title: ${{ steps.e2e.outputs.title }}

    steps:
      - name: Harden the runner
        uses: step-security/harden-runner@05e31511f85b41b11d1cf0ef85d0992719546e2c # v2.21.0
        with:
          egress-policy: audit

      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - name: Fetch the baseline images
        uses: ./.github/actions/setup-baselines
        with:
          app-id: ${{ secrets.BASELINE_APP_ID }}
          private-key: ${{ secrets.BASELINE_APP_PRIVATE_KEY }}

      - name: Setup mise and the pinned tools
        uses: ./.github/actions/setup-mise
        with:
          tools: core:node aqua:pnpm/pnpm
          github-token: ${{ secrets.GITHUB_TOKEN }}

      - name: Resolve the pnpm store path
        id: pnpm-store
        shell: bash
        run: |
          path="$(pnpm store path)"
          echo "path=${path}" >> "$GITHUB_OUTPUT"

      - name: Cache the pnpm store
        uses: actions/cache@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
        with:
          path: ${{ steps.pnpm-store.outputs.path }}
          key: ${{ runner.os }}-pnpm-store-${{ hashFiles('pnpm-lock.yaml') }}
          restore-keys: ${{ runner.os }}-pnpm-store-

      # Restored before `pnpm install`, and keyed, for the reasons spelled out on the
      # same step in build.yaml. The three must stay identical to share a generation.
      - name: Cache the Next.js build cache
        uses: actions/cache@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
        with:
          path: ${{ github.workspace }}/.next/cache
          key: ${{ runner.os }}-nextjs-${{ hashFiles('pnpm-lock.yaml') }}-${{ hashFiles('**.[jt]s', '**.[jt]sx') }}
          restore-keys: ${{ runner.os }}-nextjs-${{ hashFiles('pnpm-lock.yaml') }}-

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      - name: Build the app, start it and drive it
        id: e2e
        continue-on-error: true
        shell: bash
        run: |
          set +e

          # Streamed through `tee` rather than tailed at the end: a run that is cancelled
          # or hits the job timeout never reaches the tail, so the slow case — the one
          # worth diagnosing — would leave no log at all.
          make e2e 2>&1 | tee /tmp/e2e-full.log
          code=${PIPESTATUS[0]}

          if [ "${code}" -eq 0 ]; then
            echo "status=success" >> "$GITHUB_OUTPUT"
            echo "title=## ✅ E2E: PASS" >> "$GITHUB_OUTPUT"
          else
            echo "status=failure" >> "$GITHUB_OUTPUT"
            echo "title=## ❌ E2E: FAIL" >> "$GITHUB_OUTPUT"
          fi

          exit 0

      # The guidance is split by what actually failed. A retake fixes a changed pixel and
      # nothing else, so printing the retake note unconditionally tells the reader to
      # retake a journey failure or a missing screen declaration — neither of which a
      # retake can repair, and the second of which a retake would bake in as the truth.
      - name: Collect the comment body
        if: always() && steps.e2e.outputs.status != ''
        env:
          HEAD_REF: ${{ github.head_ref }}
          RUN_ID: ${{ github.run_id }}
        shell: bash
        run: |
          # The comment is written to two files, and the split is what decides what renders.
          # `e2e.log` is folded inside a code block because a log line is whatever the tools
          # printed — source text a pull request controls, which must not become markup. The
          # notes are workflow-authored prose, and they render, because a copy-me command says
          # nothing when shown as literal characters.
          mkdir -p /tmp/e2e-comment

          if [ "${{ steps.e2e.outputs.status }}" = "success" ]; then
            echo '主要ジャーニーが 3 つの描画エンジンで通り、画面の見た目も基準画像と一致しました。' > /tmp/e2e-comment/e2e.log
            : > /tmp/e2e-comment/e2e-notes.md
            exit 0
          fi

          # Markers, not exit codes: one run can fail in several kinds at once, and the
          # kinds are what decide which next step is the right one.
          undeclared=false
          journey=false
          pixels=false

          if grep -q '画面の宣言がありません' /tmp/e2e-full.log; then
            undeclared=true
          fi

          if grep -qE '✘.*e2e/journeys/' /tmp/e2e-full.log; then
            journey=true
          fi

          if grep -qE "toHaveScreenshot|A snapshot doesn't exist|@screen-baselines" /tmp/e2e-full.log; then
            pixels=true
          fi

          tail -n 80 /tmp/e2e-full.log > /tmp/e2e-comment/e2e.log

          {
            cat <<'ARTIFACT'
          `e2e-diff` artifact に HTML レポートと、失敗した検証の trace が入っています。
          ARTIFACT

            if [ "${undeclared}" = 'true' ]; then
              cat <<'UNDECLARED'

          ### 画面の宣言が足りていません

          `e2e/lib/screens.ts` へ宣言を足してください。巡回の対象は build の出力から取り、宣言と突き合わせています。**撮り直しでは直りません。**
          UNDECLARED
            fi

            if [ "${journey}" = 'true' ]; then
              cat <<'JOURNEY'

          ### ジャーニーが落ちています

          trace を開いて原因を特定してください。**撮り直しでは直りません。** 1 つの描画エンジンだけが落ちているなら、その engine 固有の挙動か実行環境のゆらぎです。落ちた検証を名指しで実行し直して切り分けてください。
          JOURNEY
            fi

            if [ "${pixels}" = 'true' ]; then
              cat <<'PIXELS'

          ### 画面の見た目が基準画像と違います

          変化が意図したものなら `baseline-retake` ラベルを付けてください。story と画面の基準画像をまとめて CI が撮り直します。手元で撮るなら `make e2e-update` → `make baseline-push` です。

          - **ラベルは引き金ではありません。** VRT / E2E の完了時に読まれる条件なので、完了したあとに付けたなら再実行が要ります（`gh run rerun <run-id>`）
          - **ラベルは撮り直しが置き場へ push した時点で外れます。** もう一度撮るには付け直してください
          - **撮り直しは承認ではありません。** 画素を見て `baseline-approve` を付けるのが承認です（`vrt/README.md` の「撮り直しと承認は別の操作」）

          **落ちた画面それぞれについて、なぜ変わったかを言えるまで撮り直さないでください。** 全画面が一度に落ちる形は原因が 1 つとは限らず、混ざっている不具合ごと撮り直すとそれが次の正になります（`docs/design/vrt.md` の「限界」）。
          PIXELS

              # The failing set in the form the local review target takes. Emitted as its own
              # fenced block so it survives a copy — a command spread across a prose paragraph
              # does not.
              names="$(pnpm exec tsx scripts/e2e names tmp/e2e/report.json || true)"

              # The block below is pasted into a shell, so a value outside the accepted set is
              # dropped rather than quoted. Why quoting is not enough, and why the same set is
              # what lets these values render as markdown, is in ADR 0153 §5.
              if printf '%s%s' "${HEAD_REF}" "${names}" | LC_ALL=C grep -q "[^A-Za-z0-9/._,-]"; then
                names=''
                echo "review block suppressed: head_ref or screen names carry shell metacharacters" >&2
              fi

              if [ -n "${names}" ]; then
                cat <<REVIEW

          #### 手元で見る

          落ちた画面を使い捨ての作業ツリーで開きます。手元の作業ツリーは動かしません。役割の要る画面は開発用 session の面を経由します。

          \`\`\`bash
          make e2e-review BRANCH='${HEAD_REF}' RUN='${RUN_ID}' E2E_ONLY='${names}'
          \`\`\`

          作業ツリーは Ctrl-C では消えません。溜まったら \`make review-clean\` で片付けてください。
          REVIEW
              fi
            fi

            if [ "${undeclared}" = 'false' ] && [ "${journey}" = 'false' ] && [ "${pixels}" = 'false' ]; then
              cat <<'UNKNOWN'

          ### 種別を判定できませんでした

          上のログと artifact を見てください。ここに案内が出ないのは、build か起動の段で落ちているか、判定に使っている目印が変わったときです。
          UNKNOWN
            fi
          } > /tmp/e2e-comment/e2e-notes.md

      # The HTML report and the traces. Without them the only evidence of a failure is
      # the assertion text, which cannot be judged for a visual difference.
      - name: Upload the report and traces
        if: always() && steps.e2e.outputs.status == 'failure'
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: e2e-diff
          path: tmp/e2e
          retention-days: 7
          if-no-files-found: warn

      # Read back by `baseline-retake.yaml` to bound what the label may retake. Kept
      # separate from the diff bundle so the retake path downloads only the report.
      #
      # `warn`, not `error`: this step fires on any failure, and a run that failed while
      # building or booting the app never started Playwright, so there is no report to
      # upload. Failing here would add a red step whose cause is the one already reported,
      # and the retake path already treats a missing report as "no screen was reported".
      - name: Upload the machine-readable report
        if: always() && steps.e2e.outputs.status == 'failure'
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: e2e-report
          path: tmp/e2e/report.json
          retention-days: 7
          if-no-files-found: warn

      # Handed to the commenting job through an artifact rather than a job output,
      # because the body is a file whose size is not bounded by the output limit.
      - name: Hand the comment body to the commenting job
        if: always() && github.event_name == 'pull_request' && steps.e2e.outputs.status != ''
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: e2e-comment
          path: /tmp/e2e-comment/
          retention-days: 1
          if-no-files-found: error

      - name: Fail if a journey or a screen failed
        if: always() && steps.e2e.outputs.status != 'success'
        run: exit 1

  # Holds no secret beyond `GITHUB_TOKEN`, so the body it publishes cannot carry one
  # (ADR 0153: secret masking does not survive a `tee` to a file).
  e2e-comment:
    if: always() && github.event_name == 'pull_request'
    needs: e2e
    runs-on: ubuntu-latest
    permissions:
      contents: read
      pull-requests: write

    steps:
      - name: Harden the runner
        uses: step-security/harden-runner@05e31511f85b41b11d1cf0ef85d0992719546e2c # v2.21.0
        with:
          egress-policy: audit

      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - name: Download the comment body
        id: body
        continue-on-error: true
        uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c # v8.0.1
        with:
          name: e2e-comment
          path: /tmp/e2e-comment

      - name: Comment the E2E result on PR
        if: steps.body.outcome == 'success'
        continue-on-error: true
        uses: ./.github/actions/upsert-pr-comment
        with:
          github-token: ${{ secrets.GITHUB_TOKEN }}
          marker: '<!-- e2e-result -->'
          title: ${{ needs.e2e.outputs.title }}
          body-file: /tmp/e2e-comment/e2e.log
          notes-file: /tmp/e2e-comment/e2e-notes.md
          details-summary: 'E2E の実行ログ'
