name: Strip Verify

# Runs the boilerplate-only strip on a throwaway checkout and proves the repository still
# builds and passes every gate once the prose that only the distributing side can honour
# is gone.
#
# This job exists because the strip is a one-shot tool that deletes itself
# (`scripts/setup/remove-boilerplate-only`). Nothing else would notice if it stopped
# working: a marker whose pair was lost, a stripped section that takes a heading another
# document links to, or a manifest entry gone stale would all stay green until someone
# actually forked and ran it. The unit tests beside the manifest never run the strip, so
# they cannot see the tree it leaves behind.
#
# The checkout is disposable, so the job deliberately deletes tracked files and never
# pushes anything back.
#
# The strip deletes this file too — it is declared in `SELF_DESTRUCT_PATHS`. Do not
# add the guard step `purge-verify.yaml` carries: the strip is mandatory, so every fork
# would fail it on every PR forever.
#
# Deliberately unfiltered by `paths`; the reason every CI Checks workflow runs on
# every PR is in README.md.

on:
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

# Select the CI environment file (env/.env.ci). Without this the loader falls back to
# `local`, which ships a placeholder session secret that the config layer refuses outside
# development — the build then fails on a value that is only meant for a workstation.
env:
  APP_ENV: ci

jobs:
  # The suite against the stripped tree is what this workflow spends its time on —— 386s
  # of a 530s run, measured. `strip-verify-shard` is the fan-out; `strip-verify` collects
  # what came back, exactly as `test.yaml` does for the unstripped tree.
  #
  # **Every machine strips for itself.** The strip is a 1s script over a throwaway
  # checkout, so handing the stripped tree between jobs as an artifact would cost more
  # than redoing it — and the redo keeps each machine's tree provably the one its own
  # strip produced.
  strip-verify-shard:
    runs-on: ubuntu-latest
    permissions:
      contents: read

    strategy:
      # One machine failing says nothing about the others, and the merge has to replay
      # every test that broke. Cancelling the rest would report a subset as the whole.
      fail-fast: false
      matrix:
        # **The only declaration of how many machines the suite is split across.** The
        # denominator is read back from `strategy.job-total`, so there is no second number
        # to keep in step with this one (the reasoning is `test.yaml`'s).
        shard: [1, 2, 3, 4]

    steps:
      - name: Harden the runner
        uses: step-security/harden-runner@bf7454d06d71f1098171f2acdf0cd4708d7b5920 # v2.20.0
        with:
          egress-policy: block
          allowed-endpoints: >
            github.com:443
            api.github.com:443
            codeload.github.com:443
            release-assets.githubusercontent.com:443
            *.actions.githubusercontent.com:443
            *.blob.core.windows.net:443
            *.githubapp.com:443
            prod.app-api.stepsecurity.io:443
            mise-versions.jdx.dev:443
            nodejs.org:443
            registry.npmjs.org:443
            fonts.googleapis.com:443
            fonts.gstatic.com:443

      - name: Checkout
        uses: actions/checkout@9c091bb21b7c1c1d1991bb908d89e4e9dddfe3e0 # v7.0.0
        with:
          persist-credentials: false

      - name: Setup mise and the pinned tools
        uses: ./.github/actions/setup-mise
        with:
          tools: core:node aqua:pnpm/pnpm
          github-token: ${{ secrets.GITHUB_TOKEN }}

      - name: Resolve the pnpm store path
        id: pnpm-store
        shell: bash
        run: |
          # Assigned first so a failure inside the substitution fails the step; an
          # `echo "$(...)"` would report success and hand the cache an empty path.
          path="$(pnpm store path)"
          echo "path=${path}" >> "$GITHUB_OUTPUT"

      - name: Cache the pnpm store
        uses: actions/cache@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
        with:
          path: ${{ steps.pnpm-store.outputs.path }}
          key: ${{ runner.os }}-pnpm-store-${{ hashFiles('pnpm-lock.yaml') }}
          restore-keys: ${{ runner.os }}-pnpm-store-

      - name: Install dependencies
        run: pnpm install --frozen-lockfile --ignore-scripts

      - name: Preview the strip
        run: pnpm exec tsx scripts/setup/remove-boilerplate-only --dry-run

      - name: Strip the boilerplate-only prose
        run: pnpm exec tsx scripts/setup/remove-boilerplate-only

      # Failures are not reported from here. The blob carries them, and the merge replays
      # them in the collecting job, so the log a reader opens is one log and not four.
      - name: Run this machine's share of the stripped suite
        env:
          SHARD_INDEX: ${{ matrix.shard }}
          SHARD_TOTAL: ${{ strategy.job-total }}
        run: make test-shard SHARD="${SHARD_INDEX}/${SHARD_TOTAL}"

      # `if: always()` so a shard that failed still hands over what it recorded. Without it
      # a single failure would leave the merge with a hole, and the hole would surface as a
      # coverage shortfall rather than as the test that actually broke.
      - name: Hand the recorded run to the collecting job
        if: always()
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4.6.2
        with:
          name: strip-test-blob-${{ matrix.shard }}
          path: tmp/test-blob/
          retention-days: 1
          if-no-files-found: error

  strip-verify:
    needs: strip-verify-shard
    runs-on: ubuntu-latest
    permissions:
      contents: read

    steps:
      - name: Harden the runner
        uses: step-security/harden-runner@bf7454d06d71f1098171f2acdf0cd4708d7b5920 # v2.20.0
        with:
          egress-policy: block
          allowed-endpoints: >
            github.com:443
            api.github.com:443
            codeload.github.com:443
            release-assets.githubusercontent.com:443
            *.actions.githubusercontent.com:443
            *.blob.core.windows.net:443
            *.githubapp.com:443
            prod.app-api.stepsecurity.io:443
            mise-versions.jdx.dev:443
            nodejs.org:443
            registry.npmjs.org:443
            fonts.googleapis.com:443
            fonts.gstatic.com:443

      - name: Checkout
        uses: actions/checkout@9c091bb21b7c1c1d1991bb908d89e4e9dddfe3e0 # v7.0.0
        with:
          persist-credentials: false

      - name: Setup mise and the pinned tools
        uses: ./.github/actions/setup-mise
        with:
          tools: core:node aqua:pnpm/pnpm
          github-token: ${{ secrets.GITHUB_TOKEN }}

      - name: Resolve the pnpm store path
        id: pnpm-store
        shell: bash
        run: |
          # Assigned first so a failure inside the substitution fails the step; an
          # `echo "$(...)"` would report success and hand the cache an empty path.
          path="$(pnpm store path)"
          echo "path=${path}" >> "$GITHUB_OUTPUT"

      - name: Cache the pnpm store
        uses: actions/cache@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
        with:
          path: ${{ steps.pnpm-store.outputs.path }}
          key: ${{ runner.os }}-pnpm-store-${{ hashFiles('pnpm-lock.yaml') }}
          restore-keys: ${{ runner.os }}-pnpm-store-

      - name: Install dependencies
        run: pnpm install --frozen-lockfile --ignore-scripts

      # Preview first. An unclosed marker block, or a replacement region holding anything
      # but commented-out lines, fails here before anything is rewritten.
      - name: Preview the strip
        run: pnpm exec tsx scripts/setup/remove-boilerplate-only --dry-run

      - name: Strip the boilerplate-only prose
        run: pnpm exec tsx scripts/setup/remove-boilerplate-only

      # Runs before the gates: a survivor is cheaper to read here than as a lint failure
      # ten minutes later. Every occurrence of the marker token in this repository sits
      # either inside a stripped region or inside a self-destructing path, so one survivor
      # means the strip missed something.
      - name: Verify the strip left nothing behind
        shell: bash
        run: |
          for target in scripts/setup/remove-boilerplate-only .github/workflows/strip-verify.yaml; do
            if [ -e "${target}" ]; then
              echo "::error::${target} outlived the strip, but it is declared in SELF_DESTRUCT_PATHS."
              exit 1
            fi
          done

          # Mirrors the strip's own scan exclusions (`EXCLUDED_DIRECTORIES` in the manifest).
          survivors="$(grep -rIl 'boilerplate-only' . \
            --exclude-dir=.git \
            --exclude-dir=node_modules \
            --exclude-dir=.next \
            --exclude-dir=coverage \
            --exclude-dir=dist \
            --exclude-dir=storybook-static \
            --exclude-dir=tmp || true)"

          if [ -n "${survivors}" ]; then
            echo "::error::The marker token survived the strip in the files below."
            echo "${survivors}"
            exit 1
          fi

      # The gates run against the stripped tree. A heading the strip took away, or a link
      # that pointed into it, surfaces here and nowhere earlier.
      - name: Format the stripped tree
        run: pnpm fix

      - name: Lint the stripped tree
        run: pnpm lint:ci

      - name: Typecheck the stripped tree
        run: pnpm typecheck

      - name: Lint markdown of the stripped tree
        run: pnpm md-lint

      # The one class of breakage the language checks above cannot see: an entry that
      # no workflow references any more. A workflow the strip deletes takes its pins
      # with it, and `check` is fail-closed on an unreferenced entry — so a missed
      # prune first turns red in the stripped repository, not here. This is where it
      # should turn red instead.
      - name: Verify the action pins of the stripped tree
        run: make actions-pin-check

      # Same shape, one level out: a workflow the strip deletes takes its allowed
      # endpoints with it, and `check` is fail-closed on a declaration nothing references.
      - name: Verify the egress allowlist of the stripped tree
        run: make egress-check

      - name: Build the stripped tree
        run: pnpm build

      - name: Collect what every machine recorded
        uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c # v8.0.1
        with:
          path: tmp/test-blob/
          pattern: strip-test-blob-*
          merge-multiple: true

      # **A missing blob is not a coverage shortfall.** A shard that died before writing
      # one leaves the merge measuring less than the whole suite, and the threshold would
      # then report unreached lines for code whose tests never ran. The expected count is
      # read out of the file names, so the denominator is the one the shards actually ran
      # with rather than a second number written here (the reasoning is `test.yaml`'s).
      - name: Fail if a machine did not report
        shell: bash
        run: |
          set -euo pipefail

          mapfile -t blobs < <(find tmp/test-blob -name 'blob-*-*.json' -printf '%f\n' | sort)

          if [ "${#blobs[@]}" -eq 0 ]; then
            echo "❌ 分割の結果が 1 台ぶんも届いていません。" >&2
            exit 1
          fi

          totals="$(printf '%s\n' "${blobs[@]}" | sed -E 's/^blob-[0-9]+-([0-9]+)\.json$/\1/' | sort -u)"

          if [ "$(printf '%s\n' "${totals}" | wc -l | tr -d ' ')" -ne 1 ]; then
            echo "❌ 届いた結果が別々の台数で割られています: ${totals}" >&2
            exit 1
          fi

          if [ "${#blobs[@]}" -ne "${totals}" ]; then
            echo "❌ 分割 ${totals} 台のうち ${#blobs[@]} 台ぶんしか結果が届いていません。" >&2
            echo "   このまま合流させると、走らなかったテストがカバレッジの不足として現れます。" >&2
            exit 1
          fi

      # The threshold is this job's, not each machine's: a shard reaches only its own share
      # of the code, so 100% cannot hold per machine. The merge recomputes coverage over the
      # whole population before judging it.
      - name: Merge the runs and check coverage of the stripped tree
        run: make test-merge

      - name: Test the scripts of the stripped tree
        run: pnpm test:scripts
