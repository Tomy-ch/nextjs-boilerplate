name: Deploy Docs

# Publishes the generated-HTML documentation site to GitHub Pages (ADR 0141).
#
# Storybook is the site's first tenant, not the site itself. The docs portal and
# any further generated HTML (coverage, OpenAPI) join it under sibling paths
# later, so the site root is a redirect (`docs/index.html`) rather than Storybook
# mounted at `/`. Retargeting that redirect is the only change the portal needs
# here; no tenant URL moves.
#
# The release trigger carries no `paths:`. A push to `production` is a release, and
# a release can change the rendered site through an indirect path — a token, a
# dependency bump, a config file — that a path list would have to predict.
# Releases are rare enough that rebuilding unconditionally is cheaper than
# maintaining that prediction.
#
# A pull request that edits this file runs the build as a self-test, because a
# broken deploy job is otherwise only discovered on the release that needs it. That
# run is filtered to this file and MUST NOT be a required status check — a PR that
# does not touch it reports no context at all (see README.md). It also never
# deploys: the deploy job is gated on the event below, so no pull request can
# publish from its branch.

on:
  push:
    branches:
      - production
  pull_request:
    paths:
      - .github/workflows/deploy-docs.yaml
  workflow_dispatch:

permissions:
  contents: read

# Deliberately deviates from the repo-wide skeleton of
# `${{ github.workflow }}-${{ github.ref }}` / `cancel-in-progress: true`
# (ADR 0153 §3). A Pages deployment is one shared resource rather than a per-ref
# one, so the group names the resource; and a running deploy is never cancelled,
# because interrupting one leaves the live site serving a half-uploaded artifact.
concurrency:
  group: pages
  cancel-in-progress: false

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
      - name: Harden the runner
        uses: step-security/harden-runner@bf7454d06d71f1098171f2acdf0cd4708d7b5920 # v2.20.0
        with:
          egress-policy: audit

      - name: Checkout
        uses: actions/checkout@9c091bb21b7c1c1d1991bb908d89e4e9dddfe3e0 # v7.0.0
        with:
          persist-credentials: false

      # mise.toml is the single source of truth for the tool versions (ADR
      # 0003), so only the names appear here. They carry their backend prefix
      # because every mise.toml entry is backend-qualified — a bare `node` would
      # not match the `core:node` key.
      - name: Setup mise and the pinned tools
        uses: ./.github/actions/setup-mise
        with:
          tools: core:node aqua:pnpm/pnpm
          github-token: ${{ secrets.GITHUB_TOKEN }}

      - name: Resolve the pnpm store path
        id: pnpm-store
        shell: bash
        run: |
          # Assigned first so a failure inside the substitution fails the step; an
          # `echo "$(...)"` would report success and hand the cache an empty path.
          path="$(pnpm store path)"
          echo "path=${path}" >> "$GITHUB_OUTPUT"

      - name: Cache the pnpm store
        uses: actions/cache@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
        with:
          path: ${{ steps.pnpm-store.outputs.path }}
          key: ${{ runner.os }}-pnpm-store-${{ hashFiles('pnpm-lock.yaml') }}
          restore-keys: ${{ runner.os }}-pnpm-store-

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      - name: Build Storybook
        run: pnpm build-storybook

      - name: Build the documentation portal and assemble the site tree
        # Generates the portal artifacts, bundles the viewer, and lays out dist/.
        # The layout lives in scripts/portal/site-tree.ts rather than inline here so
        # that `pnpm portal:preview` serves byte-for-byte what this job publishes —
        # duplicating it in shell means only one of the two ever gets fixed.
        run: pnpm portal:site

      - name: Upload Pages artifact
        uses: actions/upload-pages-artifact@fc324d3547104276b827a68afc52ff2a11cc49c9 # v5
        with:
          path: dist

  deploy:
    needs: build
    # Pull requests build but never publish. Deploying from a PR branch would put
    # unreviewed content on the live site.
    if: github.event_name != 'pull_request'
    runs-on: ubuntu-latest
    # Only this job talks to the Pages deployment API: `pages: write` creates the
    # deployment and `id-token: write` mints the OIDC token actions/deploy-pages
    # uses to prove its origin. The build job needs neither.
    permissions:
      contents: read
      pages: write
      id-token: write
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}

    steps:
      - name: Harden the runner
        uses: step-security/harden-runner@bf7454d06d71f1098171f2acdf0cd4708d7b5920 # v2.20.0
        with:
          egress-policy: audit

      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@cd2ce8fcbc39b97be8ca5fce6e763baed58fa128 # v5
