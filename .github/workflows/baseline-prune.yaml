name: Baseline Prune

# Reports when the baseline store has accumulated enough discardable baseline sets to
# be worth cleaning, and stays silent otherwise. A report that arrives every month is
# not read, and a report that is not read is the same as no report.
#
# It never prunes. Deleting refs cannot be undone, and a mistake in the retention
# calculation kills the pointer a live branch depends on. The person who read the
# report runs `make baseline-prune`.
#
# The store holds no workflow of its own — everything that touches it is driven from
# here, so there is one place to look for what may write to it.

on:
  schedule:
    # 04:00 UTC on the first of the month.
    - cron: '0 4 1 * *'
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: ${{ github.workflow }}
  cancel-in-progress: false

jobs:
  report:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    permissions:
      contents: read
      issues: write
      pull-requests: read

    steps:
      - name: Harden the runner
        uses: step-security/harden-runner@05e31511f85b41b11d1cf0ef85d0992719546e2c # v2.21.0
        with:
          egress-policy: audit

      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - name: Setup mise and the pinned tools
        uses: ./.github/actions/setup-mise
        with:
          tools: core:node aqua:pnpm/pnpm
          github-token: ${{ secrets.GITHUB_TOKEN }}

      - name: Install dependencies
        run: pnpm install --frozen-lockfile --ignore-scripts

      # Exit code 10 means "worth cleaning"; 0 means "nothing to say". Anything else
      # is the query itself failing, which must not be reported as a clean store.
      - name: Measure the store
        id: measure
        run: |
          set +e
          pnpm exec tsx scripts/baseline-store report > /tmp/baseline-store.md 2>&1
          code=$?
          cat /tmp/baseline-store.md

          case "$code" in
            0) echo 'needed=false' >> "$GITHUB_OUTPUT" ;;
            10) echo 'needed=true' >> "$GITHUB_OUTPUT" ;;
            *) exit "$code" ;;
          esac

      # One issue, reopened rather than duplicated. A second month over the threshold
      # is the same unresolved fact, not a new one.
      - name: Compose what the issue says
        if: steps.measure.outputs.needed == 'true'
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          # The evidence is `scripts/baseline-store report`'s own markdown, so it renders.
          cat <<'NOTE' > /tmp/baseline-store-note.md
          手元で `make baseline-prune` を実行してください（`DRY_RUN=1` を付けると消さずに一覧だけ出ます）。

          消えるのは、主リポジトリの生きた ref のどれからも指されていない基準画像の一式です。
          過去のコミットへ遡ったときに基準画像が揃わなくなりますが、それは設計上の前提です。
          NOTE

          pnpm exec tsx scripts/ci-report issue-body \
            --kind authored \
            --evidence /tmp/baseline-store.md \
            --note /tmp/baseline-store-note.md > /tmp/baseline-store-issue.md

      - name: Raise it where it has an owner
        if: steps.measure.outputs.needed == 'true'
        uses: ./.github/actions/upsert-issue
        with:
          github-token: ${{ secrets.GITHUB_TOKEN }}
          title: '[VRT] 基準画像の置き場を掃除する'
          body-file: /tmp/baseline-store-issue.md
          label: test
