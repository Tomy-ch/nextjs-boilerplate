name: Smoke

# Boot check: build, start the production server, and require it to answer a real
# request. A green `next build` only proves the bundle compiled — a provider that
# throws on mount, a missing runtime env value, or a server component that fails to
# render all surface at boot, not at build.
#
# It builds for itself rather than taking an artifact from the Build workflow: one
# concern per workflow means neither job may sit behind the other's runner. Both
# read the same actions/cache generation, so this build starts from the previous
# run's Next.js cache rather than cold — the two run concurrently, so it is not this
# PR's Build job it inherits from.
#
# The job always starts and then asks `diff-scope` whether the diff can reach the server, so the
# required context is reported even when the expensive steps stand down. No `paths:` filter,
# deliberately — README.md says why.

on:
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

# Select the CI environment file (env/.env.ci).
env:
  APP_ENV: ci

jobs:
  smoke:
    runs-on: ubuntu-latest
    permissions:
      contents: read
      pull-requests: write

    steps:
      - name: Harden the runner
        uses: bullfrogsec/bullfrog@7dee337d4575320b6d8cbe9a56d48d2fb765963a # v0.11.1
        with:
          egress-policy: block
          dns-policy: allowed-domains-only
          enable-sudo: false
          allowed-ips: |
            127.0.0.100
            172.17.0.1
          allowed-domains: |
            github.com
            api.github.com
            codeload.github.com
            release-assets.githubusercontent.com
            *.actions.githubusercontent.com
            *.blob.core.windows.net
            *.githubapp.com
            mise-versions.jdx.dev
            nodejs.org
            registry.npmjs.org
            fonts.googleapis.com
            fonts.gstatic.com

      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      # What the server boots from is what `next build` emits, and the build reads neither the
      # documentation nor the agent configuration. Sources the build compiles stay listed out:
      # `next build` type-checks every file `tsconfig.json` reaches, tests and stories included.
      - name: Decide whether the diff can reach the server
        id: scope
        uses: ./.github/actions/diff-scope
        with:
          base-ref: ${{ github.base_ref }}
          ignore: |
            docs/*
            *.md
            .claude/*
            .agents/*
            .cursor/*
            .gemini/*

      - name: Setup mise and the pinned tools
        if: steps.scope.outputs.relevant == 'true'
        uses: ./.github/actions/setup-mise
        with:
          tools: core:node aqua:pnpm/pnpm
          github-token: ${{ secrets.GITHUB_TOKEN }}

      - name: Cache the Next.js build cache
        if: steps.scope.outputs.relevant == 'true'
        uses: actions/cache@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
        with:
          path: ${{ github.workspace }}/.next/cache
          key: ${{ runner.os }}-nextjs-${{ hashFiles('pnpm-lock.yaml') }}-${{ hashFiles('**.[jt]s', '**.[jt]sx') }}
          restore-keys: ${{ runner.os }}-nextjs-${{ hashFiles('pnpm-lock.yaml') }}-

      - name: Install dependencies
        if: steps.scope.outputs.relevant == 'true'
        uses: ./.github/actions/setup-deps

      - name: Build
        if: steps.scope.outputs.relevant == 'true'
        run: pnpm build

      # The server is polled rather than slept at, so a fast boot does not pay for
      # the worst case and a hung boot still ends. The liveness check on the process
      # exists because a server that dies on startup would otherwise be
      # indistinguishable from one that is still booting, and would burn the whole
      # timeout before reporting.
      #
      # curl follows redirects: without --location a 3xx counts as an answer, so a
      # route that redirects to a page that itself fails to render would pass.
      - name: Start the server and request the root route
        id: smoke
        if: steps.scope.outputs.relevant == 'true'
        shell: bash
        run: |
          set +e

          pnpm start > /tmp/smoke.log 2>&1 &
          server_pid=$!

          status=failure
          for _ in {1..60}; do
            if ! kill -0 "${server_pid}" 2>/dev/null; then
              echo "--- the server process exited before it answered a request ---" >> /tmp/smoke.log
              break
            fi
            if curl --fail --location --silent --show-error --max-time 5 http://127.0.0.1:3000/ > /dev/null; then
              status=success
              break
            fi
            sleep 1
          done

          kill "${server_pid}" 2>/dev/null
          wait "${server_pid}" 2>/dev/null

          cat /tmp/smoke.log

          echo "status=${status}" >> "$GITHUB_OUTPUT"
          if [ "${status}" = "success" ]; then
            echo "title=## ✅ Smoke: PASS (next start answered /)" >> "$GITHUB_OUTPUT"
          else
            echo "title=## ❌ Smoke: FAIL (next start never answered /)" >> "$GITHUB_OUTPUT"
          fi

          exit 0

      # A job that stood down still owes the pull request a verdict (README § PR Comments, the
      # `diff-scope` bullet). The body file is the one the comment step reads.
      - name: Note that the diff cannot reach the server
        id: standdown
        if: steps.scope.outputs.relevant != 'true'
        shell: bash
        run: |
          echo 'title=## ⏭️ Smoke: SKIP (diff cannot reach the server)' >> "$GITHUB_OUTPUT"
          echo 'この PR の差分は起動するサーバに届かないため、next start を実行していません。' > /tmp/smoke.log

      - name: Comment smoke result on PR
        if: github.event_name == 'pull_request' && (steps.smoke.outputs.status != '' || steps.standdown.outcome == 'success')
        continue-on-error: true
        uses: ./.github/actions/upsert-pr-comment
        with:
          github-token: ${{ secrets.GITHUB_TOKEN }}
          marker: '<!-- smoke-result -->'
          status: ${{ steps.smoke.outputs.status || 'success' }}
          title: ${{ steps.smoke.outputs.title || steps.standdown.outputs.title }}
          body-file: /tmp/smoke.log
          details-summary: 'next start log'

      - name: Fail if the server never answered
        if: always() && steps.scope.outputs.relevant == 'true' && steps.smoke.outputs.status != 'success'
        run: exit 1
