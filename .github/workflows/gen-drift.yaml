name: Gen Drift

# The generated API surface (wire types / zod schemas / MSW handlers) is committed so a contract
# change is visible in review. This job refuses a PR on two distinct failures:
#
#   1. the committed artifacts were hand-edited, were generated from something other than the
#      committed contract, or outlived the schema they came from — caught by regenerating and
#      diffing. `make api-gen` empties the output directories first, so a file the contract no
#      longer produces shows up as a deletion instead of sitting there unchanged;
#   2. a contract was fetched but never regenerated from — caught by comparing the blob SHA in
#      openapi/sources.yaml against the version stamp the generator copies into its output.
#
# The second check is cheap and names the failure precisely, so it runs first. Neither step reaches
# the network: the contract itself is committed, and fetching it is a deliberate act (make api-fetch).
#
# The job always starts and then asks `diff-scope` whether the diff can reach the generated
# artifacts, so the required context is reported even when the expensive steps stand down. No
# `paths:` filter, deliberately — README.md says why.

on:
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  gen-drift:
    runs-on: ubuntu-latest

    steps:
      - name: Harden the runner
        uses: bullfrogsec/bullfrog@7dee337d4575320b6d8cbe9a56d48d2fb765963a # v0.11.1
        with:
          egress-policy: block
          dns-policy: allowed-domains-only
          enable-sudo: false
          allowed-ips: |
            127.0.0.100
            172.17.0.1
          allowed-domains: |
            github.com
            api.github.com
            codeload.github.com
            release-assets.githubusercontent.com
            *.actions.githubusercontent.com
            *.blob.core.windows.net
            *.githubapp.com
            mise-versions.jdx.dev
            nodejs.org
            registry.npmjs.org

      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      # What neither the generator nor the `pnpm fix` after it can turn into a change under
      # `src/adapters/gen` or `mocks`. Tests are not listed: `mocks/` holds hand-written ones,
      # and the formatting pass rewrites them inside the directory this job inspects.
      - name: Decide whether the diff can reach the generated artifacts
        id: scope
        uses: ./.github/actions/diff-scope
        with:
          base-ref: ${{ github.base_ref }}
          ignore: |
            docs/*
            *.md
            .claude/*
            .agents/*
            .cursor/*
            .gemini/*
            vrt/*
            e2e/*
            .storybook/*
            *.stories.tsx
            public/*
            tokens/*
            *.css

      - name: Setup mise and the pinned tools
        if: steps.scope.outputs.relevant == 'true'
        uses: ./.github/actions/setup-mise
        with:
          tools: core:node aqua:pnpm/pnpm
          github-token: ${{ secrets.GITHUB_TOKEN }}

      - name: Install dependencies
        if: steps.scope.outputs.relevant == 'true'
        uses: ./.github/actions/setup-deps

      - name: Verify the contract and the generated artifacts carry the same version
        if: steps.scope.outputs.relevant == 'true'
        run: make api-gen-check

      - name: Regenerate from the committed contract
        if: steps.scope.outputs.relevant == 'true'
        run: make api-gen

      - name: Verify the regenerated artifacts match what is committed
        if: steps.scope.outputs.relevant == 'true'
        shell: bash
        # `git status --porcelain`, not `git diff`: a contract that adds a schema makes orval write a
        # NEW file, and an untracked file is invisible to `git diff`. The gate would pass on exactly
        # the change it exists to catch. The same listing reports the deletions the empty-first
        # regeneration exposes, so added / changed / removed are all one check.
        run: |
          drift="$(git status --porcelain -- src/adapters/gen mocks)"
          if [[ -n "${drift}" ]]; then
            echo "${drift}"
            echo "::error::生成物が契約と一致しません。make api-gen を実行して結果を commit してください。"
            exit 1
          fi
