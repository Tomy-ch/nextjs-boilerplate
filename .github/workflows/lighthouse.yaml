name: Lighthouse

# Measures the Core Web Vitals of every screen and holds them against
# `performance-budget.yaml` (ADR 0101).
#
# The screens come from `e2e/lib/screens.ts` — the same declaration the E2E job walks. The
# list is deliberately not restated here: a second list would let a screen be added to one
# and not the other, and the half that never learned about it would stay green.
#
# Only three metrics are judged, not the performance score. The score is a weighted mean of
# five metrics, so a drop in it cannot say WHICH metric dropped. INP needs a real user
# interaction and cannot be measured in a lab, so TBT stands in for it (ADR 0082 owns the
# field side).
#
# The browsers here are NOT the digest-pinned Playwright container the VRT and E2E jobs use.
# That image exists to fix fonts and rasterization, which a pixel comparison depends on and
# a number does not; what has to be fixed for a number is the browser version, and the
# `@playwright/test` entry in `pnpm-lock.yaml` fixes that on every machine.
#
# ## Why this does not run on pull requests
#
# The measurement is serial by necessity — running several screens at once has them compete
# for the same CPU, and Lighthouse's simulated throttling scales with the CPU time it
# observes, so the parallelism would land in the numbers the budget then judges. Measured on
# this repository's own sample: 23 screens x 3 runs x ~14 s = ~16 minutes, against ~1 minute
# of build. The cost is therefore `screens x runs`, and neither factor can be cut without
# giving something up: fewer runs loses the median that absorbs runner variance, and fewer
# screens gives up the reason the list is read from the declaration in the first place.
#
# So the cadence moves instead of the coverage. A merge is judged after it lands rather than
# before, which delays detection by one merge and costs no pull request any waiting. Every
# screen is still measured, still three times, still against the same budget.
#
# `cancel-in-progress` is on, so a burst of merges leaves only the newest tree measured —
# that is the tree that matters. The nightly run is what guarantees at least one complete
# measurement a day when merges keep superseding each other.
#
# ## What still runs on a pull request
#
# Waiting one merge is the wrong trade for two shapes of change, so the job starts on every
# pull request, decides in about a minute, and measures only when the diff earns it:
#
#   * The screen declaration moved — a screen may have been added that has never been
#     measured at all, so there is no earlier number for the release run to compare against.
#   * A layout moved — every screen renders through it.
#
# Both are structural, which is why neither needs a number to justify it — and structural is
# all this job decides. A diff that is merely large is handled by `deferred-checks.yaml`,
# which counts once for all three deferred checks and leaves one comment. Keeping a second
# line count here would put two unprincipled numbers in the repository and two comments
# saying the same thing on the same pull request.
#
# Those two structural reasons are this job's own, and they sit ALONGSIDE the four events
# `check-trigger` shares with the other deferred checks (promotion, label, manual, and the
# cadence itself). They exist here and not there because they answer a question only this job
# has: a screen added on this branch has no earlier number for the release run to compare
# against, so deferring it defers the comparison too, not just the detection.
#
# The job reports a context on every pull request either way, which is what would let it
# become a required check later; it is deliberately not one today, because the budget is not
# yet reachable on this sample (`docs/adr/0101-performance-budget.md`).

on:
  pull_request:
    # Spelled out because naming `types` replaces the default set rather than adding to it,
    # and `labeled` is what lets `run-lighthouse` start a run on a pull request already open.
    types: [opened, synchronize, reopened, labeled]
  push:
    branches:
      - production
      - staging
      - develop
      - 'release/**'
  schedule:
    # 18:00 UTC daily (03:00 JST).
    - cron: '0 18 * * *'
  workflow_dispatch:

# Select the CI environment file (env/.env.ci), which is the one that puts the API in mock
# mode. Without a mocked API the screens would need a backend, and a slow response over
# there would read as a regression in here.
env:
  APP_ENV: ci

permissions:
  contents: read

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  lighthouse:
    runs-on: ubuntu-latest
    timeout-minutes: 60
    permissions:
      contents: read
      issues: write
      pull-requests: write

    steps:
      - name: Harden the runner
        uses: step-security/harden-runner@bf7454d06d71f1098171f2acdf0cd4708d7b5920 # v2.20.0
        with:
          egress-policy: audit

      - name: Checkout
        uses: actions/checkout@9c091bb21b7c1c1d1991bb908d89e4e9dddfe3e0 # v7.0.0
        with:
          persist-credentials: false
          # The base ref has to be resolvable for the `trigger` diff; the default shallow
          # checkout leaves it a bad object and the decision would silently see no changes.
          #
          # The condition is inverted on purpose. `<cond> && 0 || 1` always yields 1, because
          # GitHub's pseudo-ternary falls through to the `||` side whenever the value before it
          # is falsy — and `0` is. So the branch that has to carry `0` is the one after `||`.
          fetch-depth: ${{ github.event_name != 'pull_request' && 1 || 0 }}

      - name: Setup mise and the pinned tools
        uses: ./.github/actions/setup-mise
        with:
          tools: core:node aqua:pnpm/pnpm
          github-token: ${{ secrets.GITHUB_TOKEN }}

      - name: Resolve the pnpm store path
        id: pnpm-store
        shell: bash
        run: |
          path="$(pnpm store path)"
          echo "path=${path}" >> "$GITHUB_OUTPUT"

      - name: Cache the pnpm store
        uses: actions/cache@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
        with:
          path: ${{ steps.pnpm-store.outputs.path }}
          key: ${{ runner.os }}-pnpm-store-${{ hashFiles('pnpm-lock.yaml') }}
          restore-keys: ${{ runner.os }}-pnpm-store-

      # The browser is downloaded rather than taken from the digest-pinned container the VRT
      # and E2E jobs use, so it has to be cached or every run pays for it again. Keyed by the
      # lockfile because that is what fixes the Playwright version, and therefore the build.
      - name: Cache the Playwright browser
        uses: actions/cache@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
        with:
          path: ~/.cache/ms-playwright
          key: ${{ runner.os }}-playwright-${{ hashFiles('pnpm-lock.yaml') }}

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      # Everything above this point is what the pull-request path pays: about a minute, and
      # only to answer whether the expensive part is warranted.
      - name: Decide whether this event has to be measured now
        id: cadence
        uses: ./.github/actions/check-trigger
        with:
          label: run-lighthouse
          labels: ${{ toJSON(github.event.pull_request.labels.*.name) }}

      # Only asked when the shared four did not already say yes, because its answer can only
      # add reasons to measure, never remove one.
      - name: Decide whether the diff itself earns a measurement
        id: trigger
        if: github.event_name == 'pull_request' && steps.cadence.outputs.run != 'true'
        env:
          BASE_REF: ${{ github.base_ref }}
        run: pnpm exec tsx scripts/lighthouse trigger "origin/${BASE_REF}"

      # The Next.js build cache is deliberately NOT restored here. A restored cache changes
      # how much work the first render does, and the numbers this job produces would then
      # depend on which branch last populated it rather than on this branch's code.
      - name: Build the app, start it and measure every screen
        id: lighthouse
        if: steps.cadence.outputs.run == 'true' || steps.trigger.outputs.kind == 'force'
        continue-on-error: true
        shell: bash
        run: |
          set +e

          # Streamed through `tee` rather than tailed at the end: a run that is cancelled
          # or hits the job timeout never reaches the tail, so the slow case — the one
          # worth diagnosing — would leave no log at all.
          make lighthouse 2>&1 | tee /tmp/lighthouse-full.log
          code=${PIPESTATUS[0]}

          if [ "${code}" -eq 0 ]; then
            echo "status=success" >> "$GITHUB_OUTPUT"
          else
            echo "status=failure" >> "$GITHUB_OUTPUT"
          fi

          exit 0

      # Only the table, and only when there is one. The cells are screen names — which
      # `resolveScreens` has already constrained to a set that cannot make markup — and
      # numbers this job computed, so it renders rather than sitting in a code block. When
      # the measurement died before printing a table there is nothing sanitized to show, so
      # the comment says that instead of pasting raw log into a rendered body.
      - name: Collect the table for the pull request
        id: table
        if: ${{ !cancelled() && github.event_name == 'pull_request' && steps.lighthouse.outputs.status != '' }}
        run: |
          if sed -n '/^| 画面 |/,$p' /tmp/lighthouse-full.log > /tmp/lighthouse-table.md &&
             [ -s /tmp/lighthouse-table.md ]; then
            echo 'has-table=true' >> "$GITHUB_OUTPUT"
          else
            echo '計測が表を出す前に落ちました。ジョブのログを見てください。' > /tmp/lighthouse-table.md
            echo 'has-table=false' >> "$GITHUB_OUTPUT"
          fi

      - name: Comment the measurement on PR
        if: ${{ !cancelled() && steps.table.outcome == 'success' }}
        continue-on-error: true
        uses: ./.github/actions/upsert-pr-comment
        with:
          github-token: ${{ secrets.GITHUB_TOKEN }}
          marker: '<!-- lighthouse-result -->'
          title: >-
            ${{ steps.lighthouse.outputs.status == 'success' && '## ✅ Lighthouse — PASS (Core Web Vitals)'
            || '## ❌ Lighthouse — FAIL (Core Web Vitals)' }}
          body-file: /tmp/lighthouse-table.md
          details-summary: '画面ごとの Core Web Vitals'
          body-sanitized: ${{ steps.table.outputs.has-table }}

      # The per-run results, so whoever picks up the issue can open the screen that moved
      # instead of re-measuring to find out which one it was.
      - name: Upload the measurements
        if: ${{ !cancelled() && steps.lighthouse.outputs.status == 'failure' }}
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4.6.2
        with:
          name: lighthouse-lhr
          path: tmp/lighthouse
          retention-days: 30
          if-no-files-found: warn

      # One issue per branch, reopened rather than duplicated. A second failure on a branch
      # that is already flagged is the same unresolved fact, not a new one.
      #
      # `!= 'success'`, not `== 'failure'`: the measurement can fail to start at all — the
      # browser may not install — and that has to raise too. `!cancelled()` is what keeps a
      # run superseded by the next merge out of that same net.
      # Only off a pull request. There the failure is already visible on the pull request
      # itself, and an issue per branch would outlive the branch.
      - name: Raise the failure for a human
        if: ${{ !cancelled() && github.event_name != 'pull_request' && steps.lighthouse.outputs.status != 'success' }}
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          BRANCH: ${{ github.ref_name }}
          RUN_URL: ${{ github.server_url }}/${{ github.repository }}/actions/runs/${{ github.run_id }}
        run: |
          title="[Lighthouse] ${BRANCH} で Core Web Vitals が予算を超えている"
          existing="$(gh issue list --repo "$GITHUB_REPOSITORY" --state open --search "$title in:title" \
            --json number --jq '.[0].number')"

          # The table is what says which screen moved, and it is left to render as markdown:
          # its cells are screen names the declaration fixes and numbers this job computed
          # (ADR 0153 §5 — the accepted character set cannot make markup). The measurement
          # may never have produced a table at all — the browser can fail to install — so
          # every fallback ends in something printable.
          body="$(sed -n '/^| 画面 |/,$p' /tmp/lighthouse-full.log 2>/dev/null)"

          if [ -z "${body}" ]; then
            body="$(tail -n 60 /tmp/lighthouse-full.log 2>/dev/null)"
          fi

          if [ -z "${body}" ]; then
            body='(計測そのものが実行できませんでした。実行ログを確認してください。)'
          fi

          {
            echo "${body}"
            echo
            echo "実行: ${RUN_URL}"
            echo
            cat <<'NOTE'
          `lighthouse-lhr` artifact に、画面ごと・試行ごとの結果 (LHR) が入っています。
          <https://googlechrome.github.io/lighthouse/viewer/> へ落とすと読めます。

          手元で測り直すなら `make lighthouse` です。

          **ぶれを理由に閾値を緩めないでください。** 緩めるのは、その画面が重いことを設計として
          引き受けたときだけで、そのときは `performance-budget.yaml` の `lighthouse.screens` へ
          根拠付きで宣言します (ADR 0101)。
          NOTE
          } > /tmp/lighthouse-guard.md

          if [ -n "$existing" ]; then
            gh issue comment "$existing" --repo "$GITHUB_REPOSITORY" --body-file /tmp/lighthouse-guard.md
          else
            gh issue create --repo "$GITHUB_REPOSITORY" --title "$title" --label chore \
              --body-file /tmp/lighthouse-guard.md
          fi

      - name: Fail if a screen is over its budget
        if: ${{ !cancelled() && steps.lighthouse.outputs.status != '' && steps.lighthouse.outputs.status != 'success' }}
        run: exit 1
