name: Bundle Budget

# Measures the client JavaScript each route makes the browser download first, and holds it
# against `performance-budget.yaml` (ADR 0101).
#
# Next 16 prints no size column, so the numbers come from the build output itself: the
# route's own client chunks (`__RSC_MANIFEST`) unioned with the shared runtime and polyfill
# chunks (the route's `build-manifest.json`). For a static route that union equals the
# scripts its emitted HTML loads, which is what makes the number checkable.
#
# The base branch is built too. A ceiling alone lets a change spend the headroom a few KB at
# a time until some later pull request crosses the line — the red then lands on whoever went
# last rather than on whoever added the weight. Comparing against base also covers the routes
# that carry no ceiling, which is every route the bundled sample owns (their names cannot be
# written into the budget: the sample is deleted on purge and the names would dangle).
#
# A base build that fails is not this workflow's business. It degrades to ceilings only
# rather than reporting a failure that belongs to the base branch.
#
# Deliberately unfiltered by `paths`; the reason every CI Checks workflow runs on every PR
# is in README.md.

on:
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  bundle-budget:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    permissions:
      contents: read
      pull-requests: write

    steps:
      - name: Harden the runner
        uses: step-security/harden-runner@bf7454d06d71f1098171f2acdf0cd4708d7b5920 # v2.20.0
        with:
          egress-policy: audit

      - name: Checkout
        uses: actions/checkout@9c091bb21b7c1c1d1991bb908d89e4e9dddfe3e0 # v7.0.0
        with:
          persist-credentials: false

      - name: Checkout the base branch
        if: github.event_name == 'pull_request'
        uses: actions/checkout@9c091bb21b7c1c1d1991bb908d89e4e9dddfe3e0 # v7.0.0
        with:
          ref: ${{ github.base_ref }}
          path: base
          persist-credentials: false

      - name: Setup mise and the pinned tools
        uses: ./.github/actions/setup-mise
        with:
          tools: core:node aqua:pnpm/pnpm
          github-token: ${{ secrets.GITHUB_TOKEN }}

      - name: Resolve the pnpm store path
        id: pnpm-store
        shell: bash
        run: |
          path="$(pnpm store path)"
          echo "path=${path}" >> "$GITHUB_OUTPUT"

      - name: Cache the pnpm store
        uses: actions/cache@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
        with:
          path: ${{ steps.pnpm-store.outputs.path }}
          key: ${{ runner.os }}-pnpm-store-${{ hashFiles('pnpm-lock.yaml') }}
          restore-keys: ${{ runner.os }}-pnpm-store-

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      - name: Build
        run: pnpm build

      # Its failure is the base branch's problem, not this pull request's. Losing the
      # comparison is reported in the table as a missing delta rather than as a red mark.
      - name: Build the base branch
        id: base
        if: github.event_name == 'pull_request'
        continue-on-error: true
        working-directory: base
        run: |
          pnpm install --frozen-lockfile
          pnpm build

      - name: Measure and hold against the budget
        id: budget
        continue-on-error: true
        shell: bash
        run: |
          set +e

          if [ "${{ steps.base.outcome }}" = "success" ]; then
            pnpm bundle-budget .next base/.next 2>&1 | tee /tmp/bundle-budget.log
          else
            pnpm bundle-budget .next 2>&1 | tee /tmp/bundle-budget.log
          fi
          code=${PIPESTATUS[0]}

          if [ "${code}" -eq 0 ]; then
            echo "status=success" >> "$GITHUB_OUTPUT"
            echo "title=## ✅ Bundle budget: PASS (client JS)" >> "$GITHUB_OUTPUT"
          else
            echo "status=failure" >> "$GITHUB_OUTPUT"
            echo "title=## ❌ Bundle budget: FAIL (client JS)" >> "$GITHUB_OUTPUT"
          fi

          exit 0

      - name: Comment the measurement on PR
        if: github.event_name == 'pull_request'
        continue-on-error: true
        uses: ./.github/actions/upsert-pr-comment
        with:
          github-token: ${{ secrets.GITHUB_TOKEN }}
          marker: '<!-- bundle-budget-result -->'
          title: ${{ steps.budget.outputs.title }}
          body-file: /tmp/bundle-budget.log
          details-summary: 'route ごとの client JS'

      - name: Fail if a route is over its budget
        if: always() && steps.budget.outputs.status != 'success'
        run: exit 1
