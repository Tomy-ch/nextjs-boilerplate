name: Component Classes

# Tailwind emits nothing for a class it does not recognise, and nothing fails: the element simply
# renders without that declaration. A surface turns transparent, a focus ring disappears, a
# selected state stops being visible — silently, and only in the browser. Copy-in from the
# shadcn/ui registry is the usual way these classes arrive, because the upstream theme defines
# tokens this repository does not.
#
# The check compiles the real entry stylesheet and looks for every class written under
# src/components in the output. It is hermetic and caused by the change under review, so it gates
# pull requests.
#
# Deliberately unfiltered by `paths`; the reason every CI Checks workflow runs on every PR is in
# README.md. A filtered workflow reports no context on the pull requests it skips, and a required
# context that is never reported blocks the merge forever.

on:
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  component-classes:
    runs-on: ubuntu-latest

    steps:
      - name: Harden the runner
        uses: step-security/harden-runner@05e31511f85b41b11d1cf0ef85d0992719546e2c # v2.21.0
        with:
          egress-policy: audit

      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - name: Setup mise and the pinned tools
        uses: ./.github/actions/setup-mise
        with:
          tools: core:node aqua:pnpm/pnpm
          github-token: ${{ secrets.GITHUB_TOKEN }}

      - name: Resolve the pnpm store path
        id: pnpm-store
        shell: bash
        run: |
          path="$(pnpm store path)"
          echo "path=${path}" >> "$GITHUB_OUTPUT"

      - name: Cache the pnpm store
        uses: actions/cache@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
        with:
          path: ${{ steps.pnpm-store.outputs.path }}
          key: ${{ runner.os }}-pnpm-store-${{ hashFiles('pnpm-lock.yaml') }}
          restore-keys: ${{ runner.os }}-pnpm-store-

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      - name: Verify that every class written in a component produces CSS
        run: pnpm check:classes
