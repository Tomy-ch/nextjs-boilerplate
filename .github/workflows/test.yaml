name: Test

# Vitest with coverage — the same full, cache-free command the pre-push hook
# runs. The hook catches failures before push; CI is the authoritative gate.
#
# ## Why the run is split across machines
#
# The cost is linear in the number of test files and one runner saturates well before
# the suite ends, so the only way to shorten the wall clock is to add machines.
# `test-shard` is that fan-out; `test` collects what came back. This workflow only ever
# starts on a pull request, which is the one path where a person is waiting.
#
# **The required status check is `test`, and it must stay that way.** A matrix job reports
# one context per entry (`test-shard (1)` …), which no required check can name — so the
# collecting job carries the name, and what it guarantees is stated on the job itself.
#
# **The coverage threshold is the collecting job's, not each machine's.** A shard reaches
# only the files it was given; everything covered by its siblings reads as unreached. The
# shards therefore write blob reports with the threshold switched off (`VITEST_SHARDED`),
# and the merge recomputes coverage over the whole population before judging it. Merging
# is what makes the 100% gate mean the same thing it meant on one machine — measured on
# the full suite, the merged totals equal the single-machine totals exactly.
#
# No `paths:` filter, deliberately — README.md says why every workflow runs on every PR.
# `test-scope` always starts and asks `diff-scope` whether the diff can reach a test, so `test`
# is reported even when no machine starts.

on:
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  # Asked once, for every job below — the reason is `vrt.yaml`'s `vrt-scope`.
  test-scope:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    permissions:
      contents: read

    outputs:
      relevant: ${{ steps.scope.outputs.relevant }}

    steps:
      - name: Harden the runner
        uses: bullfrogsec/bullfrog@7dee337d4575320b6d8cbe9a56d48d2fb765963a # v0.11.1
        with:
          egress-policy: block
          dns-policy: allowed-domains-only
          enable-sudo: false
          allowed-ips: |
            127.0.0.100
            172.17.0.1
          allowed-domains: |
            github.com
            api.github.com
            codeload.github.com
            release-assets.githubusercontent.com
            *.actions.githubusercontent.com
            *.blob.core.windows.net
            *.githubapp.com
            mise-versions.jdx.dev
            nodejs.org
            registry.npmjs.org

      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      # What no test reads. `scripts/**` is not listed: `vitest.config.ts` imports from it, so
      # it decides which files the coverage threshold holds. `.github/**` is not listed either,
      # because a change to how the suite runs has to be run.
      - name: Decide whether the diff can reach a test
        id: scope
        uses: ./.github/actions/diff-scope
        with:
          base-ref: ${{ github.base_ref }}
          ignore: |
            docs/*
            *.md
            .claude/*
            .agents/*
            .cursor/*
            .gemini/*

  test-shard:
    needs: test-scope
    if: needs.test-scope.outputs.relevant == 'true'
    runs-on: ubuntu-latest
    permissions:
      contents: read

    strategy:
      # One machine failing says nothing about the others, and the comment has to list
      # every test that broke. Cancelling the rest would report a subset as the whole.
      fail-fast: false
      matrix:
        # **The only declaration of how many machines the suite is split across.** The
        # denominator each machine passes to `--shard` is read back from `strategy.job-total`,
        # so writing it twice would let the two drift silently: with a denominator of 5 and
        # four entries here, the fifth bucket never runs and the merge blames coverage.
        #
        # Four is where the curve flattens — roughly 30s of fixed cost per machine against a
        # run of roughly 100s, and every machine is billed to whoever created their repository
        # from this template.
        shard: [1, 2, 3, 4]

    steps:
      - name: Harden the runner
        uses: bullfrogsec/bullfrog@7dee337d4575320b6d8cbe9a56d48d2fb765963a # v0.11.1
        with:
          egress-policy: block
          dns-policy: allowed-domains-only
          enable-sudo: false
          allowed-ips: |
            127.0.0.100
            172.17.0.1
          allowed-domains: |
            github.com
            api.github.com
            codeload.github.com
            release-assets.githubusercontent.com
            *.actions.githubusercontent.com
            *.blob.core.windows.net
            *.githubapp.com
            mise-versions.jdx.dev
            nodejs.org
            registry.npmjs.org

      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - name: Setup mise and the pinned tools
        uses: ./.github/actions/setup-mise
        with:
          tools: core:node aqua:pnpm/pnpm
          github-token: ${{ secrets.GITHUB_TOKEN }}

      - name: Install dependencies
        uses: ./.github/actions/setup-deps
      - name: Run this machine's share of the suite
        env:
          SHARD_INDEX: ${{ matrix.shard }}
          SHARD_TOTAL: ${{ strategy.job-total }}
        run: make test-shard SHARD="${SHARD_INDEX}/${SHARD_TOTAL}"

      # `if: always()` so a shard that failed still hands over what it recorded. Without it
      # a single failure would leave the merge with a hole, and the hole would surface as a
      # coverage shortfall rather than as the test that actually broke.
      - name: Hand the recorded run to the collecting job
        if: always()
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: test-blob-${{ matrix.shard }}
          path: tmp/test-blob/
          retention-days: 1
          # `error`, not `ignore`. A machine that recorded nothing has to say so here, where
          # its own log is in hand — swallowing it makes the collecting job report "no
          # machine reported" for a cause that happened four minutes earlier and elsewhere.
          if-no-files-found: error

      # The exit code this machine returned, plus the tail of its own output. The merged JSON
      # carries case outcomes and coverage only, so a machine that exits non-zero without
      # recording a single failure leaves no trace there — the merge succeeds and the comment
      # says every test passed while the check goes red. Its log lives on this machine, so it
      # travels with the status file.
      - name: Hand over the exit code this machine returned
        if: always()
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: test-shard-status-${{ matrix.shard }}
          path: tmp/test-shard-status/
          retention-days: 1
          if-no-files-found: error

  test:
    needs: [test-scope, test-shard]
    # The collecting job runs whatever the shards did, including when none started. A shard
    # that failed still has to produce a red `test` and a comment saying which test broke; a
    # job that never starts reports nothing, and a required context that never arrives blocks
    # the merge forever.
    if: always()
    runs-on: ubuntu-latest
    permissions:
      contents: read
      pull-requests: write
      actions: read

    steps:
      - name: Harden the runner
        uses: bullfrogsec/bullfrog@7dee337d4575320b6d8cbe9a56d48d2fb765963a # v0.11.1
        with:
          egress-policy: block
          dns-policy: allowed-domains-only
          enable-sudo: false
          allowed-ips: |
            127.0.0.100
            172.17.0.1
          allowed-domains: |
            github.com
            api.github.com
            codeload.github.com
            release-assets.githubusercontent.com
            *.actions.githubusercontent.com
            *.blob.core.windows.net
            *.githubapp.com
            mise-versions.jdx.dev
            nodejs.org
            registry.npmjs.org

      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - name: Setup mise and the pinned tools
        if: needs.test-scope.outputs.relevant == 'true'
        uses: ./.github/actions/setup-mise
        with:
          tools: core:node aqua:pnpm/pnpm
          github-token: ${{ secrets.GITHUB_TOKEN }}

      - name: Install dependencies
        if: needs.test-scope.outputs.relevant == 'true'
        uses: ./.github/actions/setup-deps

      - name: Collect what every machine recorded
        if: needs.test-scope.outputs.relevant == 'true'
        uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8.0.2
        with:
          path: tmp/test-blob/
          pattern: test-blob-*
          merge-multiple: true

      # Separate from the blobs on purpose: the blob directory is counted by name to decide
      # how many machines reported, so a second kind of file there would change that count.
      - name: Collect what every machine returned
        if: needs.test-scope.outputs.relevant == 'true'
        uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8.0.2
        with:
          path: tmp/test-shard-status/
          pattern: test-shard-status-*
          merge-multiple: true

      # **A missing blob is not a coverage shortfall.** A shard that died before writing one
      # leaves the merge measuring less than the whole suite, and the threshold would then
      # report unreached lines for code whose tests never ran. Naming the count first means
      # the report says which machine went missing instead of blaming the code. The count
      # comes out of the blob file names, never from a number written here.
      - name: Fail if a machine did not report
        if: needs.test-scope.outputs.relevant == 'true'
        shell: bash
        run: make test-shards-verify

      # The body is built by `make test-failures`, so the wiring lives in one place and a
      # local `make test-failures` prints exactly what the comment will say. What it reads is
      # vitest's own JSON report — `status` and `failureMessages`, the split the runner already
      # made — never a text filter that classifies by vocabulary.
      #
      # Do not read `tmp/test-report.json` here or anywhere else. It records passing cases too,
      # with full paths, and measures 785KB against the 690B of the plain text output.
      - name: Merge the runs and check coverage
        id: test
        if: needs.test-scope.outputs.relevant == 'true'
        shell: bash
        run: |
          set +e

          make test-failures TEST_RUN=test-merge > /tmp/test-comment.log 2>&1
          code=$?

          if [ "${code}" -eq 0 ]; then
            echo "status=success" >> "$GITHUB_OUTPUT"
            echo "title=## ✅ Test: PASS (Vitest + coverage)" >> "$GITHUB_OUTPUT"
          else
            echo "status=failure" >> "$GITHUB_OUTPUT"
            echo "title=## ❌ Test: FAIL (Vitest + coverage)" >> "$GITHUB_OUTPUT"
          fi

          exit 0

      - name: Report test coverage
        if: always() && needs.test-scope.outputs.relevant == 'true'
        uses: k1LoW/octocov-action@a167dc0dee441b7ffc45e1b862ab55ec0d87f278 # v1

      # A job that stood down still owes the pull request a verdict (README § PR Comments, the
      # `diff-scope` bullet). Standing down is read only from a scope that ANSWERED: one that
      # never resolved would otherwise report green without the diff ever being looked at.
      - name: Note that the suite did not run
        id: standdown
        if: always() && needs.test-scope.outputs.relevant != 'true'
        shell: bash
        env:
          SCOPE: ${{ needs.test-scope.result }}
        run: |
          if [ "${SCOPE}" != "success" ]; then
            echo 'status=failure' >> "$GITHUB_OUTPUT"
            echo 'title=## ❌ Test: FAIL (scope could not be decided)' >> "$GITHUB_OUTPUT"
            echo '差分がテストに届くかを判定できませんでした。test-scope ジョブのログを見てください。' > /tmp/test-comment.log
          else
            echo 'status=success' >> "$GITHUB_OUTPUT"
            echo 'title=## ⏭️ Test: SKIP (diff cannot reach a test)' >> "$GITHUB_OUTPUT"
            echo 'この PR の差分はテストに届かないため、Vitest を実行していません。' > /tmp/test-comment.log
          fi

      # octocov reports coverage under its own comment and says nothing about which test
      # failed. A red check with no body sends the author to the run log for something CI
      # already had in hand.
      - name: Comment the test result on PR
        if: always() && github.event_name == 'pull_request'
        continue-on-error: true
        uses: ./.github/actions/upsert-pr-comment
        with:
          github-token: ${{ secrets.GITHUB_TOKEN }}
          marker: '<!-- test-result -->'
          status: ${{ steps.standdown.outputs.status || steps.test.outputs.status }}
          title: ${{ steps.standdown.outputs.title || steps.test.outputs.title }}
          body-file: /tmp/test-comment.log
          # `make test-failures` writes the body through `scripts/test-report`, which puts
          # every unaltered value inside a fence sized to its own content. That is the second
          # way the input's contract can be met, and it is what lets the counts and the
          # per-case headings read as markup instead of as literal characters.
          body-sanitized: 'true'
          details-summary: 'Vitest の失敗（全件）'

      # Two conditions, because they fail for different reasons. The merge speaks for the
      # tests and the threshold; `needs` speaks for a machine that never got that far — a
      # cancelled run, a runner that died, a step before the suite that broke. Neither is asked
      # of a run that stood down, and a scope that never answered is a failure of its own.
      - name: Fail if Vitest failed
        if: >-
          always() && (needs.test-scope.result != 'success'
          || (needs.test-scope.outputs.relevant == 'true'
          && (steps.test.outputs.status != 'success' || needs.test-shard.result != 'success')))
        run: exit 1
