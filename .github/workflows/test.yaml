name: Test

# Vitest with coverage — the same full, cache-free command the pre-push hook
# runs. The hook catches failures before push; CI is the authoritative gate.
#
# Deliberately unfiltered by `paths`; the reason every CI Checks workflow runs on
# every PR is in README.md.

on:
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  test:
    runs-on: ubuntu-latest
    permissions:
      contents: read
      pull-requests: write
      actions: read

    steps:
      - name: Harden the runner
        uses: step-security/harden-runner@bf7454d06d71f1098171f2acdf0cd4708d7b5920 # v2.20.0
        with:
          egress-policy: block
          allowed-endpoints: >
            github.com:443
            api.github.com:443
            codeload.github.com:443
            release-assets.githubusercontent.com:443
            *.actions.githubusercontent.com:443
            *.blob.core.windows.net:443
            *.githubapp.com:443
            prod.app-api.stepsecurity.io:443
            mise-versions.jdx.dev:443
            nodejs.org:443
            registry.npmjs.org:443

      - name: Checkout
        uses: actions/checkout@9c091bb21b7c1c1d1991bb908d89e4e9dddfe3e0 # v7.0.0
        with:
          persist-credentials: false

      - name: Setup mise and the pinned tools
        uses: ./.github/actions/setup-mise
        with:
          tools: core:node aqua:pnpm/pnpm
          github-token: ${{ secrets.GITHUB_TOKEN }}

      - name: Resolve the pnpm store path
        id: pnpm-store
        shell: bash
        run: |
          path="$(pnpm store path)"
          echo "path=${path}" >> "$GITHUB_OUTPUT"

      - name: Cache the pnpm store
        uses: actions/cache@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
        with:
          path: ${{ steps.pnpm-store.outputs.path }}
          key: ${{ runner.os }}-pnpm-store-${{ hashFiles('pnpm-lock.yaml') }}
          restore-keys: ${{ runner.os }}-pnpm-store-

      - name: Install dependencies
        run: pnpm install --frozen-lockfile --ignore-scripts

      - name: Run Vitest with coverage
        id: test
        shell: bash
        run: |
          set +e

          make test-full 2>&1 | tee /tmp/test.log
          code=${PIPESTATUS[0]}

          if [ "${code}" -eq 0 ]; then
            echo "status=success" >> "$GITHUB_OUTPUT"
            echo "title=## ✅ Test: PASS (Vitest + coverage)" >> "$GITHUB_OUTPUT"
          else
            echo "status=failure" >> "$GITHUB_OUTPUT"
            echo "title=## ❌ Test: FAIL (Vitest + coverage)" >> "$GITHUB_OUTPUT"
          fi

          exit 0

      # The TAIL, not the head. Vitest prints each failure's diff and then the run summary,
      # so a body truncated from the front drops exactly the part that says what broke —
      # and the coverage table, which is what a threshold failure is about, is last of all.
      - name: Cut the comment body down to the failures
        if: always() && steps.test.outputs.status != ''
        shell: bash
        run: tail -n 400 /tmp/test.log > /tmp/test-comment.log

      - name: Report test coverage
        if: always()
        uses: k1LoW/octocov-action@a167dc0dee441b7ffc45e1b862ab55ec0d87f278 # v1

      # octocov reports coverage under its own comment and says nothing about which test
      # failed. A red check with no body sends the author to the run log for something CI
      # already had in hand.
      - name: Comment the test result on PR
        if: always() && github.event_name == 'pull_request'
        continue-on-error: true
        uses: ./.github/actions/upsert-pr-comment
        with:
          github-token: ${{ secrets.GITHUB_TOKEN }}
          marker: '<!-- test-result -->'
          status: ${{ steps.test.outputs.status }}
          title: ${{ steps.test.outputs.title }}
          body-file: /tmp/test-comment.log
          details-summary: 'Vitest log (末尾 400 行)'

      - name: Fail if Vitest failed
        if: always() && steps.test.outputs.status != 'success'
        run: exit 1
