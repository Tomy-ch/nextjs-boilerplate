name: Setup mise
description: Install the pinned mise binary and the runtimes it manages, verifying the binary against a pinned digest

# The cache holds an executable, and an Actions cache is not a trust boundary —
# entries are shared across branches and can be written by anything with push
# access. The binary is therefore verified against the digest pinned below before it
# is ever executed, as `uses:` is pinned to a SHA and container images to a digest.
# A mismatch discards the cache and re-downloads; a mismatch after that fails.

inputs:
  tools:
    required: false
    default: ""
    description: >-
      Space-separated mise tool specifications to install; empty installs nothing.
      Versions come from mise.toml (ADR 0003), so only names appear here, and each
      carries its backend prefix because every mise.toml key is backend-qualified —
      a bare `node` does not match `core:node`.
  github-token:
    required: true
    description: Token used for the GitHub API rate limit while mise resolves tools

runs:
  using: composite
  steps:
    - name: Resolve the mise paths
      id: paths
      shell: bash
      run: |
        echo "bin=${HOME}/.local/bin" >> "$GITHUB_OUTPUT"
        echo "binary=${HOME}/.local/bin/mise" >> "$GITHUB_OUTPUT"

    - name: Restore the mise binary
      id: cache
      uses: actions/cache@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
      with:
        path: ${{ steps.paths.outputs.binary }}
        # The digest is part of the key so a version bump can never reuse an older
        # entry, and a re-pinned digest invalidates the cache on its own.
        key: mise-${{ runner.os }}-${{ runner.arch }}-2026.7.12-dad54e0b

    # Downloading the release asset directly rather than piping the install script:
    # a retried pipe feeds whatever arrived before the failure straight into the
    # shell. The file is verified before it is marked executable.
    - name: Install and verify the mise binary
      shell: bash
      env:
        MISE_VERSION: 2026.7.12
        MISE_SHA256: dad54e0b843908324282b8673f9c0ebc3a4da0c49ad2da309a49bfbc918ba180
        BIN_DIR: ${{ steps.paths.outputs.bin }}
        BINARY: ${{ steps.paths.outputs.binary }}
      run: |
        set -euo pipefail

        verify() {
          [ -f "$BINARY" ] || return 1
          echo "${MISE_SHA256}  ${BINARY}" | sha256sum --check --status
        }

        if verify; then
          echo "✅ cached mise matches the pinned digest"
        else
          if [ -f "$BINARY" ]; then
            echo "⚠️ cached mise does not match the pinned digest; discarding it"
            rm -f "$BINARY"
          fi

          mkdir -p "$BIN_DIR"
          url="https://github.com/jdx/mise/releases/download/v${MISE_VERSION}/mise-v${MISE_VERSION}-linux-x64"
          # `--location` follows the release-asset redirect, and the pinned digest is
          # what decides whether the bytes are the right ones. Constraining both the
          # first request and the redirects to https is the cheaper half of that: it
          # keeps the asset off a plaintext hop, where the digest would still catch
          # tampering but only after the download had already been observed.
          curl --fail --location --proto '=https' --proto-redir '=https' \
            --silent --show-error \
            --retry 5 --retry-delay 3 --retry-all-errors \
            --output "$BINARY" "$url"

          if ! verify; then
            echo "❌ downloaded mise does not match the pinned digest (expected ${MISE_SHA256})"
            sha256sum "$BINARY" || true
            exit 1
          fi
          echo "✅ downloaded mise matches the pinned digest"
        fi

        chmod +x "$BINARY"
        echo "$BIN_DIR" >> "$GITHUB_PATH"
        echo "${HOME}/.local/share/mise/shims" >> "$GITHUB_PATH"

    - name: Install the requested tools
      if: inputs.tools != ''
      shell: bash
      env:
        GITHUB_TOKEN: ${{ inputs.github-token }}
        TOOLS: ${{ inputs.tools }}
      run: |
        set -euo pipefail

        mise --version
        # Word splitting is intended: the input is a space-separated specification list.
        # shellcheck disable=SC2086
        mise install $TOOLS
