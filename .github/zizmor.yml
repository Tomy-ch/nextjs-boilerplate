# zizmor の設定。`make actions-zizmor`（pre-commit / Actions Lint）が読む。
#
# 抑止の様式 —— `ignore` をまず使い、ファイルで絞れない audit だけ severity を引き下げること、
# 引き下げには撤回条件を書くこと —— は ADR 0110 §3.4 が正。ここに書くのは各エントリの理由、
# つまり「このファイルのこの所見をなぜ許すか」だけである。

rules:
  # `.github/actions/setup-baselines` が App token を `repositories:` ではなく `owner:` で絞り、
  # 権限も個別指定していない。絞り方は意図したもので、理由はそのステップ自身が持つ（App が入って
  # いるのはこのリポジトリと基準画像の置き場の 2 つだけで、置き場の名前をここへ書くと .gitmodules
  # が持つ配線を二重に持つ）。権限の絞り込みのほうは実在の穴だが、App の secret 無しでは確かめ
  # られないため別に追う。
  github-app:
    remap:
      severity: medium

  # `.github/actions/setup-mise` が `$GITHUB_PATH` へツールの位置を書く。setup 系の action が
  # ツールチェインを公開する唯一の手段であり、書く値は action 自身の計算結果でイベントデータでは
  # ない。zizmor 自身もこの検出を低確度としている。
  github-env:
    remap:
      severity: medium

  # `baseline-retake.yaml` は、終わった比較に反応する必要があるので `workflow_run` で起動する。
  # この trigger の危うさ —— fork の head に対してベースリポジトリの文脈で書き込み可能な token が
  # 渡る —— は、何も checkout する前に明示的に拒んでいる。拒否がジョブの最初の仕事である。
  dangerous-triggers:
    ignore:
      - baseline-retake.yaml

  # `vrt-guard.yaml` が保護ブランチへの push で pnpm の store を復元するのを、zizmor は成果物の
  # 配信と読む。ここでは何も配信していない。ジョブがするのは画像の比較だけで、cache は lockfile の
  # ハッシュを鍵にした依存の置き場であり、ブランチに閉じている。
  cache-poisoning:
    ignore:
      - vrt-guard.yaml
