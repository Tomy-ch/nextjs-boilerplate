# runner から外へ出てよい宛先と、job に残す権限（SSOT）。
# `make egress-apply` で各 job 冒頭の bullfrog へ反映し、`make egress-check` で突合する。
#
# ここに無い宛先へ出ようとした実行は落ちる（`egress-policy: block`。名前解決も許した宛先に
# 限る —— `dns-policy: allowed-domains-only`）。足す根拠は実測に置く —— bullfrog は後処理で
# 自分のログをジョブログへ出し、そこに問い合わせた名前が `DNS Question:` 行で残る。
#
#   gh api "repos/<owner>/<repo>/actions/runs/<RUN_ID>/jobs" --jq '.jobs[].id'
#   gh api "repos/<owner>/<repo>/actions/jobs/<JOB_ID>/logs" \
#     | grep -a "DNS Question:" | sed 's/.*DNS Question: //; s/ .*//; s/\.$//' | sort -u
#
# 宛先ごとの判定（Authorized / Unauthorized / Blocked）は run の job summary に表で出る。
#
# **cache が当たった実行だけを見ないこと。**依存を取りに行かない実行には
# `registry.npmjs.org` が出ない。lockfile を動かした実行、ツールを入れ直した実行、
# コンテナを pull した実行を必ず混ぜる。
#
# 書式は bullfrog の `allowed-domains` と同じドメイン名だけで、port は書かない（bullfrog は
# port で絞らない）。`*.example.com` は添字が回る宛先を畳むためのもので、**apex を含まない**
# —— `example.com` も要るなら別に並べる。

# 全 job が要るもの。checkout・ツールチェインの取得・依存の取得・結果の返送。
baseline:
  - github.com
  - api.github.com
  - codeload.github.com
  - release-assets.githubusercontent.com
  # 結果の返送と cache。添字が回るので畳む。
  - '*.actions.githubusercontent.com'
  - '*.blob.core.windows.net'
  # hosted runner 自身の監視系。
  - '*.githubapp.com'
  # mise とそれが入れるランタイム。
  - mise-versions.jdx.dev
  - nodejs.org
  - registry.npmjs.org

# 全 job が許す IP。**キーが宛先、値が理由と外す条件。**
ips:
  '127.0.0.100': >-
    hosted runner の一部（westus2）では egress proxy の試験が /etc/resolv.conf を書き換え、
    先頭の nameserver を 127.0.0.100 のローカル転送役にしている（`actions/runner-images#14925`）。
    bullfrog が信用する DNS サーバは 127.0.0.53・resolvectl が eth0 に持つサーバ・allowed-ips
    だけなので、許さないとこの宛先への問い合わせが落ち、名前解決が止まる。転送役の先の
    問い合わせも bullfrog の DNS 判定を通るため、許すドメインは広がらない。外す条件は、
    試験が終わり runner の resolv.conf が 127.0.0.53 だけを指すようになること。

# job 固有。キーは workflow のファイル名（拡張子を除く）。
# ここに無い workflow は baseline だけで足りる。
workflows:
  # `next/font` が build 時に取りに行く。
  build: &fonts
    - fonts.googleapis.com
    - fonts.gstatic.com
  bundle-budget: *fonts
  purge-verify: *fonts
  smoke: *fonts
  strip-verify: *fonts
  storybook-build: *fonts
  deploy-docs: *fonts

  # 撮影と axe は digest 固定した Playwright のコンテナで動く。地域ごとの配信元が回る。
  a11y: &browser
    - fonts.googleapis.com
    - fonts.gstatic.com
    - mcr.microsoft.com
    - '*.data.mcr.microsoft.com'
  e2e: *browser
  vrt: *browser
  vrt-guard: *browser
  # 撮り直しは撮影と同じ仕事をする —— Storybook を build し、同じコンテナで走らせる。
  baseline-retake: *browser

  # 計測はブラウザをコンテナへ閉じ込めないため、ホストへ取得したうえで走らせる。出るのは
  # 取得そのもの (cdn.playwright.dev) と、起動した Chrome 自身の背景通信の 2 系統。
  # 撮影側 (a11y / e2e / vrt) に取得先が要らないのは、あちらが digest 固定のコンテナを引くため。
  lighthouse:
    # ブラウザの取得。`cdn.playwright.dev` は入口で、実体はここから 2 つの配信元へ回る。
    # 3 つとも要る —— 入口だけを許すと、繋がったうえで本体の取得が落ちる。
    - cdn.playwright.dev
    - playwright.download.prss.microsoft.com
    - storage.googleapis.com
    - fonts.googleapis.com
    - fonts.gstatic.com
    - accounts.google.com
    - android.clients.google.com
    - clients2.google.com
    - mtalk.google.com
    - update.googleapis.com
    - www.google.com

  # ZAP のコンテナと、その add-on / 更新確認。
  dast:
    - fonts.googleapis.com
    - fonts.gstatic.com
    - ghcr.io
    - pkg-containers.githubusercontent.com
    - raw.githubusercontent.com
    - cfu.zaproxy.org
    - news.zaproxy.org
    - tel.zaproxy.org

  # aqua が入れる道具の署名を検証する。
  actions-lint:
    - tuf-repo-cdn.sigstore.dev
  osv-scan:
    - api.osv.dev
    - tuf-repo-cdn.sigstore.dev
  dependency-scan:
    - check.trivy.dev
    - mirror.gcr.io
    # Trivy は脆弱性 DB を mirror から取り、応えなければ ghcr へ落ちる。2 段目を塞ぐと
    # 二段構えが成立せず、mirror が詰まるたびに必須チェックが赤くなる。
    # ghcr の pull は blob を pkg-containers から取るため、2 ホストで 1 組。
    - ghcr.io
    - pkg-containers.githubusercontent.com
    - tuf-repo-cdn.sigstore.dev

  # 各スキャナが自分の索引・DB・テレメトリへ出る。
  bearer:
    - api.cycode.com
  sast:
    - semgrep.dev
  devskim:
    - api.nuget.org
    - crl3.digicert.com
  dependency-review:
    - api.deps.dev
    - api.securityscorecards.dev
  scorecard:
    - api.deps.dev
    - api.osv.dev
    # action 自体が ghcr のコンテナで、pull の blob は pkg-containers から取る。
    - ghcr.io
    - pkg-containers.githubusercontent.com
    - oss-fuzz-build-logs.storage.googleapis.com
    - www.bestpractices.dev

  # 解析の本体は scanner が SonarCloud へ送る。scanner の取得（`binaries.sonarsource.com`）と
  # 送信先が別ホストで、送信は API・scanner 用の入口・可視化用の置き場の 3 つに割れている。
  # `keyserver.ubuntu.com` は scanner の署名の検証で引く。
  sonarcloud:
    - sonarcloud.io
    - api.sonarcloud.io
    - scanner.sonarcloud.io
    - binaries.sonarsource.com
    # 可視化用の置き場。名前に region と環境が入っており、上流が移せば綴りごと変わる。
    - dna-visualization-scannerdata-eu-central-1-prod.s3.eu-central-1.amazonaws.com
    - keyserver.ubuntu.com

  # SARIF の送信先。
  codeql:
    - uploads.github.com
  # shadcn の目録の取得元。
  shadcn-drift:
    - cafe.github.com

# まだ遮断しない workflow。**理由と、外す条件をここに書く。**
# 記録が揃っていないものを推測で並べると、止めてはいけない実行を止める。
audit:
  notify: >-
    Slack の incoming webhook へ出るが、実行の記録がまだ 1 件も無い（週次のスキャンが落ちた
    ときにしか動かない）。外す条件は、実際に通知が飛んだ実行のログで宛先を確認すること。
  baseline-prune: >-
    月次でしか動かず、実行の記録がまだ無い。外す条件は同上。
  tools-cooldown: >-
    pin の公開日時を api.github.com / pypi.org / registry.npmjs.org から引くが、
    実行の記録がまだ無い。外す条件は、mise.toml を動かした PR の実行ログで宛先を確認すること。

# sudo を残す job。**既定は残さない**（`enable-sudo: false`）—— sudo が残ると raw socket で
# 遮断の外へ出られ、遮断の規則そのものも外せる。sudo を外すと bullfrog は docker の API も
# 絞り、特権コンテナ・ホストのパスのマウント・ホストの名前空間の共有を拒む。
# キーは workflow のファイル名 → `jobs:` の下のキー、値は**その job が sudo 無しで動かない根拠**。
# **ここに載せた job では遮断そのものを外せる**ので、渡す token は最も狭いものに限る。
sudo:
  a11y:
    a11y: &browser-runner >-
      Playwright を `docker-compose.dev-tools.yml` の browser_runner で走らせる。browser_runner
      はリポジトリのマウント（`.:/app`）と `ipc: host` を要し、sudo を外した docker はどちらも拒む。
  e2e:
    e2e: *browser-runner
  vrt:
    vrt-shard: *browser-runner
  vrt-guard:
    guard: *browser-runner
  baseline-retake:
    retake: *browser-runner
  dast:
    dast: >-
      `make dast` が `docker-compose.dev-tools.yml` の zap を起動する。zap はリポジトリを
      `.:/zap/wrk` でマウントし、sudo を外した docker はホストのパスのマウントを拒む。
  scorecard:
    scorecard: >-
      `ossf/scorecard-action` は Docker コンテナの action で、runner が workspace と
      docker.sock をホストのパスとしてマウントして起動する。sudo を外した docker はこれを拒む。
