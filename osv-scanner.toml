# OSV の抑止宣言（docs/adr/0110-security-operations.md 3.4）。
#
# 抑止は脆弱性 ID 1 件単位に限る。ルールやスキャナの一括無効化は禁止 —— 範囲を絞らない抑止は、
# 同じ検知を踏む新規の依存まで素通りさせる。
#
# 各エントリに reason（なぜ許容するか）を必ず書く。理由を書けないものは抑止せず、値そのものを
# 消すか依存を上げる。条件が変われば削除する（恒久 allowlist にしない）。

[[IgnoredVulns]]
id = "GHSA-vfj7-8cjw-p6xm"
ignoreUntil = 2026-11-02
reason = "braces の展開が深く入れ子になったパターンでスタックを使い切る。修正版は無い（全版が影響範囲で、3.0.3 が最終の影響版）。経路は micromatch を通じた eslint-plugin-boundaries / fast-glob（shadcn CLI・ts-morph）/ globby / markdownlint-cli2 で、開発時の lint と CLI にしか現れず、本番の依存（pnpm why --prod）にも配信物にも入らない。展開するパターンはリポジトリの設定が書いたもので、外からの入力を受けない。修正版が公開され依存更新で取り込めた時点、または助言が取り下げられた時点で削除する。期限を過ぎたら、修正版の有無を確かめて延ばすか外すかを決める。"
