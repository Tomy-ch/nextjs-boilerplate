# OSV の抑止宣言（docs/adr/0110-security-operations.md 3.4）。
#
# 抑止は脆弱性 ID 1 件単位に限る。ルールやスキャナの一括無効化は禁止 —— 範囲を絞らない抑止は、
# 同じ検知を踏む新規の依存まで素通りさせる。
#
# 各エントリに reason（なぜ許容するか）を必ず書く。理由を書けないものは抑止せず、値そのものを
# 消すか依存を上げる。条件が変われば削除する（恒久 allowlist にしない）。
# 修正版の無い脆弱性は ignoreUntil で期限を切り、reason には日付を書かない。過ぎると再判断を強制する。

[[IgnoredVulns]]
id = "GHSA-238p-pmpm-9mq7"
ignoreUntil = 2026-11-07
reason = "KaTeX が、既に汚染された Object.prototype の継承プロパティを描画の設定（trust など）として読む。KaTeX 自身は汚染を起こさず、別の脆弱性で汚染が起きたときの増幅器にとどまる（low）。修正版の 0.18.2 は引き元の宣言範囲（mermaid ^0.16.47 / micromark-extension-math ^0.16.0）の外にあり、mermaid は最新の 12.x でも ^0.16 を宣言している。間の 0.18.0 は CSS クラス名に接頭辞を付ける破壊的変更で、mermaid の数式描画と組み合わせが崩れるため、固定で範囲の外へ動かさない。mermaid が 0.18.2 以上を引けるようになった時点で依存更新で取り込み、ここを削除する。期限を過ぎたら、mermaid の宣言を確かめて延ばすか外すかを決める。"

[[IgnoredVulns]]
id = "GHSA-mrhx-c7xc-m3w5"
ignoreUntil = 2026-11-07
reason = "zod が上限付きの集合の検証で、過大な入力にメモリを使い切る（high）。zod 4 系は修正版の 4.6.6 以上へ上げてあり、残るのは lighthouse → puppeteer-core → chromium-bidi 17 が引く 3.x だけで、3.x に修正版は無い。chromium-bidi 17 の宣言は ^3.24.1 で、4.x は範囲の外。zod 4 を引く chromium-bidi 157.0.8090-0（puppeteer-core 25.13.0 以降が引く）は以前の版にあった trusted publisher の証拠を持たず、pnpm の trust policy が乗っ取りの可能性として拒む。この経路は Lighthouse の計測時にしか走らず、本番の依存（pnpm why --prod）にも配信物にも入らない。zod が検証するのは自分で起動した Chrome との BiDi のメッセージで、外からの入力を受けない。lighthouse が trust の通る zod 4 系の chromium-bidi を引けるようになった時点で依存更新で取り込み、ここを削除する。期限を過ぎたら、chromium-bidi の trust と宣言を確かめて延ばすか外すかを決める。"
