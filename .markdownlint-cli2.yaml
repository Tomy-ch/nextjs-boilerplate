# markdownlint-cli2 の対象範囲（globs / ignores）を定義する。
# ルール本体（MD013/MD033/MD041=false 等）は .markdownlint.yaml を自動マージして解決する。
globs:
  - "**/*.md"

# mermaid-lint.ts の除外（EXCLUDE_DIRS/FILES）と一致させる。
# 保護対象であることは除外の理由にならない（保護は「誰が編集してよいか」の話で、linter が読んでよいかとは
# 無関係）。除外してよいのは linter が読むべきでない領域（依存・git の管理領域）だけ。
ignores:
  - "**/node_modules/**"
  - ".git/**"
