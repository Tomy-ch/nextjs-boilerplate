# markdownlint-cli2 の対象範囲（globs / ignores）を定義する。
# ルール本体（MD013/MD033/MD041=false 等）は .markdownlint.yaml を自動マージして解決する。
globs:
  - "**/*.md"

# mermaid-lint.ts の除外（EXCLUDE_DIRS/FILES）と一致させる。
# .claude 配下は保護エージェント設定 + worktree 実体を含むため除外。
# AGENTS.md / CLAUDE.md は保護ドキュメント、.github/copilot-instructions.md は Copilot 用エージェント設定。
ignores:
  - "**/node_modules/**"
  - ".git/**"
  - ".claude/**"
  - "AGENTS.md"
  - "CLAUDE.md"
  - ".github/copilot-instructions.md"
