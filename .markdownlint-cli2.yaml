# markdownlint-cli2 の対象範囲（globs / ignores）を定義する。
# ルール本体（MD013/MD033/MD041=false 等）は .markdownlint.yaml を自動マージして解決する。
globs:
  - "**/*.md"

# mermaid-lint.ts の除外（EXCLUDE_DIRS/FILES）と一致させる。
# 保護対象であることは除外の理由にならない（保護は「誰が編集してよいか」の話で、linter が読んでよいかとは
# 無関係）。.github/copilot-instructions.md だけは Copilot 側の設定であり、AGENTS.md「Agent configuration
# file protection」によりユーザ指示なしに直せない = 違反しても解消できないため、ゲートに載せない。
ignores:
  - "**/node_modules/**"
  - ".git/**"
  - ".github/copilot-instructions.md"
  # graphify の出力。gitignore 済みだが markdownlint は .gitignore を見ないため、ここで外さないと
  # グラフを生成した人だけ GRAPH_REPORT.md で pre-commit が落ちる。
  - "graphify-out/**"
