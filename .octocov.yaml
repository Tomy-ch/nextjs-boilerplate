coverage:
  paths:
    - coverage/lcov.info
codeToTestRatio:
  code:
    - "**/*.{ts,tsx}"
    - "!**/*.test.{ts,tsx}"
    - "!next-env.d.ts"
  test:
    - "**/*.test.{ts,tsx}"
testExecutionTime:
  if: true
comment:
  if: is_pull_request
  # 既定は push のたびに新しいコメントを作る。3 回 push した PR には 3 枚並ぶ。
  # ほかの検査ログは同じ PR で 1 枚を更新し続けるので（.github/actions/upsert-pr-comment）、
  # ここだけ積み上がると、緑の検査を黙らせて減らした分をそのまま埋め戻すことになる。
  updatePrevious: true
report:
  if: env.GITHUB_BASE_REF == 'production'
  datastores:
    - artifact://${GITHUB_REPOSITORY}
diff:
  datastores:
    - artifact://${GITHUB_REPOSITORY}
